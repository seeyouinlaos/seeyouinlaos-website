<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>About you · See You In Laos</title><style>
@font-face{font-family:'PP Editorial Old';src:url('assets/fonts/PPEditorialOld-Ultralight.otf') format('opentype');font-weight:200;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}body{background:#F3EEE7;color:#313131;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;font-weight:300;font-size:14px;line-height:1.6}
.hd{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:14px 20px}
.hb{width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:5px;background:none;border:0;cursor:pointer}.hb i{display:block;width:20px;height:1.4px;background:#313131}
.bd{font-family:'PP Editorial Old',serif;font-weight:200;font-size:19px;text-align:center}.bd .dot{color:#8A5A55}
.bag{width:44px;height:44px;display:flex;align-items:center;justify-content:center;position:relative;color:#313131;text-decoration:none}.bag .bgi{display:block}
.bb{position:absolute;top:1px;right:0;min-width:14px;height:14px;padding:0 3px;background:#313131;color:#F3EEE7;font-size:8.5px;line-height:1;letter-spacing:0;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px #F3EEE7;border-radius:1px}
main{padding:26px 24px 80px;max-width:640px;margin:0 auto}
h1{font-family:'PP Editorial Old',serif;font-weight:200;font-size:29px;margin-bottom:6px}
.sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#7C7A75;margin-bottom:16px}
h2{font-family:'PP Editorial Old',serif;font-weight:200;font-size:20px;margin:34px 0 10px}
.note{font-size:11.5px;color:#7C7A75;margin-top:14px;max-width:36em;line-height:1.8}
.tlink{display:inline-block;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:#313131;text-decoration:none;border-bottom:1px solid #313131;padding:8px 0 3px;min-height:44px}
.lede{font-size:15px;line-height:1.8;color:#313131;max-width:32em;margin-bottom:2px}
.body{font-size:13px;line-height:1.85;color:#4A4A4A;max-width:34em}
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 4px}
.tab{background:none;border:1px solid #DAD9D7;color:#7C7A75;cursor:pointer;font:inherit;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:14px 16px;min-height:46px}
.tab.on{border-color:#313131;color:#313131}
.forwho{font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;color:#7C7A75;margin:26px 0 0}
.q{border-top:1px solid #EDEBE7;padding:22px 0 4px}
.qn{font-size:9.5px;letter-spacing:2px;color:#7C7A75}
.qq{font-family:'PP Editorial Old',serif;font-weight:200;font-size:19px;line-height:1.3;margin:4px 0 4px}
.qh{font-size:12px;color:#7C7A75;line-height:1.7;margin-bottom:10px}
.qw{font-size:11px;color:#7C7A75;line-height:1.7;margin-top:8px;border-left:1px solid #DAD9D7;padding-left:12px}
textarea{width:100%;background:#FCFAF6;border:1px solid #DAD9D7;padding:13px 14px;font:inherit;font-size:14px;color:#313131;min-height:76px;resize:vertical;line-height:1.7}
textarea:focus{outline:0;border-color:#313131}
.none{display:inline-flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:#4A4A4A;cursor:pointer;min-height:44px}
.none input{width:18px;height:18px;accent-color:#313131}
.opsec{border-top:1px solid #DAD9D7;margin-top:30px;padding-top:6px}
.opl{font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;color:#7C7A75;margin:16px 0 0}
.saved{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:#7C7A75;margin-top:12px;min-height:14px}
.cta{display:block;width:100%;background:#313131;color:#F3EEE7;border:0;padding:19px;font-size:11px;letter-spacing:2.2px;text-transform:uppercase;text-align:center;text-decoration:none;margin-top:30px;cursor:pointer;min-height:52px;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif}
.nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:34px;border-top:1px solid #DAD9D7;padding-top:22px}
.nav .back,.nav .skipl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#7C7A75;text-decoration:none;border-bottom:1px solid #C9C4BA;padding:11px 0 3px;min-height:44px;display:inline-block;line-height:20px}
.nav .go{margin-left:auto;background:#313131;color:#F3EEE7;text-decoration:none;padding:17px 24px;font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;min-height:50px;display:inline-flex;align-items:center}
.gate{border:1px solid #DAD9D7;background:#FCFAF6;padding:24px 20px;margin-top:26px}
.gate h3{font-family:'PP Editorial Old',serif;font-weight:200;font-size:19px;margin-bottom:8px}
.gbtn{background:#313131;color:#F3EEE7;border:0;padding:17px 22px;font:inherit;font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;cursor:pointer;min-height:50px;margin-top:8px}
</style><link rel="stylesheet" href="assets/desktop.css"><link rel="stylesheet" href="assets/aman.css"><link rel="stylesheet" href="assets/prep.css"></head><body>
<header class="hd"><button class="hb" aria-label="Menu"><i></i><i></i><i></i></button><div class="bd">see you in laos<span class="dot">.</span></div><a class="bag" href="your-journey.html" aria-label="Your Journey"><svg class="bgi" viewBox="0 0 26 26" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5.1 10.1h15.8a.9.9 0 0 1 .9 1l-.95 10.6a1.6 1.6 0 0 1-1.6 1.45H6.75a1.6 1.6 0 0 1-1.6-1.45L4.2 11.1a.9.9 0 0 1 .9-1z"/><path d="M8 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M13.4 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M5.6 14.2h14.8"/><path d="M12.2 13.2h1.6a.5.5 0 0 1 .5.5v1.6a.5.5 0 0 1-.5.5h-1.6a.5.5 0 0 1-.5-.5v-1.6a.5.5 0 0 1 .5-.5z"/></svg><span class="bb" data-bag-badge></span></a></header>
<main id="about-you">
<h1>About you</h1>
<p class="sub">Optional · every answer welcome at any time</p>
<p class="lede">A few things that help us look after you personally.</p>
<div id="page"></div>
</main>
<script src="assets/bag.js"></script>
<script src="assets/shop-menu.js"></script>
<script src="assets/aman.js"></script>
<script src="assets/guest.js"></script>
<script src="assets/prep-shell.js"></script>
<script type="module" src="assets/invite.mjs"></script>
<script>
/* ============================================================================
   ABOUT YOU — the hospitality profile, and nothing else.
   It has its own page because it is its own step: a guest looking for the
   questions should never have to find them underneath somebody's contact
   details. Seven questions of hospitality, then, separated, the one
   operational field. Per named guest. Never required, never pre-answered,
   and never a reason a journey cannot be sent.
   ========================================================================== */
(function(){
var G=window.SIYL_GUEST,page=document.getElementById('page');
if(!G||!page)return;
var who=null;
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function gated(fn){if(window.SIYL_INVITE){SIYL_INVITE.require(fn)}
else document.addEventListener('siyl:invite-ready',function(){SIYL_INVITE.require(fn)},{once:true})}

function render(){
var p=G.party();
if(!p||!p.guests.length){
  page.innerHTML='<div class="gate"><h3>'+(G.stale()?'Open your invitation once more':'Open your invitation')+'</h3>'+
    '<p class="body">'+(G.stale()
      ? 'We&rsquo;ve updated your private journey so every choice can now be shown by name. Enter your invitation code once more. Your existing journey choices will remain.'
      : 'These answers belong to the people named on your invitation, so we open it first.')+'</p>'+
    '<button type="button" class="gbtn" id="open">Open my invitation</button></div>';
  document.getElementById('open').addEventListener('click',function(){gated(render)});
  return}
var id=who||p.guests[0].guestId;
var h='';
if(p.guests.length>1){
  h+='<p class="forwho" style="margin-top:6px">Who are you answering for?</p>';
  h+='<div class="tabs">'+p.guests.map(function(g){
    var n=G.profileAnswered(g.guestId);
    return '<button type="button" class="tab'+(g.guestId===id?' on':'')+'" data-who="'+esc(g.guestId)+'">'+
      esc(G.value(g.guestId,'preferredName')||g.fullName)+(n?' · '+n+' of 8':'')+'</button>'}).join('')+'</div>';
  h+='<p class="forwho">Answering for '+esc(G.value(id,'preferredName')||G.value(id,'fullName'))+'</p>'}
h+='<p class="body" style="margin-top:14px">Every answer is optional, and you can come back to this at any time. Nothing here changes a price, and leaving a question blank never means &ldquo;no&rdquo; — it simply means you have not told us.</p>';
G.PROFILE.forEach(function(q){
  var v=G.profile(id,q.key);
  h+='<div class="q"><p class="qn">'+q.n+'</p><p class="qq">'+q.q+'</p><p class="qh">'+q.hint+'</p>'+
     '<textarea data-q="'+q.key+'" data-g="'+esc(id)+'" placeholder="Optional" aria-label="'+esc(q.q)+'">'+esc(v==='NONE'?'':v)+'</textarea>'+
     (q.none?'<label class="none"><input type="checkbox" data-none="'+q.key+'" data-g="'+esc(id)+'"'+(v==='NONE'?' checked':'')+'><span>'+q.none+'</span></label>':'')+
     '<p class="qw">'+q.why+'</p></div>'});
/* the operational field is not hospitality, and never sits among the seven */
var a=G.ACCESS,av=G.profile(id,a.key);
h+='<div class="opsec"><p class="opl">Operational · not hospitality</p>'+
   '<div class="q" style="border-top:0"><p class="qq">'+a.q+'</p><p class="qh">'+a.hint+'</p>'+
   '<textarea data-q="'+a.key+'" data-g="'+esc(id)+'" placeholder="Optional" aria-label="'+esc(a.q)+'">'+esc(av==='NONE'?'':av)+'</textarea>'+
   '<label class="none"><input type="checkbox" data-none="'+a.key+'" data-g="'+esc(id)+'"'+(av==='NONE'?' checked':'')+'><span>Nothing to note</span></label>'+
   '<p class="qw">'+a.why+'</p></div></div>';
h+='<p class="saved" id="saved"></p>';
h+='<div class="nav"><a class="back" href="documents.html">Back</a>'+
   '<a class="skipl" href="review.html">Skip for now</a>'+
   '<a class="go" href="review.html">Save &amp; continue</a></div>';
page.innerHTML=h;

function mark(){
var s=document.getElementById('saved');if(s){s.textContent='Saved';setTimeout(function(){s.textContent=''},1600)}
/* the name tabs carry the count, so they must not go stale while typing */
page.querySelectorAll('.tab[data-who]').forEach(function(b){
  var gid=b.getAttribute('data-who'),n=G.profileAnswered(gid);
  b.textContent=(G.value(gid,'preferredName')||G.value(gid,'fullName'))+(n?' · '+n+' of 8':'')})}
page.querySelectorAll('textarea[data-q]').forEach(function(t){
  t.addEventListener('change',function(){G.setProfile(t.getAttribute('data-g'),t.getAttribute('data-q'),t.value.trim());mark()})});
page.querySelectorAll('input[data-none]').forEach(function(c){
  c.addEventListener('change',function(){
    var k=c.getAttribute('data-none'),g=c.getAttribute('data-g');
    G.setProfile(g,k,c.checked?'NONE':'');
    var t=page.querySelector('textarea[data-q="'+k+'"]');if(t&&c.checked)t.value='';
    mark()})});
page.querySelectorAll('[data-who]').forEach(function(b){
  b.addEventListener('click',function(){who=b.getAttribute('data-who');render()})});
}
render();
if(window.SIYL_BAG&&SIYL_BAG.bar)SIYL_BAG.bar();
})();
</script>
</body></html>
