<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>About you · See You In Laos</title>
<style>
@font-face{font-family:'PP Editorial Old';src:url('assets/fonts/PPEditorialOld-Ultralight.otf') format('opentype');font-weight:200;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3EEE7;color:#313131;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;font-weight:300;font-size:14px;line-height:1.6}
.hd{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:14px 20px}
.hb{width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:5px;background:none;border:0;cursor:pointer}.hb i{display:block;width:20px;height:1.4px;background:#313131}
.bd{font-family:'PP Editorial Old',serif;font-weight:200;font-size:19px;text-align:center}.bd .dot{color:#8A5A55}
.bag{width:44px;height:44px;display:flex;align-items:center;justify-content:center;position:relative;color:#313131;text-decoration:none}.bag .bgi{display:block}
.bb{position:absolute;top:1px;right:0;min-width:14px;height:14px;padding:0 3px;background:#313131;color:#F3EEE7;font-size:8.5px;line-height:1;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px #F3EEE7;border-radius:1px}
</style>
<link rel="stylesheet" href="assets/aman.css"><link rel="stylesheet" href="assets/prep.css"></head><body>
<header class="hd"><button class="hb" aria-label="Menu"><i></i><i></i><i></i></button><div class="bd">see you in laos<span class="dot">.</span></div><a class="bag" href="your-journey.html" aria-label="Your Journey"><svg class="bgi" viewBox="0 0 26 26" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5.1 10.1h15.8a.9.9 0 0 1 .9 1l-.95 10.6a1.6 1.6 0 0 1-1.6 1.45H6.75a1.6 1.6 0 0 1-1.6-1.45L4.2 11.1a.9.9 0 0 1 .9-1z"/><path d="M8 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M13.4 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M5.6 14.2h14.8"/><path d="M12.2 13.2h1.6a.5.5 0 0 1 .5.5v1.6a.5.5 0 0 1-.5.5h-1.6a.5.5 0 0 1-.5-.5v-1.6a.5.5 0 0 1 .5-.5z"/></svg><span class="bb" data-bag-badge></span></a></header>
<main class="prep-page" id="about-you">
<div class="prep-head">
  <p class="t-l1" id="ay-own">About you</p>
  <h1 class="t-d1">About you</h1>
  <p class="t-b1 measure">A few things that help us look after you personally. Every answer is optional and welcome at any time — nothing here changes a price, and leaving a question blank never means &ldquo;no&rdquo;.</p>
</div>
<div id="page"></div>
<div id="foot"></div>
</main>
<script src="assets/bag.js"></script>
<script src="assets/shop-menu.js"></script>
<script src="assets/aman.js"></script>
<script src="assets/guest.js"></script>
<script src="assets/docs.js"></script>
<script src="assets/prep-shell.js"></script>
<script type="module" src="assets/invite.mjs"></script>
<script>
/* ============================================================================
   05 · ABOUT YOU — a hospitality profile, not a form product.
   Four editorial areas for one named guest at a time: the hospitality profile,
   accessibility and comfort, travel documents, privacy. Whose answers these
   are is said at the interaction boundary — the name selector — and repeated
   by the shell whenever they are not the active person's own.
   ========================================================================== */
(function(){
var G=window.SIYL_GUEST,P=window.SIYL_PREP,D=window.SIYL_DOCS,page=document.getElementById('page');
if(!G||!page)return;
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function gated(fn){if(window.SIYL_INVITE){SIYL_INVITE.require(fn)}
else document.addEventListener('siyl:invite-ready',function(){SIYL_INVITE.require(fn)},{once:true})}
function when(iso){try{return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}catch(e){return ''}}
function size(n){return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}

function field(id,q,n){
  var v=G.profile(id,q.key);
  return '<div class="p-field">'+(n?'<p class="t-l1">'+n+'</p>':'')+'<h3 class="t-h2">'+q.q+'</h3><p class="t-b2">'+q.hint+'</p>'+
    '<textarea data-q="'+q.key+'" data-g="'+esc(id)+'" placeholder="Optional" aria-label="'+esc(q.q)+'">'+esc(v==='NONE'?'':v)+'</textarea>'+
    (q.none?'<label class="p-check"><input type="checkbox" data-none="'+q.key+'" data-g="'+esc(id)+'"'+(v==='NONE'?' checked':'')+'><span>'+q.none+'</span></label>':'')+
    '<p class="t-b2 p-why">'+q.why+'</p></div>'}

function docRow(id,k){
  var r=D.get(id,k.key),state=D.state(id,k.key);
  return '<div class="p-kv" data-doc="'+esc(id)+'" data-k="'+k.key+'"><div>'+
    '<p class="t-b1"><b>'+k.label+'</b></p>'+
    (r?'<p class="t-b2">'+esc(r.filename)+' · '+size(r.bytes)+' · received '+when(r.receivedAt)+' · not reviewed yet</p>'
      :'<p class="t-b2">'+k.hint+'</p>')+
    '<div class="p-actions"><button type="button" class="p-link" data-add>'+(r?'Replace':k.add)+'</button>'+
      (r?'':'<button type="button" class="p-link mute" data-later>Add later</button>')+'</div>'+
    '<input type="file" accept="'+D.ACCEPT+'" hidden><p class="t-b2" data-err hidden></p></div>'+
    '<p class="t-l1'+(r?' on':'')+'">'+(r?state:'Not added yet')+'</p></div>'}

function render(){
var p=G.party();
if(!p||!p.guests.length){
  page.innerHTML='<div class="p-card"><p class="t-l1">'+(G.stale()?'Once more':'Your invitation')+'</p><h2 class="t-h1">'+(G.stale()?'Open your invitation once more':'Open your invitation')+'</h2>'+
    '<p class="t-b1 measure">'+(G.stale()
      ? 'We&rsquo;ve updated your private journey so every choice can now be shown by name. Enter your invitation code once more. Your existing journey choices will remain.'
      : 'These answers belong to the people named on your invitation, so we open it first.')+'</p>'+
    '<p style="margin-top:16px"><button type="button" class="p-act" id="open">Open my invitation</button></p></div>';
  document.getElementById('open').addEventListener('click',function(){gated(render)});
  return}
var me=G.active();
if(!me){
  page.innerHTML='<div class="p-card"><p class="t-l1">Who are you?</p><h2 class="t-h1">Choose your name to continue</h2>'+
    '<p class="t-b1 measure">This invitation belongs to '+esc(G.partyNames())+'. Choose your name so we can show your personal details and decisions correctly.</p>'+
    '<p style="margin-top:16px"><button type="button" class="p-act" id="whoami">Choose your name</button></p></div>';
  var wb=document.getElementById('whoami'); if(wb&&P)wb.addEventListener('click',function(){P.chooseIdentity(false)});
  return}
/* the SUBJECT: the active person, unless they deliberately answer for another */
var id=G.subject().guestId,forOther=G.answeringFor(),name=esc(G.nameOf(id));
var own=document.getElementById('ay-own');if(own)own.textContent=forOther?'Answering for '+G.nameOf(id):G.labelFor(id)+' · you';
var h='';
if(p.guests.length>1){
  h+='<section class="prep-sec" style="margin-top:0"><p class="t-l1">Who are you answering for?</p>'+
     '<div class="p-selrow">'+p.guests.map(function(g){
       return '<button type="button" class="p-sel" aria-pressed="'+(g.guestId===id)+'" data-who="'+esc(g.guestId)+'">'+
         esc(G.nameOf(g.guestId))+(g.guestId===me.guestId?' · you':'')+'</button>'}).join('')+'</div>';
  if(forOther){
    h+='<div class="p-for" style="margin-top:var(--s4)"><span class="t-l1">Answering for</span><b>'+name+'</b>'+
       '<span class="t-b2">You are continuing as '+esc(G.nameOf(me.guestId))+'. These answers are kept in '+name+'&rsquo;s name and say that you wrote them.</span>'+
       '<button type="button" class="p-link mute" data-self>Back to yourself</button></div>'}
  h+='</section>'}

/* 01 · HOSPITALITY PROFILE */
h+='<section class="prep-sec"><p class="t-l1">01 · '+(forOther?'For '+name:'For you')+'</p><h2 class="t-h2">Hospitality profile</h2>'+
   '<p class="t-b1 measure">Seven questions that let us look after '+(forOther?name:'you')+' personally. Kitchens in three countries, a night train and twelve days of small moments read from these answers.</p>';
G.PROFILE.forEach(function(q){h+=field(id,q,q.n)});
h+='</section>';

/* 02 · ACCESSIBILITY & COMFORT */
h+='<section class="prep-sec"><p class="t-l1">02 · Operational · not hospitality</p><h2 class="t-h2">Accessibility &amp; comfort</h2>'+
   field(id,G.ACCESS,'')+'</section>';

/* 03 · TRAVEL DOCUMENTS */
h+='<section class="prep-sec"><p class="t-l1">03 · Optional · can be added later</p><h2 class="t-h2">Travel documents</h2>'+
   '<p class="t-b1 measure">Two documents help us coordinate '+(forOther?name+'&rsquo;s':'your')+' journey. They are used only for your travel arrangements, and access is limited to the team members who need them.</p>';
if(D){h+='<div class="p-card">'+D.KINDS.map(function(k){return docRow(id,k)}).join('')+'</div>'+
   '<p class="t-b2 measure-w" style="margin-top:var(--s3)">Received means it reached us — it has not been reviewed or verified yet. Nothing is kept on this device.</p>'}
h+='</section>';

/* 04 · PRIVACY */
var may=D&&D.mayConsent(id),c=D?D.consent(id):null,decided=D&&D.consentDecided(id);
h+='<section class="prep-sec"><p class="t-l1">04 · Privacy</p><h2 class="t-h2">Photographs and film</h2>'+
   '<p class="t-b1 measure">A photographer and a videographer are with us on the wedding day. This is how the day is remembered, and it happens whether or not you answer the question below. Nothing here needs a tick.</p>'+
   '<div class="p-card'+(c?' on':'')+'" style="margin-top:var(--s4)"><p class="t-l1'+(decided?' on':'')+'">'+(decided?(c?'Given · '+when(c.at):'Declined'):'Optional · not answered')+'</p>'+
   '<h3 class="t-h1">'+(forOther?name+'&rsquo;s publication choice':'Your publication choice')+'</h3>'+
   '<p class="t-b2 measure">Publication is a separate choice. Saying no changes nothing about '+(forOther?name+'&rsquo;s':'your')+' place at the wedding.</p>'+
   (may
     ?'<label class="p-check" style="margin-top:var(--s3)"><input type="checkbox" data-consent="'+esc(id)+'"'+(c?' checked':'')+'><span>'+D.CONSENT_TEXT+'</span></label>'
     :'<p class="t-b1 measure" style="margin-top:var(--s3)"><b>'+name+' answers this in '+name+'&rsquo;s own name.</b> It cannot be given or declined for '+name+' — switch to '+name+' to answer it.</p>'+
      '<p class="p-more"><button type="button" class="p-link" data-switch="'+esc(id)+'">Switch to '+name+'</button></p>')+
   '<p class="t-b2 measure-w" style="margin-top:var(--s3)">You can withdraw this at any time by writing to <a href="mailto:guest.relation.seeyouinlaos@gmail.com?subject=Publication%20consent" style="color:#313131">Guest Relations</a>. The wording is provisional and will be finalised with legal review; every answer is kept with its date and its version.</p>'+
   '</div></section>';
h+='<p class="t-l1 p-saved" id="saved"></p>';
page.innerHTML=h;

function mark(){var s=document.getElementById('saved');if(s){s.textContent='Saved';setTimeout(function(){s.textContent=''},1600)}
  page.querySelectorAll('.p-sel[data-who]').forEach(function(b){
    var gid=b.getAttribute('data-who'),n=G.profileAnswered(gid);
    b.textContent=G.nameOf(gid)+(gid===me.guestId?' · you':'')})}
page.querySelectorAll('textarea[data-q]').forEach(function(t){
  t.addEventListener('change',function(){G.setProfile(t.getAttribute('data-g'),t.getAttribute('data-q'),t.value.trim());mark()})});
page.querySelectorAll('input[data-none]').forEach(function(cb){
  cb.addEventListener('change',function(){
    var k=cb.getAttribute('data-none'),g=cb.getAttribute('data-g');
    G.setProfile(g,k,cb.checked?'NONE':'');
    var t=page.querySelector('textarea[data-q="'+k+'"]');if(t&&cb.checked)t.value='';
    mark()})});
page.querySelectorAll('[data-who]').forEach(function(b){
  b.addEventListener('click',function(){G.setSubject(b.getAttribute('data-who'))})});
var selfb=page.querySelector('[data-self]');
if(selfb)selfb.addEventListener('click',function(){G.setSubject(null)});
page.querySelectorAll('[data-switch]').forEach(function(b){
  b.addEventListener('click',function(){P.setActive(b.getAttribute('data-switch'))})});
page.querySelectorAll('[data-consent]').forEach(function(cb){
  cb.addEventListener('change',function(){D.setConsent(cb.getAttribute('data-consent'),cb.checked);render()})});
page.querySelectorAll('[data-doc]').forEach(function(row){
  var gid=row.getAttribute('data-doc'),kind=row.getAttribute('data-k');
  var input=row.querySelector('input[type=file]'),err=row.querySelector('[data-err]');
  var add=row.querySelector('[data-add]'),later=row.querySelector('[data-later]');
  if(add)add.addEventListener('click',function(){err.hidden=true;input.click()});
  if(later)later.addEventListener('click',function(){err.hidden=false;err.textContent='Nothing to do — this stays as Not added yet, and your journey can still be sent. Guest Relations will ask nearer the time.'});
  input.addEventListener('change',function(){
    var f=input.files&&input.files[0];if(!f)return;
    err.hidden=false;err.textContent='Sending '+f.name+'…';
    if(add)add.disabled=true;
    D.send(gid,kind,f).then(function(res){
      if(add)add.disabled=false;input.value='';
      if(res.ok){render();return}
      err.textContent=res.reason==='too large'?'That file is larger than 12 MB. A photograph of the page is usually enough.'
        :res.reason==='unsupported file type'?'We can take a JPEG, PNG, HEIC, WebP or PDF.'
        :res.reason==='document storage is not yet enabled'||res.enabled===false?'We cannot accept documents on the website yet. Nothing was sent and nothing was stored. Your journey can still be sent — Guest Relations will ask you for this directly.'
        :'That did not reach us, so nothing was stored. Please try again, or send it to Guest Relations by email.'})})});
if(P)P.foot(document.getElementById('foot'));
}
document.addEventListener('siyl:who',render);
document.addEventListener('siyl:subject',render);
document.addEventListener('siyl:docs',render);
document.addEventListener('siyl:auth',render);
render();
if(window.SIYL_BAG&&SIYL_BAG.bar)SIYL_BAG.bar();
})();
</script>
</body></html>
