<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>About You · See You In Laos</title>
<style>
@font-face{font-family:'PP Editorial Old';src:url('assets/fonts/PPEditorialOld-Ultralight.otf') format('opentype');font-weight:200;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3EEE7;color:#313131;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;font-weight:300;font-size:14px;line-height:1.6}
.hd{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:14px 20px}
.hb{width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:5px;background:none;border:0;cursor:pointer}.hb i{display:block;width:20px;height:1.4px;background:#313131}

.bag{width:44px;height:44px;display:flex;align-items:center;justify-content:center;position:relative;color:#313131;text-decoration:none}.bag .bgi{display:block}
.bb{position:absolute;top:1px;right:0;min-width:14px;height:14px;padding:0 3px;background:#313131;color:#F3EEE7;font-size:8.5px;line-height:1;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px #F3EEE7;border-radius:1px}

<header class="hd"><button class="hb" aria-label="Menu"><i></i><i></i><i></i></button><div class="bd">see you in laos<span class="dot">.</span></div><a class="bag" href="cart.html" aria-label="My Bag"><svg class="bgi" viewBox="0 0 26 26" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5.1 10.1h15.8a.9.9 0 0 1 .9 1l-.95 10.6a1.6 1.6 0 0 1-1.6 1.45H6.75a1.6 1.6 0 0 1-1.6-1.45L4.2 11.1a.9.9 0 0 1 .9-1z"/><path d="M8 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M13.4 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M5.6 14.2h14.8"/><path d="M12.2 13.2h1.6a.5.5 0 0 1 .5.5v1.6a.5.5 0 0 1-.5.5h-1.6a.5.5 0 0 1-.5-.5v-1.6a.5.5 0 0 1 .5-.5z"/></svg><span class="bb" data-bag-badge></span></a></header>
<main class="prep-page" id="about-you">
<div class="prep-head">
  <h1 class="t-d1">About You</h1>
  <p class="t-b1 measure" id="ay-intro">A few questions about you, and one thing to acknowledge — a word or two is enough. You answer for yourself; everyone invited with you answers their own.</p>
</div>
<div id="page"></div>
<div id="foot"></div>
</main>

<script type="module" src="assets/invite.mjs?v=4ee706e4"></script>
<script>
/* ============================================================================
   05 · ABOUT YOU — the guest's own profile (Owner, 14 Sep 2026 · 15 Sep 2026).
   REQUIRED: the food allergy answer (YES with details, or NO), every one of
   the five questions shown under "A little more about you" (Question 5, "rather avoid", retired 19 Sep 2026), and the
   photography acknowledgement — a question that is shown must be answered.
   OPTIONAL: only the travel documents (add later) and the separate
   publication choice. Nothing here is answered for anyone else, and nothing
   explains what will be done with an answer.
   ========================================================================== */
(function(){
var G=window.SIYL_GUEST,P=window.SIYL_PREP,D=window.SIYL_DOCS,page=document.getElementById('page');
if(!G||!page)return;
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function gated(fn){if(window.SIYL_INVITE){SIYL_INVITE.require(fn)}
else document.addEventListener('siyl:invite-ready',function(){SIYL_INVITE.require(fn)},{once:true})}
function when(iso){try{return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){return ''}}
function size(n){return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}

var QN=window.SIYL_QUESTIONNAIRE;
function answered(id,q){return QN.profileAnswered(G.rec(id).profile,q)}
function field(id,q){
  var v=G.profile(id,q.key),ok=answered(id,q);
  /* STATIC MARKERS (PRQ-06-04): the label is rendered once — "0n · Required" / "07 · Optional" — and never repainted on answering;
     completion lives in the step shell and the foot. What is required is the schema's word (src/questionnaire.js). */
  var head='<div class="p-field'+(ok?' on':'')+'" id="q-'+q.key+'"><p class="t-l1" data-q-state="'+q.key+'">'+q.n+' · '+(q.required?'Required':'Optional')+'</p><h3 class="t-h2">'+q.q+'</h3><p class="t-b2">'+q.hint+'</p>';
  /* the display form of a stored choice (PRQ-06-07): "’90s", "Matcha green tea" — the stored value (data-pick) never changes */
  var shown=function(c){return esc(QN.display?QN.display(c):c)};
  /* THE MUSIC (Owner, 22 Sep 2026): the genres as one multi-select — as many as the guest likes, at least one; nothing pressed until the guest presses */
  if(q.type==='multi')return head+'<div class="p-selrow p-choice p-multi" role="group" aria-label="'+esc(q.q)+'" data-multi="'+q.key+'" data-g="'+esc(id)+'">'+q.choices.map(function(c){var on=(v||[]).indexOf(c)>=0;return '<button type="button" class="p-sel" role="checkbox" aria-checked="'+(on?'true':'false')+'" aria-pressed="'+(on?'true':'false')+'" data-pick="'+esc(c)+'">'+shown(c)+'</button>'}).join('')+'</div>'+
    '<p class="t-l1'+(ok?' on':' open')+'" data-multi-count="'+q.key+'">'+((v||[]).length?(v.length===1?'1 genre chosen':v.length+' genres chosen'):'Choose at least one')+'</p></div>';
  /* a choice question (My favourite flavour, Owner, 18 Sep 2026): the six choices as the one selection control, exactly one pressed */
  if(q.choices)return head+'<div class="p-selrow p-choice" role="radiogroup" aria-label="'+esc(q.q)+'" data-choice="'+q.key+'" data-g="'+esc(id)+'">'+q.choices.map(function(c){var on=v===c;return '<button type="button" class="p-sel" role="radio" aria-checked="'+(on?'true':'false')+'" aria-pressed="'+(on?'true':'false')+'" data-pick="'+esc(c)+'">'+shown(c)+'</button>'}).join('')+'</div></div>';
  /* no placeholder (TO-02286 / TO-02291): the marker says Required or Optional once */
  return head+'<textarea data-q="'+q.key+'" data-g="'+esc(id)+'" aria-label="'+esc(q.q)+'" aria-required="'+(q.required?'true':'false')+'" aria-invalid="'+(ok||!q.required?'false':'true')+'">'+esc(v)+'</textarea></div>'}

function docRow(id,k){
  var r=D.get(id,k.key);
  return '<div class="p-kv" data-doc="'+esc(id)+'" data-k="'+k.key+'"><div>'+
    '<p class="t-b1"><b>'+k.label+'</b></p>'+
    (r?'<p class="t-b2">'+esc(r.filename)+' · '+size(r.bytes)+' · received '+when(r.receivedAt)+'</p>'
      :'<p class="t-b2">'+k.hint+'</p>')+
    '<div class="p-actions"><button type="button" class="p-link" data-add>'+(r?'Replace':k.add)+'</button></div>'+
    '<input type="file" accept="'+D.ACCEPT+'" hidden><p class="t-b2" data-err hidden></p></div>'+
    /* a document not added yet has no status line — the hint and "Add passport" say it; a received one reads Received (TO-02293) */
    (r?'<p class="t-l1 on">Received</p>':'')+'</div>'}

/* THE INTRO BY SITUATION (PRQ-06-02, L-11): at the wedding · not at the wedding · the hosts */
var INTRO={
  wedding:'A few questions about you, and one thing to acknowledge — a word or two is enough. You answer for yourself; everyone invited with you answers their own.',
  away:'A few questions about you — a word or two is enough. You answer for yourself; everyone invited with you answers their own.',
  host:'A few questions for the kitchens and the team — the same ones your guests answer.'};
function intro(words){var el=document.getElementById('ay-intro');if(!el)return;el.hidden=!words;if(words)el.textContent=words}
function render(){
var p=G.party(),me=G.me();
if(!p||!me){
  intro(INTRO.wedding);
  /* the signed-out card: no eyebrow (TO-02294) — the heading says it, the one button opens the invitation */
  page.innerHTML='<div class="p-card"><h2 class="t-h1">'+(G.stale()?'Open your invitation once more':'Open your invitation')+'</h2>'+
    '<p class="t-b1 measure">'+(G.stale()
      ? 'Every guest now has their own invitation code. Please enter yours — everything you chose before is still here.'
      : 'Please open your invitation first — these questions are for you personally.')+'</p>'+
    '<p style="margin-top:16px"><button type="button" class="p-act" id="open">Open your invitation</button></p></div>';
  document.getElementById('open').addEventListener('click',function(){gated(render)});
  return}
var id=me.guestId;
/* A GUEST NOT JOINING THE TRIP (PRQ-06-03): nothing is asked — one card, the Review block's own words */
if(G.notJoining&&G.notJoining()){
  intro('');
  page.innerHTML='<section class="prep-sec"><div class="p-card flat"><p class="t-b1 measure">You are not joining this trip, so nothing is needed here.</p>'+
    '<div class="p-actions"><a class="p-link" href="your-journey.html#scope">Open My Trip</a></div></div></section>';
  if(P)P.foot(document.getElementById('foot'));
  return}
/* WHAT IS ASKED (OQ-32 · PRQ-06-02): 06 and 07 only at the wedding; Photography & film only at the wedding and never of the hosts */
var SC=G.aboutScope?G.aboutScope():{wedding:true,host:false,photo:true},QS=G.PROFILE.filter(function(q){return !q.wedding||SC.wedding});
intro(SC.host?INTRO.host:SC.wedding?INTRO.wedding:INTRO.away);
var h='';

/* 01 · FOOD ALLERGIES — required, YES / NO, details only for YES; no state line on the card (PRQ-06-04) */
var a=G.allergy(),details=G.allergyDetails(),needDetails=a==='yes'&&!details;
h+='<section class="prep-sec" id="allergy"><p class="t-l1">01 · Required</p><h2 class="t-h2">'+G.ALLERGY.q+'</h2>'+
   '<div class="p-card'+(a!==null&&!needDetails?' on':'')+'" style="margin-top:var(--s4)">'+
   '<div class="p-selrow"><button type="button" class="p-sel" aria-pressed="'+(a==='yes')+'" data-allergy="yes">Yes</button><button type="button" class="p-sel" aria-pressed="'+(a==='no')+'" data-allergy="no">No</button></div>'+
   (a==='yes'?'<div class="p-field" id="allergy-details" style="margin-top:var(--s4)"><label class="t-l1" for="allergy-text">Which allergies?<span aria-hidden="true"> · Required</span></label><p class="t-b2">'+G.ALLERGY.details+'</p>'+
     '<textarea id="allergy-text" data-allergy-text aria-required="true" aria-invalid="'+(needDetails?'true':'false')+'" placeholder="For example: peanuts, shellfish">'+esc(details)+'</textarea></div>':'')+
   '</div></section>';

/* 02–07 · A LITTLE MORE ABOUT YOU — every required question answered (Owner, 15 Sep 2026); no section-level state (PRQ-06-04) */
h+='<section class="prep-sec" id="favourites"><h2 class="t-h2">A little more about you</h2>'+
   '<p class="t-b1 measure">The little things you love tell us the most — a word or two is enough.</p>';
G.PROFILE.forEach(function(q){if(QS.indexOf(q)>=0)h+=field(id,q)});
h+='</section>';

/* TRAVEL DOCUMENTS — optional, never holds the step */
h+='<section class="prep-sec" id="documents"><h2 class="t-h2">Travel documents</h2>'+
   '<p class="t-b1 measure">Your passport and flight information help us arrange your trip. Add them whenever they are ready — you can send your trip without them. They are used for nothing else, only the team members arranging your travel can see them, and they are kept until 7 April 2027, thirty days after the journey ends, then deleted.</p>';
if(D){h+='<div class="p-card">'+D.KINDS.map(function(k){return docRow(id,k)}).join('')+'</div>'}
h+='</section>';

/* PHOTOGRAPHY & FILM — a required acknowledgement (its text and G.PHOTO_VERSION from assets/guest.js, PRQ-06-08); publication a
   separate, optional choice. Asked only at the wedding and never of the hosts (OQ-32 · PRQ-06-02). The ticked box is the state:
   no state line on either card (PRQ-06-04). */
if(SC.photo){
var ack=G.photoAck(),may=D&&D.mayConsent(id),c=D?D.consent(id):null;
h+='<section class="prep-sec" id="photo"><p class="t-l1">Required</p><h2 class="t-h2">Photography &amp; film</h2>'+
   '<p class="t-b1 measure">Our photographers and film-makers are with us throughout the wedding day, so you may appear in photographs and film. Whether any of it may be published is your own choice, just below.</p>'+
   '<div class="p-card'+(ack?' on':'')+'" style="margin-top:var(--s4)">'+
   '<label class="p-check"><input type="checkbox" id="photo-ack" data-photo-ack'+(ack?' checked':'')+' aria-required="true"><span class="t-b1" style="color:#313131">'+esc(G.PHOTO_TEXT)+'</span></label></div>'+
   '<div class="p-card'+(c?' on':'')+'" style="margin-top:var(--s4)" id="publication">'+
   '<h3 class="t-h1">May we publish them?</h3>'+
   '<p class="t-b2 measure">If you would rather not, leave it unticked — it changes nothing about your place at the wedding.</p>'+
   (may?'<label class="p-check" style="margin-top:var(--s3)"><input type="checkbox" data-consent="'+esc(id)+'"'+(c?' checked':'')+'><span>'+D.CONSENT_TEXT+'</span></label>':'')+
   /* a non-breaking space before the link keeps "to Guest Relations" apart in WebKit (PRQ-06-13) */
   '<p class="t-b2 measure-w" style="margin-top:var(--s3)">You can change your mind at any time by writing to&nbsp;<a href="mailto:guest.relation.seeyouinlaos@gmail.com?subject=Publication%20consent" style="color:#313131">Guest Relations</a>. We keep your answer with the date you gave it.</p>'+
   '</div></section>'}
h+='<p class="t-l1 p-saved" id="saved" role="status" aria-live="polite"></p>';
/* the guest's own contact details, from the same invitation identity — edited on Your Invitation, shown here; the account itself is My Profile (profile.html) */
var cEmail=G.contact('email'),cPhone=G.contact('phone');
h='<section class="prep-sec"><div class="p-card" id="profile-contact"><p class="t-l1'+(cEmail&&cPhone?' on':' open')+'">Your contact details</p><h3 class="t-h1">'+esc(G.nameOf())+'</h3>'+
  '<p class="t-b2">'+(cEmail?esc(cEmail):'Email address still needed')+'<br>'+(cPhone?esc(cPhone):'Mobile number still needed')+'</p>'+
  '<div class="p-actions"><a class="p-link" href="invitation.html#contact">Edit contact details</a></div></div></section>'+h;
page.innerHTML=h;

function mark(){var s=document.getElementById('saved');if(s){s.textContent='Saved';setTimeout(function(){s.textContent=''},1600)}}
page.querySelectorAll('[data-allergy]').forEach(function(b){b.addEventListener('click',function(){
  var v=b.getAttribute('data-allergy');G.setAllergy(v,G.allergyDetails());render();
  if(v==='yes'){var t=document.getElementById('allergy-text');if(t)setTimeout(function(){try{t.focus({preventScroll:true})}catch(e){}},60)}
  else{var again=page.querySelector('[data-allergy="no"]');if(again)try{again.focus({preventScroll:true})}catch(e){}}})});
var at=page.querySelector('[data-allergy-text]');
if(at){var save=function(){G.setAllergy('yes',at.value.trim())};at.addEventListener('change',function(){save();render();var t=document.getElementById('allergy-text');if(t)try{t.focus({preventScroll:true})}catch(e){}});at.addEventListener('blur',save)}
/* a choice: one tap sets it; the markers never change (PRQ-06-04) — the shell's foot follows at once */
page.querySelectorAll('[data-multi]').forEach(function(grp){grp.querySelectorAll('[data-pick]').forEach(function(b){b.addEventListener('click',function(){
  var key=grp.getAttribute('data-multi'),val=b.getAttribute('data-pick');var next=G.toggleGenre(grp.getAttribute('data-g'),val);mark();
  grp.querySelectorAll('[data-pick]').forEach(function(x){var on=next.indexOf(x.getAttribute('data-pick'))>=0;x.setAttribute('aria-checked',on?'true':'false');x.setAttribute('aria-pressed',on?'true':'false')});
  var f=grp.closest('.p-field'),cnt=f&&f.querySelector('[data-multi-count]'),ok=next.length>0;
  if(f)f.classList.toggle('on',ok);
  if(cnt){cnt.className='t-l1'+(ok?' on':' open');cnt.textContent=next.length?(next.length===1?'1 genre chosen':next.length+' genres chosen'):'Choose at least one'}
  if(window.SIYL_PREP)SIYL_PREP.foot(document.getElementById('foot'))})})});
page.querySelectorAll('[data-choice]').forEach(function(grp){grp.querySelectorAll('[data-pick]').forEach(function(b){b.addEventListener('click',function(){
  var key=grp.getAttribute('data-choice'),val=b.getAttribute('data-pick');G.setProfile(grp.getAttribute('data-g'),key,val);mark();
  grp.querySelectorAll('[data-pick]').forEach(function(x){var on=x===b;x.setAttribute('aria-checked',on?'true':'false');x.setAttribute('aria-pressed',on?'true':'false')});
  var f=grp.closest('.p-field');if(f)f.classList.add('on');
  if(window.SIYL_PREP)SIYL_PREP.foot(document.getElementById('foot'))})})});
page.querySelectorAll('textarea[data-q]').forEach(function(t){
  /* an answer updates the shell's readiness at once without losing the caret; the markers never change (PRQ-06-04) */
  t.addEventListener('change',function(){G.setProfile(t.getAttribute('data-g'),t.getAttribute('data-q'),t.value.trim());mark();
    var ok=!!t.value.trim(),f=t.closest('.p-field'),req=t.getAttribute('aria-required')==='true';
    if(f)f.classList.toggle('on',ok);t.setAttribute('aria-invalid',ok||!req?'false':'true');
    if(window.SIYL_PREP)SIYL_PREP.foot(document.getElementById('foot'))})});
var pa=page.querySelector('[data-photo-ack]');
if(pa)pa.addEventListener('change',function(){G.setPhotoAck(pa.checked);render();var again=page.querySelector('[data-photo-ack]');if(again)try{again.focus({preventScroll:true})}catch(e){}});
page.querySelectorAll('[data-consent]').forEach(function(cb){
  cb.addEventListener('change',function(){D.setConsent(cb.getAttribute('data-consent'),cb.checked);render()})});
page.querySelectorAll('[data-doc]').forEach(function(row){
  var gid=row.getAttribute('data-doc'),kind=row.getAttribute('data-k');
  var input=row.querySelector('input[type=file]'),err=row.querySelector('[data-err]');
  var add=row.querySelector('[data-add]');
  if(add)add.addEventListener('click',function(){err.hidden=true;input.click()});
  input.addEventListener('change',function(){
    var f=input.files&&input.files[0];if(!f)return;
    err.hidden=false;err.textContent='Sending '+f.name+'…';
    if(add)add.disabled=true;
    D.send(gid,kind,f).then(function(res){
      if(add)add.disabled=false;input.value='';
      if(res.ok){render();return}
      err.textContent=res.reason==='too large'?'That file is larger than 12 MB. A photograph of the page is usually enough.'
        :res.reason==='unsupported file type'?'That file type does not work here, so nothing was stored. Please use a JPEG, PNG, HEIC, WebP or PDF.'
        :res.reason==='document storage is not enabled yet'||res.enabled===false?'Documents cannot be added on this website at the moment, so nothing was stored. You can still send your trip — Guest Relations will ask you for it directly.'
        :'That did not reach us, so nothing was stored. Please try again, or send it to Guest Relations by email.'})})});
if(P)P.foot(document.getElementById('foot'));
/* a deep link lands on its control, open for use */
var hash=location.hash;
if(hash&&P&&!page.dataset.landed){page.dataset.landed='1';setTimeout(function(){P.focusControl(hash==='#allergy-details'&&!document.getElementById('allergy-details')?'#allergy':hash)},420)}
}
document.addEventListener('siyl:docs',render);
document.addEventListener('siyl:auth',render);
render();
if(window.SIYL_BAG&&SIYL_BAG.bar)SIYL_BAG.bar();
})();
</script>
</body></html>
