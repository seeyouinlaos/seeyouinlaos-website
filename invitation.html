<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your invitation · See You In Laos</title>
<style>
@font-face{font-family:'PP Editorial Old';src:url('assets/fonts/PPEditorialOld-Ultralight.otf') format('opentype');font-weight:200;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3EEE7;color:#313131;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;font-weight:300;font-size:14px;line-height:1.6}
.hd{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:14px 20px}
.hb{width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:5px;background:none;border:0;cursor:pointer}.hb i{display:block;width:20px;height:1.4px;background:#313131}
.bd{font-family:'PP Editorial Old',serif;font-weight:200;font-size:19px;text-align:center}.bd .dot{color:#8A5A55}
.bag{width:44px;height:44px;display:flex;align-items:center;justify-content:center;position:relative;color:#313131;text-decoration:none}.bag .bgi{display:block}
.bb{position:absolute;top:1px;right:0;min-width:14px;height:14px;padding:0 3px;background:#313131;color:#F3EEE7;font-size:8.5px;line-height:1;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px #F3EEE7;border-radius:1px}
</style>
<link rel="stylesheet" href="assets/aman.css"><link rel="stylesheet" href="assets/prep.css"></head><body>
<header class="hd"><button class="hb" aria-label="Menu"><i></i><i></i><i></i></button><div class="bd">see you in laos<span class="dot">.</span></div><a class="bag" href="your-journey.html" aria-label="Your Journey"><svg class="bgi" viewBox="0 0 26 26" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5.1 10.1h15.8a.9.9 0 0 1 .9 1l-.95 10.6a1.6 1.6 0 0 1-1.6 1.45H6.75a1.6 1.6 0 0 1-1.6-1.45L4.2 11.1a.9.9 0 0 1 .9-1z"/><path d="M8 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M13.4 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M5.6 14.2h14.8"/><path d="M12.2 13.2h1.6a.5.5 0 0 1 .5.5v1.6a.5.5 0 0 1-.5.5h-1.6a.5.5 0 0 1-.5-.5v-1.6a.5.5 0 0 1 .5-.5z"/></svg><span class="bb" data-bag-badge></span></a></header>
<main class="prep-page" id="invitation">
<div id="page"></div>
</main>
<script src="assets/bag.js"></script>
<script src="assets/shop-menu.js"></script>
<script src="assets/aman.js"></script>
<script src="assets/guest.js"></script>
<script src="assets/temple.js"></script>
<script src="assets/confirm.js"></script>
<script src="assets/prep-shell.js"></script>
<script type="module" src="assets/invite.mjs"></script>
<script>
/* ============================================================================
   01 · YOUR INVITATION — the calm opening of the private journey.
   Whose invitation is this, who am I, what is shared, what is personal, what
   happens next. Nothing here is a database field.
   ========================================================================== */
(function(){
var G=window.SIYL_GUEST,P=window.SIYL_PREP,page=document.getElementById('page');
if(!G||!page)return;
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function gated(fn){if(window.SIYL_INVITE){SIYL_INVITE.require(fn)}
else document.addEventListener('siyl:invite-ready',function(){SIYL_INVITE.require(fn)},{once:true})}
function when(iso){try{return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}catch(e){return ''}}
var HERO='<span class="p-media" style="background-image:url(assets/images/event/052-ceremony-green-gateway.jpg)" role="img" aria-label="The green gateway at Souphattra Heritage, Vientiane"></span>';
var NEXT=[
 ['02','Your Journey','Where your party stays and how it travels, from Bangkok to Vientiane and on to Yunnan.','Required'],
 ['03','The Wedding','Who joins each part of the day — one answer per named guest.','Required'],
 ['04','Wedding Preparation','The dress code, understood and confirmed once, by name — and your seats when seating opens.','Required'],
 ['05','About You','Your hospitality profile, comfort needs, travel documents and privacy. Every answer optional.','Optional'],
 ['06','Review &amp; Send','Everything in one place. Sending is a request — never a payment, never a confirmation.','Required']
];
function render(){
var p=G.party();
if(!p||!p.guests.length){
  page.innerHTML='<div class="prep-head">'+HERO+
    '<p class="t-l1">Sunday, 28 February 2027 · Vientiane, Laos</p>'+
    '<h1 class="t-d1">Your invitation</h1>'+
    '<p class="t-b1 measure">Open your invitation and we can show you who is travelling with you, and what there is to arrange.</p></div>'+
    '<div class="p-card"><p class="t-l1">'+(G.stale()?'Once more':'Your invitation')+'</p>'+
    '<h2 class="t-h1">'+(G.stale()?'Open your invitation once more':'Open your invitation')+'</h2>'+
    '<p class="t-b1 measure">'+(G.stale()
      ? 'We&rsquo;ve updated your private journey so every choice can now be shown by name. Enter your invitation code once more. Your existing journey choices will remain.'
      : 'Your invitation carries your names. Everything on this website — your journey, the wedding day, your preferences — belongs to it.')+'</p>'+
    '<p style="margin-top:var(--s4)"><button type="button" class="p-act" id="open">Open my invitation</button></p></div>';
  document.getElementById('open').addEventListener('click',function(){gated(render)});
  return}
var me=G.active(),seen=G.identityReviewed(),many=p.guests.length>1;
var h='<div class="prep-head">'+HERO+
  '<p class="t-l1">Your invitation · '+esc(p.invitationId)+'</p>'+
  '<h1 class="t-d1">'+esc(p.partyName||G.partyNames())+'</h1>'+
  '<p class="t-b1 measure">You are invited to join <span class="nb">Haruthai &amp; Suthep</span> in Vientiane for their wedding on Sunday, 28 February 2027.</p>'+
  '<p class="t-b2 measure-w">This private journey brings together your travel arrangements, the Wedding Day, your personal preferences and the details our Guest Relations team needs to look after you. Nothing on this website is paid for here, and nothing is confirmed until Guest Relations confirms it with you personally.</p>'+
  '</div>';

/* YOUR PARTY */
h+='<section class="prep-sec"><p class="t-l1">Your party</p><h2 class="t-h2">Who travels on this invitation</h2><div class="p-card">';
p.guests.forEach(function(g){
  h+='<div class="p-kv"><div><p class="t-b1"><b>'+esc(G.nameOf(g.guestId))+'</b></p><p class="t-b2">'+esc(G.value(g.guestId,'fullName')||g.fullName)+'</p></div><p class="t-l1">Named guest</p></div>'});
h+='</div></section>';

/* WHO AM I · what is shared · what is personal */
h+='<section class="prep-sec"><p class="t-l1">Who you are</p><h2 class="t-h2">'+(me?'You are continuing as '+esc(G.nameOf(me.guestId)):'Choose your name')+'</h2>';
h+='<div class="p-card'+(me?' on':'')+'"><p class="t-l1'+(me?' on':' open')+'">Continuing as</p><h3 class="t-h1">'+(me?esc(G.nameOf(me.guestId)):'&mdash;')+'</h3>'+
   '<p class="t-b2 measure">'+(me
     ? 'Your personal answers are kept in your own name.'+(many?' If you are '+esc(p.guests.filter(function(g){return g.guestId!==me.guestId}).map(function(g){return G.nameOf(g.guestId)}).join(' or '))+', switch before you continue.':'')
     : 'Choose your name so your personal answers are kept in your own name.')+'</p>'+
   (many||!me?'<p class="p-more"><button type="button" class="p-link" id="switch">'+(me?'Switch':'Choose your name')+'</button></p>':'')+'</div>';
h+='<div class="p-card"><p class="t-l1">You are making decisions for</p><h3 class="t-h1">'+esc(G.partyNames())+'</h3>'+
   '<div class="p-kv"><div><p class="t-b1"><b>For your party</b></p><p class="t-b2">Where you stay, how you travel and your costs — shared by everyone on the invitation.</p></div></div>'+
   '<div class="p-kv"><div><p class="t-b1"><b>'+(many?'For each of you':'For you')+'</b></p><p class="t-b2">The wedding day, the dress code, your preferences and your documents — answered by name'+(many?', and never changed for you without saying so':'')+'.</p></div></div>'+
   '</div></section>';

/* WHAT HAPPENS NEXT */
h+='<section class="prep-sec"><p class="t-l1">What happens next</p><h2 class="t-h2">Five more steps</h2><div class="p-card p-steps">';
NEXT.forEach(function(s){
  h+='<div class="p-kv"><span class="n">'+s[0]+'</span><div><p class="t-b1"><b>'+s[1]+'</b></p><p class="t-b2">'+s[2]+'</p></div><p class="t-l1'+(s[3]==='Required'?' open':'')+'">'+s[3]+'</p></div>'});
h+='</div></section>';

/* the one continuation */
h+='<div class="prep-foot"><a class="p-link mute" href="you.html#you">Something here is not right</a>'+
   '<a class="p-act" id="go" href="your-journey.html">Continue to Your Journey</a></div>'+
   '<p class="t-b2" style="margin-top:var(--s3)">'+(seen&&when(seen.at)?'Your party was confirmed on '+when(seen.at)+'.':'Continuing simply tells us you have seen who travels on this invitation.')+'</p>';
page.innerHTML=h;
var go=document.getElementById('go');
if(go)go.addEventListener('click',function(){G.setIdentityReviewed(true)});
var sw=document.getElementById('switch');
if(sw&&P)sw.addEventListener('click',function(){P.chooseIdentity(!!me)});
}
document.addEventListener('siyl:who',render);
document.addEventListener('siyl:guest',render);
document.addEventListener('siyl:auth',render);
render();
if(window.SIYL_BAG&&SIYL_BAG.bar)SIYL_BAG.bar();
})();
</script>
</body></html>
