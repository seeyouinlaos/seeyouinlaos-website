<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your invitation · See You In Laos</title><style>
@font-face{font-family:'PP Editorial Old';src:url('assets/fonts/PPEditorialOld-Ultralight.otf') format('opentype');font-weight:200;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}body{background:#F3EEE7;color:#313131;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;font-weight:300;font-size:14px;line-height:1.6}
.hd{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:14px 20px}
.hb{width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:5px;background:none;border:0;cursor:pointer}.hb i{display:block;width:20px;height:1.4px;background:#313131}
.bd{font-family:'PP Editorial Old',serif;font-weight:200;font-size:19px;text-align:center}.bd .dot{color:#8A5A55}
.bag{width:44px;height:44px;display:flex;align-items:center;justify-content:center;position:relative;color:#313131;text-decoration:none}.bag .bgi{display:block}
.bb{position:absolute;top:1px;right:0;min-width:14px;height:14px;padding:0 3px;background:#313131;color:#F3EEE7;font-size:8.5px;line-height:1;letter-spacing:0;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px #F3EEE7;border-radius:1px}
main{padding:30px 24px 80px;max-width:640px;margin:0 auto}
h1{font-family:'PP Editorial Old',serif;font-weight:200;font-size:29px;margin-bottom:6px}
.sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#7C7A75;margin-bottom:26px}
h2{font-family:'PP Editorial Old',serif;font-weight:200;font-size:20px;margin:34px 0 10px}
.note{font-size:11.5px;color:#7C7A75;margin-top:14px;max-width:36em;line-height:1.8}
.tlink{display:inline-block;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:#313131;text-decoration:none;border-bottom:1px solid #313131;padding:8px 0 3px;min-height:44px}
.ihero{margin:0 -24px 26px;aspect-ratio:3/2;background:#E7E3DB center/cover no-repeat}
.ieyebrow{font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;color:#7C7A75;margin-bottom:8px}
.iname{font-family:'PP Editorial Old',serif;font-weight:200;font-size:34px;line-height:1.12;margin-bottom:14px}
.ilede{font-size:15px;line-height:1.85;color:#313131;max-width:32em}
.ibody{font-size:13px;line-height:1.85;color:#4A4A4A;max-width:34em;margin-top:16px}
.nb{white-space:nowrap}
.iblk{border-top:1px solid #DAD9D7;margin-top:34px;padding-top:20px}
.iblk h2{margin:0 0 12px}
.iperson{display:flex;gap:12px;align-items:baseline;border-top:1px solid #EDEBE7;padding:14px 0}
.iperson:first-of-type{border-top:0}
.ipn{font-family:'PP Editorial Old',serif;font-weight:200;font-size:21px;line-height:1.25}
.ipf{font-size:11px;color:#7C7A75;margin-top:3px}
.ipr{margin-left:auto;font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:#7C7A75;white-space:nowrap}
.ifor{border:1px solid #DAD9D7;background:#FCFAF6;padding:20px;margin-top:22px}
.ifor .l{font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;color:#7C7A75;margin-bottom:6px}
.ifor .v{font-family:'PP Editorial Old',serif;font-weight:200;font-size:21px;line-height:1.3}
.ifor p{font-size:12px;color:#7C7A75;line-height:1.75;margin-top:8px}
.step{display:flex;gap:14px;border-top:1px solid #EDEBE7;padding:15px 0}
.stepn{font-size:9.5px;letter-spacing:2px;color:#7C7A75;flex:0 0 22px;padding-top:4px}
.stept{font-family:'PP Editorial Old',serif;font-weight:200;font-size:18px;line-height:1.3}
.stepd{font-size:12px;color:#7C7A75;line-height:1.75;margin-top:4px}
.stepr{margin-left:auto;font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:#7C7A75;white-space:nowrap;padding-top:5px}
.stepr.req{color:#8A5A55}
.cta{display:block;width:100%;background:#313131;color:#F3EEE7;border:0;padding:19px;font-size:11px;letter-spacing:2.2px;text-transform:uppercase;text-align:center;text-decoration:none;margin-top:28px;cursor:pointer;min-height:52px;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif}
.gate{border:1px solid #DAD9D7;background:#FCFAF6;padding:24px 20px;margin-top:26px}
.gate h3{font-family:'PP Editorial Old',serif;font-weight:200;font-size:19px;margin-bottom:8px}
.gbtn{background:#313131;color:#F3EEE7;border:0;padding:17px 22px;font:inherit;font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;cursor:pointer;min-height:50px;margin-top:8px}
.ok{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:#7C7A75;margin-top:12px}
@media (min-width:768px){.ihero{margin-left:0;margin-right:0;aspect-ratio:16/7}}
</style><link rel="stylesheet" href="assets/desktop.css"><link rel="stylesheet" href="assets/aman.css"></head><body>
<header class="hd"><button class="hb" aria-label="Menu"><i></i><i></i><i></i></button><div class="bd">see you in laos<span class="dot">.</span></div><a class="bag" href="your-journey.html" aria-label="Your Journey"><svg class="bgi" viewBox="0 0 26 26" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5.1 10.1h15.8a.9.9 0 0 1 .9 1l-.95 10.6a1.6 1.6 0 0 1-1.6 1.45H6.75a1.6 1.6 0 0 1-1.6-1.45L4.2 11.1a.9.9 0 0 1 .9-1z"/><path d="M8 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M13.4 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M5.6 14.2h14.8"/><path d="M12.2 13.2h1.6a.5.5 0 0 1 .5.5v1.6a.5.5 0 0 1-.5.5h-1.6a.5.5 0 0 1-.5-.5v-1.6a.5.5 0 0 1 .5-.5z"/></svg><span class="bb" data-bag-badge></span></a></header>
<main>
<div id="page"></div>
</main>
<script src="assets/bag.js"></script>
<script src="assets/shop-menu.js"></script>
<script src="assets/aman.js"></script>
<script src="assets/guest.js"></script>
<script src="assets/temple.js"></script>
<script src="assets/prep.js"></script>
<script type="module" src="assets/invite.mjs"></script>
<script>
/* ============================================================================
   THE INVITATION BRIEFING.
   Before anyone chooses a room, a train or a temple morning, they are told who
   this invitation belongs to, who travels on it, and what they are about to
   arrange — and for whom. Nothing here is a database field: it is the letter
   the invitation would have carried.
   ========================================================================== */
(function(){
var G=window.SIYL_GUEST,page=document.getElementById('page');
if(!G||!page)return;
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function gated(fn){if(window.SIYL_INVITE){SIYL_INVITE.require(fn)}
else document.addEventListener('siyl:invite-ready',function(){SIYL_INVITE.require(fn)},{once:true})}
function when(iso){try{return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}catch(e){return ''}}

var STEPS=[
 ['You','you.html','Your names as we hold them, and one way to reach you.','Required'],
 ['Your journey','your-journey.html','Your travel and your stays, from Bangkok to Vientiane and home again.','Required'],
 ['The Wedding','voyage.html#temple-decision','Who joins each part of the day, and the dress code — one answer per named guest.','Required'],
 ['Documents &amp; privacy','documents.html','Passport and flight document, and your choice about photographs. All optional now.','Optional'],
 ['About you','about-you.html','Seven questions of hospitality and one operational field. Every answer optional.','Optional'],
 ['Review &amp; Send','review.html','Everything you entered, in one place. Sending is a request — never a payment, and never a confirmation.','Required']
];

function render(){
var p=G.party();
if(!p){
  page.innerHTML='<div class="ihero" style="background-image:url(assets/images/event/052-ceremony-green-gateway.jpg)" role="img" aria-label="The green gateway at Souphattra Heritage, Vientiane"></div>'+
    '<p class="ieyebrow">Sunday, 28 February 2027 · Vientiane, Laos</p>'+
    '<h1>Your invitation</h1>'+
    '<p class="ilede">Open your invitation and we can show you who is travelling with you, and what there is to arrange.</p>'+
    '<div class="gate"><h3>Open your invitation</h3>'+
    '<p class="ibody" style="margin-top:0">Your invitation carries your names. Everything on this website — your journey, the wedding day, your preferences — belongs to it.</p>'+
    '<button type="button" class="gbtn" id="open">Open my invitation</button></div>';
  document.getElementById('open').addEventListener('click',function(){gated(render)});
  return}

var names=p.guests.map(function(g){return G.value(g.guestId,'preferredName')||g.fullName});
var forWhom=names.length>1?names.slice(0,-1).join(', ')+' &amp; '+names[names.length-1]:names[0];
var seen=G.identityReviewed();

var h='<div class="ihero" style="background-image:url(assets/images/event/052-ceremony-green-gateway.jpg)" role="img" aria-label="The green gateway at Souphattra Heritage, Vientiane"></div>';
h+='<p class="ieyebrow">Your invitation · '+esc(p.invitationId)+'</p>';
h+='<p class="iname">'+esc(p.partyName||forWhom)+'</p>';
h+='<p class="ilede">You are invited to join <span class="nb">Haruthai &amp; Suthep</span> in Vientiane for their wedding on Sunday, 28 February 2027.</p>';
h+='<p class="ibody">This private journey brings together your travel arrangements, the Wedding Day, your personal preferences and the details our Guest Relations team needs to look after you. Nothing on this website is paid for here, and nothing is confirmed until Guest Relations confirms it with you personally.</p>';

h+='<section class="iblk"><h2>Your party</h2>';
p.guests.forEach(function(g){
  h+='<div class="iperson"><div><p class="ipn">'+esc(G.value(g.guestId,'preferredName')||g.fullName)+'</p>'+
     '<p class="ipf">'+esc(G.value(g.guestId,'fullName')||g.fullName)+'</p></div>'+
     '<span class="ipr">Named guest</span></div>'});
h+='<div class="ifor"><p class="l">You are making decisions for</p><p class="v">'+forWhom+'</p>'+
   '<p>'+(p.guests.length>1
     ? 'Some answers belong to the whole party — one address, one telephone number, one journey. Others belong to one person: the Temple Ceremony, the Sangkhathan offering and the hospitality questions are answered by name, and every screen tells you whose answer it is.'
     : 'Every answer on this invitation is yours alone.')+'</p></div>';
h+='</section>';

h+='<section class="iblk"><h2>What we will ask you</h2>';
STEPS.forEach(function(s,i){
  h+='<div class="step"><span class="stepn">0'+(i+1)+'</span><div><p class="stept">'+s[0]+'</p>'+
     '<p class="stepd">'+s[2]+'</p></div><span class="stepr'+(s[3]==='Required'?' req':'')+'">'+s[3]+'</span></div>'});
h+='</section>';

h+='<button type="button" class="cta" id="go">'+(seen?'Continue to your journey':'This is right — continue')+'</button>';
h+='<p class="ok" id="okline">'+(seen?'Your party was confirmed on '+when(seen.at):'Confirming this simply tells us you have seen who travels on this invitation.')+'</p>';
h+='<p style="margin-top:18px"><a class="tlink" href="you.html#you">Something here is not right</a></p>';
page.innerHTML=h;
document.getElementById('go').addEventListener('click',function(){
  G.setIdentityReviewed(true);
  location.href='you.html'});
}
document.addEventListener('siyl:guest',function(){/* names may change on you.html */});
render();
if(window.SIYL_BAG&&SIYL_BAG.bar)SIYL_BAG.bar();
})();
</script>
</body></html>
