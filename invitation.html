<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your invitation · See You In Laos</title>
<style>
@font-face{font-family:'PP Editorial Old';src:url('assets/fonts/PPEditorialOld-Ultralight.otf') format('opentype');font-weight:200;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3EEE7;color:#313131;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;font-weight:300;font-size:14px;line-height:1.6}
.hd{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:14px 20px}
.hb{width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:5px;background:none;border:0;cursor:pointer}.hb i{display:block;width:20px;height:1.4px;background:#313131}
.bd{font-family:'PP Editorial Old',serif;font-weight:200;font-size:19px;text-align:center}.bd .dot{color:#8A5A55}
.bag{width:44px;height:44px;display:flex;align-items:center;justify-content:center;position:relative;color:#313131;text-decoration:none}.bag .bgi{display:block}
.bb{position:absolute;top:1px;right:0;min-width:14px;height:14px;padding:0 3px;background:#313131;color:#F3EEE7;font-size:8.5px;line-height:1;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px #F3EEE7;border-radius:1px}
</style>
<link rel="stylesheet" href="assets/aman.css?v=3f5163d8"><link rel="stylesheet" href="assets/prep.css?v=ad4d3a34"></head><body>
<header class="hd"><button class="hb" aria-label="Menu"><i></i><i></i><i></i></button><div class="bd">see you in laos<span class="dot">.</span></div><a class="bag" href="cart.html" aria-label="My Bag"><svg class="bgi" viewBox="0 0 26 26" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5.1 10.1h15.8a.9.9 0 0 1 .9 1l-.95 10.6a1.6 1.6 0 0 1-1.6 1.45H6.75a1.6 1.6 0 0 1-1.6-1.45L4.2 11.1a.9.9 0 0 1 .9-1z"/><path d="M8 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M13.4 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M5.6 14.2h14.8"/><path d="M12.2 13.2h1.6a.5.5 0 0 1 .5.5v1.6a.5.5 0 0 1-.5.5h-1.6a.5.5 0 0 1-.5-.5v-1.6a.5.5 0 0 1 .5-.5z"/></svg><span class="bb" data-bag-badge></span></a><p class="hd-access" data-access data-state="out"><span>Not signed in</span><span class="hd-access-do"><a href="invitation.html?open=1">Open your invitation</a></span></p></header>
<main class="prep-page" id="invitation">
<div id="page"></div>
</main>

<script src="assets/draft.js?v=f42964a5"></script>

<script src="assets/confirm.js?v=15cc65d2"></script>
<script src="assets/rooms-data.js?v=08d91b2d"></script>
<script src="assets/pricing.js?v=e864296d"></script>
<script src="assets/rooms.js?v=6ad9f395"></script>
<script src="assets/seatlabels.js?v=4994e1f4"></script>
<script src="assets/seating.js?v=76c2abde"></script>

<script type="module" src="assets/invite.mjs?v=a19f1b05"></script>
<script>
/* ============================================================================
   01 · YOUR INVITATION — the onboarding of the private journey (Owner, 14 Sep
   2026). Who am I · what is this · what happens next · how many steps.
   The name is the invitation's; the email address and the mobile number are
   REQUIRED and validated; the step completes when both are valid, and only
   then does CONTINUE TO YOUR JOURNEY open. Nothing further is shown early.
   ========================================================================== */
(function(){
var G=window.SIYL_GUEST,P=window.SIYL_PREP,page=document.getElementById('page');
if(!G||!page)return;
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function gated(fn){if(window.SIYL_INVITE){SIYL_INVITE.require(fn)}
else document.addEventListener('siyl:invite-ready',function(){SIYL_INVITE.require(fn)},{once:true})}
var HERO='<span class="p-media" style="background-image:url(assets/images/event/052-ceremony-green-gateway.jpg)" role="img" aria-label="The green gateway at Souphattra Heritage, Vientiane"></span>';
var calm=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
var wasComplete=null;
function render(){
var p=G.party(),me=G.me();
if(!p||!me){
  page.innerHTML='<div class="prep-head">'+HERO+
    '<p class="t-l1">Sunday, 28 February 2027 · Vientiane, Laos</p>'+
    '<h1 class="t-d1">Your invitation</h1>'+
    '<p class="t-b1 measure">Open your invitation and your private trip begins — your name, your travel, the wedding day.</p></div>'+
    '<div class="p-card"><p class="t-l1">'+(G.stale()?'Once more':'Your invitation')+'</p>'+
    '<h2 class="t-h1">'+(G.stale()?'Open your invitation once more':'Open your invitation')+'</h2>'+
    '<p class="t-b1 measure">'+(G.stale()
      ? 'Your invitation is now personal: every guest has their own code. Enter your code once more — what you chose before stays with you.'
      : 'Your invitation carries your name. Everything on this website — your trip, the wedding day, your preferences — belongs to it, and to nobody else.')+'</p>'+
    '<p style="margin-top:var(--s4)"><button type="button" class="p-act" id="open">Open my invitation</button></p></div>';
  document.getElementById('open').addEventListener('click',function(){gated(render)});
  return}
var others=G.others(),steps=G.steps('you'),complete=G.done('you');
var email=G.contact('email'),phone=G.contact('phone'),okE=G.validEmail(email),okP=G.validPhone(phone);
var h='<div class="prep-head">'+HERO+
  '<p class="t-l1">Sunday, 28 February 2027 · Vientiane, Laos</p>'+
  '<h1 class="t-d1">'+esc(G.nameOf())+', you are invited</h1>'+
  '<p class="t-b1 measure">Haruthai &amp; Suthep would love you to join them in Vientiane for their wedding on Sunday, 28 February 2027.</p>'+
  '<p class="t-b2 measure-w">Your travel, the wedding day and the details that help us take care of you along the way — all in one place. No payment is taken here. Guest Relations will confirm each arrangement with you personally.</p>'+
  '</div>';

/* WHO AM I */
h+='<section class="prep-sec" id="you"><p class="t-l1">Your name</p><h2 class="t-h2">'+esc(G.value(me.guestId,'fullName')||me.fullName)+'</h2>'+
   '<p class="t-b2 measure-w">From your invitation'+(others.length?' · Your party · '+esc(G.partyNames())+'. Each of you has your own invitation and your own code; nothing here is answered for anyone else.':'')+'</p></section>';

/* CONTACT — required, validated */
h+='<section class="prep-sec" id="contact"><div class="p-block-h"><h2 class="t-h2">Your contact details</h2><p class="t-l1'+(complete?' on':' open')+'" id="contact-state">'+(complete?'<i class="prep-tick" aria-hidden="true"></i> Complete':'Required')+'</p></div>'+
   '<p class="t-b1 measure">How Guest Relations reaches you about your own arrangements. Both are required.</p>'+
   '<div class="p-card" style="margin-top:var(--s4)">'+
   '<div class="p-field" style="margin-top:0"><label class="t-l1" for="p-email">Email <span aria-hidden="true">· required</span></label><input id="p-email" type="email" inputmode="email" autocomplete="email" value="'+esc(email)+'" data-c="email" aria-required="true" aria-invalid="'+(email&&!okE?'true':'false')+'" aria-describedby="e-email">'+
   '<p class="t-b2" id="e-email" role="status">'+(okE?'<span class="t-l1 on">Looks right</span>':(email?'<span class="t-l1 open">Please check the address</span>':''))+'</p></div>'+
   '<div class="p-field"><label class="t-l1" for="p-phone">Mobile number <span aria-hidden="true">· required</span></label><input id="p-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+66 …" value="'+esc(phone)+'" data-c="phone" aria-required="true" aria-invalid="'+(phone&&!okP?'true':'false')+'" aria-describedby="e-phone">'+
   '<p class="t-b2" id="e-phone" role="status">'+(okP?'<span class="t-l1 on">Looks right</span>':(phone?'<span class="t-l1 open">Please include the country code — digits, spaces and + are fine</span>':'With the country code, in any format.'))+'</p></div>'+
   '</div></section>';

/* WHAT HAPPENS NEXT — the six steps as they stand, nothing ahead shown as done */
h+='<section class="prep-sec"><p class="t-l1">What happens next</p><h2 class="t-h2">Six steps, in order</h2>'+
   '<p class="t-b1 measure">Each step opens once the one before it is complete. You can return to a completed step at any time.</p><div class="p-card p-steps">';
steps.forEach(function(s){
  h+='<div class="p-kv"><span class="n">'+s.n+'</span><div><p class="t-b1"><b>'+esc(s.label)+'</b></p><p class="t-b2">'+esc(({you:'Your name and how we reach you.',journey:'Your travel and your stays, from Bangkok to Vientiane and on to Yunnan.',wedding:'Which parts of the wedding day you will join — and the Sangkhathan.',preparation:'The dress code, and your seats at the ceremony and the dinner.',about:'Food allergies, a few favourites, photography.',review:'Everything in one place, sent to Guest Relations.'})[s.key])+'</p></div>'+
     '<p class="t-l1'+(s.state==='complete'||s.state==='current'?' on':(s.state==='attention'?' open':''))+'">'+(s.state==='complete'?'<i class="prep-tick" aria-hidden="true"></i> Complete':s.state==='current'?'Current':s.state==='attention'?'Needs attention':'Locked')+'</p></div>'});
h+='</div></section>';

/* leaving */
h+='<section class="prep-sec"><p class="t-l1">Another invitation?</p><h2 class="t-h2">Helping someone with theirs?</h2>'+
   '<p class="t-b1 measure">Every guest has their own code. Open another invitation to continue as someone else; what you have already sent stays with Guest Relations, and yours opens again with your code.</p>'+
   '<div class="p-actions" style="margin-top:var(--s3)"><button type="button" class="p-link" data-leave="another">Open another invitation</button> <button type="button" class="p-link mute" data-leave="out" style="margin-left:16px">Sign out</button></div></section>';

/* the one continuation — strict */
h+='<div class="prep-foot"><span></span><button type="button" class="p-act'+(complete?'':' off')+'" id="go" aria-disabled="'+(complete?'false':'true')+'">Continue to My Trip</button>'+
   '<p class="t-b2 prep-foot-note" role="status" aria-live="polite"'+(complete?' hidden':'')+'>Add your email address and mobile number to continue.</p></div>';
page.innerHTML=h;

/* the completion: the check draws once, when the step becomes complete */
if(wasComplete===false&&complete){var st=document.getElementById('contact-state');if(st){st.classList.add('p-reveal')}var go=document.getElementById('go');if(go)go.classList.add('p-reveal')}
wasComplete=complete;

page.querySelectorAll('input[data-c]').forEach(function(i){
  var save=function(){G.setContact(i.getAttribute('data-c'),i.value.trim())};
  i.addEventListener('change',function(){save();var f=i.id;render();var n=document.getElementById(f);if(n)try{n.focus({preventScroll:true})}catch(e){}});
  i.addEventListener('blur',save)});
page.querySelectorAll('[data-leave]').forEach(function(b){b.addEventListener('click',function(){if(P&&P.leave)P.leave(b.getAttribute('data-leave'))})});
var go=document.getElementById('go');
if(go)go.addEventListener('click',function(){
  var missing=G.missingFor('you');
  if(missing.length){var note=page.querySelector('.prep-foot-note');if(note){note.hidden=false;note.textContent='Before you continue: '+missing[0].label.toLowerCase()+'.'}go.classList.remove('p-shake');void go.offsetWidth;go.classList.add('p-shake');if(P)P.focusControl('#'+missing[0].href.split('#')[1]);return}
  go.classList.add('is-done');go.setAttribute('aria-disabled','true');go.innerHTML='<i class="prep-tick big" aria-hidden="true"></i>Complete';
  setTimeout(function(){location.href=(P?P.hrefOf('your-journey.html'):'your-journey.html')},calm?0:520)});
}
document.addEventListener('siyl:guest',render);
document.addEventListener('siyl:auth',render);
render();
/* "Open another invitation" arrives here with ?open=1: the code prompt is
 * presented at once, on a clean screen, once the invitation module is ready */
function autoOpen(){if(/[?&]open=1/.test(location.search)&&window.SIYL_INVITE&&!G.party())setTimeout(function(){SIYL_INVITE.require(render)},380)}
if(window.SIYL_INVITE)autoOpen();else document.addEventListener('siyl:invite-ready',autoOpen,{once:true});
/* a deep link to one of the two fields lands on it, open for typing */
if(/^#p-(email|phone)$/.test(location.hash)&&P)setTimeout(function(){P.focusControl(location.hash)},420);
if(window.SIYL_BAG&&SIYL_BAG.bar)SIYL_BAG.bar();
})();
</script>
</body></html>
