<script>
/* ============================================================================
   01 · YOUR INVITATION — the onboarding of the private journey (Owner, 14 Sep
   2026). Who am I · what is this · what happens next · how many steps.
   The name is the invitation's; the email address and the mobile number are
   REQUIRED and validated; the step completes when both are valid, and only
   then does CONTINUE TO YOUR JOURNEY open. Nothing further is shown early.
   ========================================================================== */
(function(){
var G=window.SIYL_GUEST,P=window.SIYL_PREP,page=document.getElementById('page');
if(!G||!page)return;
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function gated(fn){if(window.SIYL_INVITE){SIYL_INVITE.require(fn)}
else document.addEventListener('siyl:invite-ready',function(){SIYL_INVITE.require(fn)},{once:true})}
var HERO='<span class="p-media" style="background-image:url(assets/images/event/052-ceremony-green-gateway.jpg)" role="img" aria-label="The green gateway at Souphattra Heritage, Vientiane"></span>';
var calm=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
var wasComplete=null,TRIED=false;   /* TRIED: the guest has pressed Continue with something missing */
/* the one-time line after signing out (PRQ-01-03): read once, when the invitation module is ready, then kept for this page view */
var SIGNED_OUT='';
function takeSignedOut(){if(window.SIYL_INVITE&&SIYL_INVITE.signedOutLine){var v=SIYL_INVITE.signedOutLine();if(v)SIGNED_OUT=v}}
/* a British list: “A, B and C” */
function list(a){a=a.filter(Boolean);return a.length>1?a.slice(0,-1).join(', ')+' and '+a[a.length-1]:(a[0]||'')}
/* NAME WHAT IS MISSING (canon §6): each field's own sentence, shown under it after Continue */
var ADD={email:'Please add your email address.',phone:'Please add your mobile number, with the country code.',firstName:'Please add your first name.',lastName:'Please add your last name.',birthdate:'Please add your date of birth.',nationality:'Please add your nationality.',address1:'Please add your street and house number.',postal:'Please add your postcode or ZIP code.',city:'Please add your city.',country:'Please add your country.'};
var BAD_DATE='This date does not look right — please check it.';
/* ONE QUIET MARKER (NEW-01): the same element in the same place on every field — “Required” (hidden from assistive technology,
   the input carries aria-required) or, on Address line 2 and the region alone, “Optional” */
function mark(opt){return opt?'<span class="p-mark">Optional</span>':'<span class="p-mark" aria-hidden="true">Required</span>'}
function render(){
var p=G.party(),me=G.me();
if(!p||!me){
  var stale=G.stale();
  page.innerHTML='<div class="prep-head">'+HERO+
    '<p class="t-l1">Sunday, 28 February 2027 · Vientiane, Laos</p>'+
    '<h1 class="t-d1">Your invitation</h1>'+
    '<p class="t-b1 measure">Our wedding journey begins here. The private code in your invitation letter opens your own invitation — your travel, the wedding day and everything we are planning for you.</p></div>'+
    '<div class="p-card">'+(SIGNED_OUT?'<p class="t-b1 measure" role="status" data-signed-out>'+esc(SIGNED_OUT)+'</p>':'')+
    (stale?'<h2 class="t-h1">Open your invitation once more</h2><p class="t-b1 measure">Every guest now has their own invitation code. Please enter yours — everything you chose before is still here.</p>':'')+
    '<p'+(SIGNED_OUT||stale?' style="margin-top:var(--s4)"':'')+'><button type="button" class="p-act" id="open">Open your invitation</button></p></div>';
  document.getElementById('open').addEventListener('click',function(){gated(render)});
  return}
SIGNED_OUT='';
var others=G.others(),steps=G.steps('you'),complete=G.done('you');
/* THE HOSTS (OQ-35 · PRQ-01-17): the Bride and the Groom are welcomed to their own journey, never invited to it */
var host=me.hostRole==='BRIDE'||me.hostRole==='GROOM'||(G.isHost&&G.isHost());
var email=G.contact('email'),phone=G.contact('phone'),okE=G.validEmail(email),okP=G.validPhone(phone);
var h='<div class="prep-head">'+HERO+
  '<p class="t-l1">Sunday, 28 February 2027 · Vientiane, Laos</p>'+
  '<h1 class="t-d1">'+esc(G.nameOf())+(host?', welcome to our wedding journey':', you are invited')+'</h1>'+
  '<p class="t-b1 measure">'+(host?'This is the journey our guests see — here in your own name, with your own travel, seats and details.':'Haruthai &amp; Suthep would love you to join them in Vientiane for their wedding on Sunday, 28 February 2027.')+'</p>'+
  '<p class="t-b2 measure-w">Your travel, the wedding day and the few details that help us look after you — all in one place. Nothing is paid on this website; Guest Relations confirms each arrangement with you personally.</p>'+
  '</div>';

/* CONTACT — required, validated */
h+='<section class="prep-sec" id="contact"><div class="p-block-h"><h2 class="t-h2">Your contact details</h2><p class="t-l1'+(okE&&okP?' on':' open')+'" id="contact-state">'+(okE&&okP?'<i class="prep-tick" aria-hidden="true"></i> Complete':'Required')+'</p></div>'+
   '<p class="t-b1 measure">Guest Relations will use these to reach you about your arrangements.</p>'+
   '<div class="p-card" style="margin-top:var(--s4)">'+
   '<div class="p-field'+(TRIED&&!okE?' is-needed':'')+'" style="margin-top:0"><label class="t-l1 p-lab" for="p-email">Email address'+mark()+'</label><input id="p-email" type="email" inputmode="email" autocomplete="email" value="'+esc(email)+'" data-c="email" aria-required="true" aria-invalid="'+((email&&!okE)||(TRIED&&!okE)?'true':'false')+'" aria-describedby="e-email">'+
   '<p class="t-b2" id="e-email" role="status">'+(okE?'<span class="t-l1 on">Looks right</span>':(email?'<span class="t-l1 open">Please check this email address.</span>':(TRIED?'<span class="t-l1 open">'+ADD.email+'</span>':'')))+'</p></div>'+
   '<div class="p-field'+(TRIED&&!okP?' is-needed':'')+'"><label class="t-l1 p-lab" for="p-phone">Mobile number'+mark()+'</label><input id="p-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+66 …" value="'+esc(phone)+'" data-c="phone" aria-required="true" aria-invalid="'+((phone&&!okP)||(TRIED&&!okP)?'true':'false')+'" aria-describedby="e-phone">'+
   '<p class="t-b2" id="e-phone" role="status">'+(okP?'<span class="t-l1 on">Looks right</span>':(phone?'<span class="t-l1 open">Please check this number and include the country code — digits, spaces and + are fine.</span>':(TRIED?'<span class="t-l1 open">'+ADD.phone+'</span>':'With the country code, in any format.')))+'</p></div>'+
   '</div></section>';

/* THE PERSONAL DETAILS (Owner, 20 Sep 2026): the signed-in person's own — what the guest list knows is prefilled to check and
   correct; REQUIRED since 24 Sep 2026 (Owner) except Address line 2 and the region. The person id and the couple id are the
   register's: never edited and never shown here (OQ-37). */
var bd=G.contact('birthdate'),okB=!bd||G.validBirthdate(bd),miss=G.personalMissing?G.personalMissing():G.youMissing().filter(function(m){return m.key!=='email'&&m.key!=='phone'});
/* REQUIRED MEANS REQUIRED (Owner, 24 Sep 2026): after an attempt to continue with something missing, each missing field names
   itself beneath the field and the first one takes the focus; a filled but invalid entry says so, never “missing” (PRQ-01-19) */
var ym=G.youMissing(),need={};ym.forEach(function(m){need[m.key]=m});
var flag=function(key){return TRIED&&need[key]?'<p class="t-b2 p-need" id="n-'+key+'"><span class="t-l1 open">'+(need[key].invalid&&key==='birthdate'?BAD_DATE:(ADD[key]||''))+'</span></p>':''};
var inv=function(key){return ' aria-required="true" aria-invalid="'+(TRIED&&need[key]?'true':'false')+'"'+(TRIED&&need[key]?' aria-describedby="n-'+key+'"':'')};
var fld=function(key,label,type,extra,hint,opt){var v=G.contact(key);return '<div class="p-field'+(TRIED&&need[key]?' is-needed':'')+'"><label class="t-l1 p-lab" for="p-'+key+'">'+label+mark(opt)+'</label><input id="p-'+key+'" type="'+(type||'text')+'" '+(extra||'')+(opt?'':inv(key))+' value="'+esc(v)+'" data-c="'+key+'">'+flag(key)+(hint?'<p class="t-b2">'+hint+'</p>':'')+'</div>'};
/* THE PARTY WITHOUT THE READER (PRQ-01-01): the others by first name; the hosts are not “invited together” */
var withO=G.othersNames?G.othersNames():'';
h+='<section class="prep-sec" id="personal"><div class="p-block-h"><h2 class="t-h2">Your personal details</h2><p class="t-l1'+(miss.length?' open':' on')+'" id="personal-state">'+(miss.length?(miss.length===1?'1 detail still needed':miss.length+' details still needed'):'<i class="prep-tick" aria-hidden="true"></i> Complete')+'</p></div>'+
   '<p class="t-b1 measure">Please check what we already have and correct anything that is not quite right.'+(others.length&&withO&&!host?' You are invited together with '+esc(withO)+', and each of you answers on your own invitation.':'')+'</p>'+
   '<div class="p-card" style="margin-top:var(--s4)">'+
   /* THE GUEST'S OWN NAME (Owner, 21 Sep 2026): First name · Last name, prefilled from the invitation, the guest's to correct;
      a name the guest clears stays cleared (PRQ-01-20); the identity beneath never changes with the words */
   '<div class="p-field'+(TRIED&&need.firstName?' is-needed':'')+'" style="margin-top:0"><label class="t-l1 p-lab" for="p-firstName">First name'+mark()+'</label><input id="p-firstName" type="text" autocomplete="given-name"'+inv('firstName')+' value="'+esc(G.nameField('firstName'))+'" data-c="firstName">'+flag('firstName')+'</div>'+
   '<div class="p-field'+(TRIED&&need.lastName?' is-needed':'')+'"><label class="t-l1 p-lab" for="p-lastName">Last name'+mark()+'</label><input id="p-lastName" type="text" autocomplete="family-name"'+inv('lastName')+' value="'+esc(G.nameField('lastName'))+'" data-c="lastName">'+flag('lastName')+'<p class="t-b2">Both names exactly as in your passport.</p></div>'+
   '<div class="p-field'+(TRIED&&need.birthdate?' is-needed':'')+'"><label class="t-l1 p-lab" for="p-birthdate">Date of birth'+mark()+'</label><input id="p-birthdate" type="date" min="1900-01-01" max="'+new Date().toISOString().slice(0,10)+'" autocomplete="bday" value="'+esc(bd)+'" data-c="birthdate" aria-required="true" aria-invalid="'+((bd&&!okB)||(TRIED&&need.birthdate)?'true':'false')+'" aria-describedby="e-birthdate">'+
   '<p class="t-b2" id="e-birthdate" role="status">'+(bd&&!okB?'<span class="t-l1 open">'+BAD_DATE+'</span>':(TRIED&&need.birthdate?'<span class="t-l1 open">'+ADD.birthdate+'</span>':''))+'</p></div>'+
   fld('nationality','Nationality','text','autocomplete="off" placeholder="Thai, German"','As in your passport. If you hold more than one, please list them all.')+
   '<p class="t-l1" style="margin-top:var(--s4)">Private postal address</p><p class="t-b2 measure-w">'+esc(G.ADDRESS_WORDS)+'</p>'+
   fld('address1','Street and house number','text','autocomplete="address-line1"')+fld('address2','Address line 2','text','autocomplete="address-line2"','',true)+
   fld('postal','Postcode or ZIP code','text','autocomplete="postal-code" inputmode="text"')+fld('city','City','text','autocomplete="address-level2"')+
   fld('region','State, province or region','text','autocomplete="address-level1"','Only where your address has one.',true)+fld('country','Country','text','autocomplete="country-name"')+
   '</div></section>';

/* WHAT HAPPENS NEXT — the six steps as they stand, nothing ahead shown as done; each description scoped to what the step
   asks this guest (PRQ-01-15) */
var T=window.SIYL_TEMPLE,offered=!!(T&&T.eligibility&&T.eligibility()==='ELIGIBLE'&&!(T.attendanceOf&&T.attendanceOf(me.guestId)==='no'));
var photo=G.photoApplies?G.photoApplies():true;
var DESC={you:'Your name, how we reach you and your personal details.',journey:'Your travel and your stays, from Bangkok to Vientiane and on to Yunnan.',
  wedding:offered?'Which parts of the wedding day you will join, and whether you would like to make the Sangkhathan offering.':'Which parts of the wedding day you will join.',
  preparation:'The dress code, and your seats at the ceremony and the dinner.',
  about:photo?'Food allergies, a few favourites and photography.':'Food allergies and a few favourites.',
  review:'Everything in one place, to look over and send to us.'};
h+='<section class="prep-sec"><p class="t-l1">What happens next</p><h2 class="t-h2">Six steps, in order</h2>'+
   '<p class="t-b1 measure">Each step opens once the one before it is complete, and you can return to a completed step at any time. If you cannot join us, you can tell us on the next step.</p><div class="p-card p-steps">';
steps.forEach(function(s){
  /* the state words are the guest module's; “Ready to send” is a normal state in Ink, never the Cherry of an open step (PRQ-01-18) */
  var cls=s.state==='complete'||s.state==='current'||s.state==='ready'?' on':(s.state==='attention'?' open':'');
  h+='<div class="p-kv"><span class="n">'+s.n+'</span><div><p class="t-b1"><b>'+esc(s.label)+'</b></p><p class="t-b2">'+esc(DESC[s.key]||'')+'</p></div>'+
     '<p class="t-l1'+cls+(s.state==='ready'?' is-ready':'')+'">'+(s.state==='complete'?'<i class="prep-tick" aria-hidden="true"></i> Complete':esc(s.stateLabel||''))+'</p></div>'});
h+='</div></section>';

/* leaving — the autosave is flushed first; if it cannot be saved the guest stays signed in and is told so (PRQ-01-03) */
h+='<section class="prep-sec"><h2 class="t-h2">Helping someone with theirs?</h2>'+
   '<p class="t-b1 measure">Every guest has their own code. To help someone with their trip, open their invitation with it — your own choices stay saved with yours.</p>'+
   '<div class="p-actions" style="margin-top:var(--s3)"><button type="button" class="p-link" data-leave="another">Open another invitation</button> <button type="button" class="p-link mute" data-leave="out" style="margin-left:16px">Sign out</button></div>'+
   '<p class="t-b2" data-leave-note role="status" aria-live="polite"></p></section>';

/* the one continuation — strict; the foot names what is still needed, invalid entries as such (PRQ-01-19) */
var labels=ym.map(function(m){return m.label});
h+='<div class="prep-foot"><span></span><button type="button" class="p-act'+(complete?'':' off')+'" id="go" aria-disabled="'+(complete?'false':'true')+'">Continue to My Trip</button>'+
   '<p class="t-b2 prep-foot-note" role="status" aria-live="polite"'+(complete?' hidden':'')+'>'+(ym.length===1?'One detail is still needed before you continue: '+esc(labels[0])+'.':ym.length+' details are still needed before you continue'+(TRIED?': '+esc(list(labels))+'.':'.'))+'</p></div>';
page.innerHTML=h;

/* the completion: the check draws once, when the step becomes complete */
if(wasComplete===false&&complete){var st=document.getElementById('contact-state');if(st){st.classList.add('p-reveal')}var go=document.getElementById('go');if(go)go.classList.add('p-reveal')}
wasComplete=complete;

page.querySelectorAll('input[data-c]').forEach(function(i){
  var save=function(){G.setContact(i.getAttribute('data-c'),i.value.trim())};
  i.addEventListener('change',function(){save();var f=i.id;render();var n=document.getElementById(f);if(n)try{n.focus({preventScroll:true})}catch(e){}});
  i.addEventListener('blur',save)});
page.querySelectorAll('[data-leave]').forEach(function(b){b.addEventListener('click',function(){
  var how=b.getAttribute('data-leave'),note=page.querySelector('[data-leave-note]'),I=window.SIYL_INVITE;
  if(note)note.textContent='';
  if(!I||!I.leave){if(P&&P.leave)P.leave(how);return}
  /* the save first: only when it is kept does the device forget this guest */
  Promise.resolve(I.leave()).then(function(r){
    if(r&&r.ok===false){if(note)note.textContent=r.words||'';return}
    var to=(P&&P.hrefOf?P.hrefOf('invitation.html'):'invitation.html')+(how==='another'?'?open=1':'');
    location.replace(to)})})});
var go=document.getElementById('go');
if(go)go.addEventListener('click',function(){
  /* the fields in focus are saved first: what the guest just typed counts */
  page.querySelectorAll('input[data-c]').forEach(function(i){G.setContact(i.getAttribute('data-c'),i.value.trim())});
  var missing=G.missingFor('you');
  if(missing.length){TRIED=true;render();var g2=document.getElementById('go');if(g2){g2.classList.remove('p-shake');void g2.offsetWidth;g2.classList.add('p-shake')}if(P)P.focusControl('#'+missing[0].href.split('#')[1]);return}
  go.classList.add('is-done');go.setAttribute('aria-disabled','true');go.innerHTML='<i class="prep-tick big" aria-hidden="true"></i>Complete';
  setTimeout(function(){location.href=(P?P.hrefOf('your-journey.html'):'your-journey.html')},calm?0:520)});
}
document.addEventListener('siyl:guest',render);
document.addEventListener('siyl:auth',render);
render();
/* "Open another invitation" arrives here with ?open=1: the code prompt is
 * presented at once, on a clean screen, once the invitation module is ready */
function autoOpen(){if(/[?&]open=1/.test(location.search)&&window.SIYL_INVITE&&!G.party())setTimeout(function(){SIYL_INVITE.require(render)},380)}
function ready(){if(!G.party()){takeSignedOut();if(SIGNED_OUT)render()}autoOpen()}
if(window.SIYL_INVITE)ready();else document.addEventListener('siyl:invite-ready',ready,{once:true});
/* a deep link to one of the two fields lands on it, open for typing */
if(/^#p-(email|phone)$/.test(location.hash)&&P)setTimeout(function(){P.focusControl(location.hash)},420);
if(window.SIYL_BAG&&SIYL_BAG.bar)SIYL_BAG.bar();
})();
</script>
</body></html>
