<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>See You In Laos · Planning / Selection Pattern</title>
<link rel="stylesheet" href="assets/recon.css">
</head>
<body>
<main>
  <section class="section content" style="margin-top:calc(var(--section) + 10px)">
    <div class="wizard">
      <p class="eyebrow" style="text-align:center;margin-bottom:12px">Plan</p>
      <h1 class="t-display">Shape your journey in a few quiet choices</h1>
      <p class="t-body lede">Options are multi-selectable; a running summary reflects every change below. Neutral placeholder values throughout.</p>

      <div class="w-group">
        <p class="eyebrow">1 · When</p>
        <div class="w-opts">
          <button class="w-opt">Season one</button>
          <button class="w-opt">Season two</button>
          <button class="w-opt">Season three</button>
        </div>
      </div>

      <div class="w-group">
        <p class="eyebrow">2 · Where</p>
        <div class="w-opts">
          <button class="w-opt">Region A</button>
          <button class="w-opt">Region B</button>
          <button class="w-opt">Region C</button>
          <button class="w-opt">Region D</button>
        </div>
      </div>

      <div class="w-group">
        <p class="eyebrow">3 · What matters most<a class="w-help" href="#">Help me choose</a></p>
        <div class="w-opts">
          <button class="w-opt">Stillness</button>
          <button class="w-opt">Culture</button>
          <button class="w-opt">Nature</button>
          <button class="w-opt">Table</button>
        </div>
      </div>

      <p class="w-summary" aria-live="polite"></p>

      <div class="w-nav">
        <a class="t-link" href="index.html">Previous</a>
        <a class="t-link" href="voyage.html">See matching voyages</a>
      </div>
    </div>
  </section>
</main>
<script src="assets/recon.js"></script>
</body>
</html>
