.sp .sp-garden{fill:#E6EBE2;stroke:#B4BEAE;stroke-width:1.2}
.sp .sp-event{font-family:'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;letter-spacing:2px;fill:#8A5A55}
.sp .sp-use{font-family:'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;letter-spacing:2.5px;fill:#6B6964}
</style>
