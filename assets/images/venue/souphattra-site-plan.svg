<svg xmlns="http://www.w3.org/2000/svg" class="sp" viewBox="95 186 900 884" width="900" height="884" role="img" aria-labelledby="sp-title sp-desc">
<title id="sp-title">Souphattra Heritage Vientiane · site plan</title>
<desc id="sp-desc">Schematic site plan, not to scale, drawn from the hotel's official plan: Building A with the Lobby, reception and check-in; Building F with the Peacock Bistro, for breakfast and Coffee and Cake; the Green Doors between them, for the Vow Ceremony and the Wedding Dinner; Peacock Court; the central garden; the swimming pool; the guest rooms in Buildings B to F; and the walkways between them.</desc>
