<title id="sp-title">Souphattra Heritage Vientiane · site plan</title>
<desc id="sp-desc">Schematic site plan, not to scale, drawn from the hotel's official plan: Building A with the Lobby, Building B, Building C, Building D, Building E, Building F with the Peacock Bistro, Peacock Court, the pool, and the walkways between them.</desc>
