.sp .sp-site{fill:#FBF8F2;stroke:#B9B2A6;stroke-width:1.5}
.sp .sp-fence{fill:none;stroke:#C9C2B5;stroke-width:1.5;stroke-dasharray:6 6}
.sp .sp-walk{fill:none;stroke:#E2DACB;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.sp .sp-bldg{fill:#E9E2D6;stroke:#8B8478;stroke-width:1.6}
.sp .sp-open{fill:#F1ECE2;stroke:#C9C2B5;stroke-width:1.2}
.sp .sp-court{fill:#EFE9DE;stroke:#8B8478;stroke-width:1.4}
.sp .sp-water{fill:#CFDCD8;stroke:#8FA6A1;stroke-width:1.4}
.sp .sp-cap{font-family:'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;letter-spacing:3px;fill:#6B6964}
.sp .sp-name{font-family:'PP Editorial Old',Georgia,'Times New Roman',serif;font-size:24px;fill:#313131}
