<style>
/* ONE place: its photographs, its words, and — where the hosts offer it — the
   Journey action. Same grammar as every editorial page; nothing new is invented. */
.x-wrap { max-width: var(--a-frame, 1180px); margin: 0 auto; }   /* the page frame (1280 px from 1600): the gallery and the words share one wall */
.x-gal { margin: 0 0 34px; }
.x-head { padding: 0 var(--a-gut); max-width: 760px; }
.x-head .a-eyebrow { margin-bottom: 14px; }
.x-head h1 { font-family: 'PP Editorial Old', Georgia, serif; font-weight: 200; font-size: 31px; line-height: 1.22; letter-spacing: .3px; margin: 0 0 16px; }
.x-lede { font-size: 14px; line-height: 1.85; color: #4A4A4A; max-width: 32em; }
.x-sec { padding: 0 var(--a-gut); max-width: 760px; margin-top: 52px; }
.x-sec h2 { font-family: 'PP Editorial Old', Georgia, serif; font-weight: 200; font-size: 24px; line-height: 1.3; margin: 8px 0 14px; }
.x-sec p { font-size: 13.5px; line-height: 1.85; color: #4A4A4A; max-width: 32em; margin-bottom: 12px; }
.x-acc { border-top: 1px solid var(--a-line); margin-top: 26px; }
.x-acc > div { border-bottom: 1px solid var(--a-line); }
.x-acc button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 14px; background: none; border: 0; padding: 18px 0; font: inherit; cursor: pointer; min-height: 56px; text-align: left; color: var(--a-ink); }
.x-acc button .k { font-family: 'Hanken Grotesk', Helvetica, Arial, sans-serif; font-size: 10px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--a-mute); display: block; margin-bottom: 5px; }
.x-acc button .t { font-family: 'PP Editorial Old', Georgia, serif; font-weight: 200; font-size: 21px; line-height: 1.25; display: block; }
.x-acc button .x { font-size: 20px; line-height: 1; color: var(--a-mute); flex: 0 0 auto; width: 24px; margin-right: 4px; text-align: center; transition: transform .24s; }   /* turned to × it still ends inside the wall */
.x-acc button[aria-expanded="true"] .x { transform: rotate(45deg); }
.x-acc .in { display: none; padding: 0 0 22px; }
.x-acc .in.on { display: block; }
.x-acc .in .by { font-family: 'Hanken Grotesk', Helvetica, Arial, sans-serif; font-size: 10px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--a-mute); }
.x-when { font-family: 'PP Editorial Old', Georgia, serif; font-weight: 200; font-style: italic; font-size: 16px; line-height: 1.4; color: var(--a-mute); margin: -6px 0 12px; }
.x-visits .x-kv > div { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
/* THE FILMS WITH SOUND (BARON): tall phone films and one square, each its own frame with the shared clip controls */
.x-films-note { color: var(--a-mute); }
.x-films-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 18px; }
.x-film { position: relative; width: 100%; background: #1a1614 center/cover no-repeat; overflow: hidden; }
.x-film.is-tall { aspect-ratio: 9 / 16; }
.x-film.is-square { aspect-ratio: 1 / 1; }
@media (min-width: 600px) { .x-films-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .x-film.is-square { grid-column: 1 / -1; aspect-ratio: 16 / 10; } }
@media (min-width: 900px) { .x-films-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; } .x-film.is-square { grid-column: auto; aspect-ratio: 1 / 1; } }
.x-kv { display: grid; grid-template-columns: 1fr; gap: 0; border-top: 1px solid var(--a-line); margin-top: 22px; }
.x-kv > div { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--a-line); align-items: baseline; }
.x-kv .k { font-family: 'Hanken Grotesk', Helvetica, Arial, sans-serif; font-size: 10px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--a-mute); }
.x-kv .v { font-size: 13.5px; line-height: 1.75; color: var(--a-ink); min-width: 0; overflow-wrap: anywhere; }   /* an address, an e-mail or a Thai line never pushes past the wall */
.x-kv .v .price { font-family: 'PP Editorial Old', Georgia, serif; font-weight: 200; font-size: 22px; line-height: 1.2; display: block; margin-bottom: 4px; }
.x-kv .v small { display: block; font-size: 12px; line-height: 1.7; color: #4A4A4A; max-width: 30em; }
.x-links { display: flex; flex-wrap: wrap; gap: 22px; margin-top: 18px; }
.x-sel { margin: 60px var(--a-gut) 0; max-width: 760px; background: #FCFAF6; padding: 30px 24px 32px; }
.x-sel h2 { font-family: 'PP Editorial Old', Georgia, serif; font-weight: 200; font-size: 25px; line-height: 1.25; margin: 12px 0 12px; }
.x-sel .price { font-family: 'PP Editorial Old', Georgia, serif; font-weight: 200; font-size: 19px; }
.x-sel p { font-size: 13px; line-height: 1.8; color: #4A4A4A; max-width: 32em; margin: 8px 0 0; }
.x-cta { display: block; width: 100%; background: var(--a-ink); color: #F3EEE7; border: 0; padding: 19px; font-family: 'Hanken Grotesk', Helvetica, Arial, sans-serif; font-size: 11px; letter-spacing: 2.2px; text-transform: uppercase; cursor: pointer; min-height: 52px; text-align: center; margin-top: 24px; text-decoration: none; }
.x-cta:focus-visible { outline: 2px solid var(--a-ink); outline-offset: 3px; }
.x-cur { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 24px; padding: 16px 0 0; border-top: 1px solid var(--a-line); }
.x-cur .on { font-family: 'Hanken Grotesk', Helvetica, Arial, sans-serif; font-size: 10px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--a-ink); display: inline-flex; align-items: center; gap: 10px; min-height: 44px; }
.x-cur .on::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--a-ink); }
.x-cur .a-link { margin: 0; }
.x-qty { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--a-line); }
.x-qty .a-eyebrow { flex: 1 1 100%; }
.x-step { width: 44px; height: 44px; border: 1px solid var(--a-line); background: #fff; font-size: 18px; line-height: 1; cursor: pointer; color: var(--a-ink); }
.x-step[disabled] { opacity: .35; cursor: default; }
.x-qty b { font-family: 'PP Editorial Old', Georgia, serif; font-weight: 200; font-size: 22px; min-width: 28px; text-align: center; }
.x-amt { margin-left: auto; font-family: 'PP Editorial Old', Georgia, serif; font-weight: 200; font-size: 19px; }
.x-back { padding: 0 var(--a-gut); margin: 44px 0 0; }
/* THE HIGHLIGHTS (Owner, 20 Sep 2026): the distinction above the name, the house's line and its menu — the same grammar,
   one more register of prominence; the booking module (assets/highlight.js) draws the table section */
.x-dist { font-family: 'Hanken Grotesk', Helvetica, Arial, sans-serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--a-ink); margin: 0 0 12px; display: flex; align-items: center; gap: 12px; }
.x-dist::before { content: ''; width: 22px; height: 1px; background: var(--a-ink); }
.x-line { font-family: 'PP Editorial Old', Georgia, serif; font-weight: 200; font-size: 19px; line-height: 1.4; color: var(--a-ink); max-width: 30em; margin: 0 0 14px; }
.x-house { font-size: 13.5px; line-height: 1.85; color: #4A4A4A; max-width: 32em; }
.x-menu { list-style: none; margin: 18px 0 0; padding: 0; border-top: 1px solid var(--a-line); }
.x-menu li { padding: 13px 0; border-bottom: 1px solid var(--a-line); font-size: 13.5px; line-height: 1.7; color: var(--a-ink); }
.x-menu li::first-letter { text-transform: uppercase; }
.x-menunote { font-size: 12.5px; line-height: 1.75; color: #4A4A4A; max-width: 34em; margin-top: 16px; }
.x-clip { margin: 0 var(--a-gut) 34px; max-width: 760px; }
.x-clip .am { position: relative; aspect-ratio: 4 / 5; background: #E7E3DB center/cover no-repeat; overflow: hidden; }
.x-dress { border-top: 1px solid var(--a-line); padding-top: 26px; }
.x-dress h2 { margin-top: 10px; }
.x-dresslink { margin-top: 14px; }
.x-contact { font-size: 13.5px; line-height: 1.75; }
.x-contact a { color: var(--a-ink); overflow-wrap: anywhere; }
.x-kv .v { overflow-wrap: anywhere; }
@media (min-width: 900px) { .x-clip { margin: 0 0 44px var(--a-gut); } .x-clip .am { aspect-ratio: 16 / 10; } }   /* the film on the reading column's left axis, never re-centred (layout QA agent, 25 Sep 2026) */
.x-none { padding: 80px var(--a-gut); max-width: 760px; }
@media (min-width: 900px) {
  .x-gal { margin-bottom: 44px; }
  .x-head h1 { font-size: 40px; }
  /* THE READING COLUMN ON THE WALL'S LEFT AXIS (the site-wide layout QA agent, 25 Sep 2026): 760 px from the same left
     edge as the gallery above it, never re-centred (it began 146 px inside the photograph's edge at 1440) */
  .x-head, .x-sec, .x-back { max-width: 760px; margin-left: var(--a-gut); margin-right: auto; padding: 0; }
  .x-sec { margin-top: 64px; }
  .x-sel { max-width: 760px; margin: 76px auto 0 var(--a-gut); padding: 40px 44px 44px; }
  .x-kv > div { grid-template-columns: 160px minmax(0, 1fr); }
}

<script>
(function () {
  var D = window.SIYL_DISCOVER;
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  var id = new URLSearchParams(location.search).get('id') || '';
  var x = (window.SIYL_EXP || []).filter(function (e) { return e.id === id; })[0];
  var root = document.getElementById('x');
  if (!x) {
    document.title = 'Experiences · See You In Laos';
    root.innerHTML = '<div class="x-none"><p class="a-eyebrow">Experiences</p><h1>This place is not on the list.</h1>' +
      '<p class="x-lede" style="margin-top:14px">The places we would take you ourselves are all on one page.</p>' +
      '<p style="margin-top:22px"><a class="a-link" href="experiences.html">All experiences</a></p></div>';
    return;
  }
  document.title = x.name + ' · See You In Laos';
  var roles = D.LABEL[D.categoryOf(x)] || '';   /* the category: what the place IS (Owner, 22 Sep 2026) */
  var when = D.dateWords(x), vis = D.visits(x);
  /* no provenance line (Window 007, PRQ-07a-02): the dated days are the header date and "On the itinerary" */
  var h = '';
  h += '<section class="x-gal">' + (window.SIYL_XGAL ? SIYL_XGAL.html(x) : '') + '</section>';
  var hl = x.highlight || null;
  h += '<header class="x-head"><p class="a-eyebrow">' + esc(x.where) + (roles ? ' · ' + esc(roles) : '') + '</p>' + (when ? '<p class="x-when">' + esc(when) + '</p>' : '') +
       (hl && hl.distinction ? '<p class="x-dist" data-distinction>' + esc(hl.distinction) + '</p>' : '') +
       '<h1>' + esc(x.name) + '</h1>' +
       (hl && hl.line ? '<p class="x-line">' + esc(hl.line) + '</p>' : '') +
       '<p class="x-lede">' + esc(x.intro || x.teaser || '') + '</p>' +
       (hl && hl.house ? '<p class="x-house">' + esc(hl.house) + '</p>' : '') + '</header>';
  /* the itinerary: the day(s) this place is visited and what happens there — the date, never a clock (Owner, 22 Sep 2026) */
  if (vis.length) h += '<section class="x-sec x-visits" data-visits><p class="a-eyebrow">On the itinerary</p><div class="x-kv">' + vis.map(function (v) { return '<div><span class="k">' + esc(D.dateWords({ visits: [v] })) + '</span><span class="v">' + esc(v.what || '') + '</span></div>'; }).join('') + '</div></section>';
  /* THE FILMS WITH SOUND (BARON, 22 Sep 2026): the club's own clips — Play / Pause · Sound on / Mute (assets/clip.js): they start
     muted where the browser insists and with sound where it allows; the guest's tap on SOUND ON is what brings the music */
  if (x.clips && x.clips.length) {
    h += '<section class="x-sec x-films" data-films><p class="a-eyebrow">The night, on film</p><h2>' + esc(x.name) + ' — with the sound on</h2><p class="x-films-note">Three short films from the club.</p><div class="x-films-grid">' + x.clips.map(function (c, i) {
      return '<div class="am a-clip x-film' + (c.w >= c.h ? ' is-square' : ' is-tall') + '" data-clip="' + esc(x.id) + '-' + (i + 1) + '" data-clip-state="paused" data-clip-audio="off" style="background-image:url(' + esc(c.poster) + ')">' +
        '<video class="a-clip-video" playsinline loop preload="metadata" poster="' + esc(c.poster) + '" data-src="' + esc(c.src) + '" aria-label="' + esc(c.alt) + '"></video>' +
        '<div class="a-clip-ctl"><button type="button" class="a-clip-btn" data-clip-play aria-label="Play the film" aria-pressed="false"><i class="ic-play" aria-hidden="true"></i><i class="ic-pause" aria-hidden="true"></i><span class="t">Play</span></button>' +
        '<button type="button" class="a-clip-btn" data-clip-sound aria-label="Sound on" aria-pressed="false"><i class="ic-sound" aria-hidden="true"></i><span class="t">Sound on</span></button></div></div>';
    }).join('') + '</div></section>';
  }
  /* discovery entries: the hosts' own paragraphs where they wrote some */
  if (x.detail && x.detail.length) {
    h += '<section class="x-sec"><p class="a-eyebrow">About</p>' + x.detail.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</section>';
  }
  /* the full record: About, in the hosts' own sections, opened one at a time */
  if (x.sections && x.sections.length) {
    h += '<section class="x-sec"><p class="a-eyebrow">About ' + esc(x.name) + '</p><div class="x-acc">' +
      x.sections.map(function (s, i) {
        return '<div><button type="button" aria-expanded="' + (i === 0 ? 'true' : 'false') + '" aria-controls="xs' + i + '" data-acc="' + i + '">' +
          '<span><span class="k">' + esc(s.k) + '</span><span class="t">' + esc(s.t) + '</span></span><span class="x" aria-hidden="true">+</span></button>' +
          '<div class="in' + (i === 0 ? ' on' : '') + '" id="xs' + i + '">' + s.p.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
          (s.by ? '<p class="by">— ' + esc(s.by) + '</p>' : '') + '</div></div>';
      }).join('') + '</div></section>';
  }
  /* the Highlight's own clip (a same-origin, silent H.264 card clip — the photograph stays the poster) and its menu */
  if (hl && hl.clip) h += '<div class="x-clip"><div class="am" data-clip style="background-image:url(' + esc(x.img) + ')" role="img" aria-label="' + esc(x.name) + '"></div></div>';
  if (hl && hl.menu && hl.menu.length) {
    h += '<section class="x-sec" data-menu><p class="a-eyebrow">The menu</p><h2>' + esc(hl.menuTitle || 'The menu') + '</h2><ul class="x-menu">' + hl.menu.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ul>' +
      (hl.menuNote ? '<p class="x-menunote">' + esc(hl.menuNote) + '</p>' : '') + '</section>';
  }
  /* the Highlight's dress code (Owner, 20 Sep 2026): the dress-code page's own grammar — the label, the register, the words — only
     where the house supplied one; never invented */
  var pr = x.practical || {};
  /* the dress code is printed once (PRQ-07a-09): a house's own dress section where it named one (hl.dressTitle), else the
     Practical row (BARON: When · Dress code · Address) */
  var dressShown = !!(hl && pr.dress && hl.dressTitle);
  if (dressShown) h += '<section class="x-sec x-dress" data-dress><p class="a-eyebrow">Dress code · ' + esc(x.name) + '</p><h2>' + esc(hl.dressTitle || 'The dress code') + '</h2><p>' + esc(pr.dress) + '</p><p class="x-dresslink"><a class="a-link" href="dress.html">The dress codes of the journey</a></p></section>';
  /* practical information — only the fields the source actually carries */
  var ct = hl && hl.contact || null;
  if (pr.price || pr.hours || pr.when || pr.dress || pr.address || x.maps || x.link || ct) {
    h += '<section class="x-sec"><p class="a-eyebrow">Practical information</p><div class="x-kv">' +
      (pr.price ? '<div data-private><span class="k">Price</span><span class="v"><span class="price">' + esc(pr.price) + '</span>' + (pr.priceNote ? '<small>' + esc(pr.priceNote) + '</small>' : '') + '</span></div>' : '') +
      (pr.when ? '<div><span class="k">When</span><span class="v">' + esc(pr.when) + '</span></div>' : '') +
      (pr.hours ? '<div><span class="k">Opening hours</span><span class="v">' + pr.hours.map(esc).join('<br>') + '</span></div>' : '') +
      (pr.dress && !dressShown ? '<div><span class="k">Dress code</span><span class="v">' + esc(pr.dress) + '</span></div>' : '') +
      (pr.address ? '<div><span class="k">Address</span><span class="v">' + pr.address.map(esc).join('<br>') + '</span></div>' : '') +
      (ct ? '<div><span class="k">Contact</span><span class="v x-contact">' + (ct.address ? ct.address.map(esc).join('<br>') + '<br>' : '') + (ct.where ? esc(ct.where) + '<br>' : '') + (ct.phone ? '<a href="tel:' + esc(ct.phone.replace(/[^+\d]/g, '')) + '">' + esc(ct.phone) + '</a><br>' : '') + (ct.email ? '<a href="mailto:' + esc(ct.email) + '">' + esc(ct.email) + '</a>' : '') + '</span></div>' : '') +
      ((x.maps || x.link) ? '<div><span class="k">Where</span><span class="v"><span class="x-links" style="margin-top:0">' +
        (x.maps ? '<a class="a-link" href="' + esc(x.maps) + '" target="_blank" rel="noopener">Map</a>' : '') +
        (x.link ? '<a class="a-link" href="' + esc(x.link) + '" target="_blank" rel="noopener">' + esc(x.linkLabel || 'Website') + '</a>' : '') + '</span></span></div>' : '') +
      '</div></section>';
  }
  /* the Journey action: every selectable place is a Highlight (Window 007, PRQ-07a-03) — one booking grammar, assets/highlight.js */
  var isHighlight = !!(x.select && hl && window.SIYL_HIGHLIGHT);
  if (isHighlight) h += SIYL_HIGHLIGHT.html(x);
  h += '<p class="x-back"><a class="a-link" href="experiences.html#' + esc(x.chapter) + '">All experiences</a></p>';
  root.innerHTML = h;
  /* the Highlight's clip: the same-origin card clip of the data record (assets/experiences.js), mounted by the shared card-video module */
  var clipFrame = root.querySelector('.x-clip [data-clip]'); if (clipFrame && hl && hl.clip) { clipFrame.setAttribute('data-video', hl.clip); if (window.SIYL_AMAN && SIYL_AMAN.video) SIYL_AMAN.video.wire(root); }
  if (window.SIYL_XGAL) document.querySelectorAll('[data-xgal]').forEach(SIYL_XGAL.wire);
  if (window.SIYL_CLIP) SIYL_CLIP.init();   /* the films with sound, once they are in the page */
  document.querySelectorAll('[data-acc]').forEach(function (b) {
    b.addEventListener('click', function () {
      var on = b.getAttribute('aria-expanded') === 'true', box = document.getElementById(b.getAttribute('aria-controls'));
      b.setAttribute('aria-expanded', on ? 'false' : 'true'); box.classList.toggle('on', !on);
    });
  });

  /* the Highlight's state: the Journey Bag is the one truth, the trip's send and Guest Relations' confirmation name its status
   * (PRQ-07a-01) — assets/highlight.js paints it and repaints on every change of the Bag, the session, the draft or the status */
  if (isHighlight) {
    var paintSel = function () { SIYL_HIGHLIGHT.paint(x); };
    paintSel();
    ['siyl:bag', 'siyl:auth', 'siyl:draft', 'siyl:confirm'].forEach(function (ev) { document.addEventListener(ev, paintSel); });
    if (window.SIYL_CONFIRM && SIYL_CONFIRM.load) document.addEventListener('siyl:auth', function () { SIYL_CONFIRM.load(true); });
  }
})();
</script>
