<script>
(function () {
  var D = window.SIYL_DISCOVER;
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  var id = new URLSearchParams(location.search).get('id') || '';
  var x = (window.SIYL_EXP || []).filter(function (e) { return e.id === id; })[0];
  var root = document.getElementById('x');
  if (!x) {
    document.title = 'Experiences · See You In Laos';
    root.innerHTML = '<div class="x-none"><p class="a-eyebrow">Experiences</p><h1>This place is not on the list.</h1>' +
      '<p class="x-lede" style="margin-top:14px">The places we would take you ourselves are all on one page.</p>' +
      '<p style="margin-top:22px"><a class="a-link" href="experiences.html">All experiences</a></p></div>';
    return;
  }
  document.title = x.name + ' · See You In Laos';
  var roles = D.LABEL[D.categoryOf(x)] || '';   /* the category: what the place IS (Owner, 22 Sep 2026) */
  var when = D.dateWords(x), vis = D.visits(x);
  var ctx = [];
  if (x.row && x.row !== 'city' && (x.sheet !== 'FULL' || /^Day /.test(x.row))) ctx.push("From the hosts' itinerary · " + x.row);
  if (x.row === 'city') ctx.push(x.chapter === 'bkk' ? 'From the hosts’ Bangkok days' : 'From the hosts’ Vientiane portrait');   /* Le Du Kaan is a Bangkok address of the city days (release 012) */
  if (x.sheet === 'FULL') ctx.push('From the hosts’ notes on the place');
  var h = '';
  h += '<section class="x-gal">' + (window.SIYL_XGAL ? SIYL_XGAL.html(x) : '') + '</section>';
  var hl = x.highlight || null;
  h += '<header class="x-head"><p class="a-eyebrow">' + esc(x.where) + (roles ? ' · ' + esc(roles) : '') + '</p>' + (when ? '<p class="x-when">' + esc(when) + '</p>' : '') +
       (hl && hl.distinction ? '<p class="x-dist" data-distinction>' + esc(hl.distinction) + '</p>' : '') +
       '<h1>' + esc(x.name) + '</h1>' +
       (hl && hl.line ? '<p class="x-line">' + esc(hl.line) + '</p>' : '') +
       '<p class="x-lede">' + esc(x.intro || x.teaser || '') + '</p>' +
       (hl && hl.house ? '<p class="x-house">' + esc(hl.house) + '</p>' : '') +
       (ctx.length ? '<p class="x-ctx">' + ctx.map(esc).join('<br>') + '</p>' : '') + '</header>';
  /* the itinerary: the day(s) this place is visited and what happens there — the date, never a clock (Owner, 22 Sep 2026) */
  if (vis.length) h += '<section class="x-sec x-visits" data-visits><p class="a-eyebrow">On the itinerary</p><div class="x-kv">' + vis.map(function (v) { return '<div><span class="k">' + esc(D.dateWords({ visits: [v] })) + '</span><span class="v">' + esc(v.what || '') + '</span></div>'; }).join('') + '</div></section>';
  /* THE FILMS WITH SOUND (BARON, 22 Sep 2026): the club's own clips — Play / Pause · Sound on / Mute (assets/clip.js): they start
     muted where the browser insists and with sound where it allows; the guest's tap on SOUND ON is what brings the music */
  if (x.clips && x.clips.length) {
    h += '<section class="x-sec x-films" data-films><p class="a-eyebrow">The night, on film</p><h2>' + esc(x.name) + ' — with the sound on</h2><p class="x-films-note">Three short films from the club. Tap Sound on for the music.</p><div class="x-films-grid">' + x.clips.map(function (c, i) {
      return '<div class="am a-clip x-film' + (c.w >= c.h ? ' is-square' : ' is-tall') + '" data-clip="' + esc(x.id) + '-' + (i + 1) + '" data-clip-state="paused" data-clip-audio="off" style="background-image:url(' + esc(c.poster) + ')">' +
        '<video class="a-clip-video" playsinline loop preload="metadata" poster="' + esc(c.poster) + '" data-src="' + esc(c.src) + '" aria-label="' + esc(c.alt) + '"></video>' +
        '<div class="a-clip-ctl"><button type="button" class="a-clip-btn" data-clip-play aria-label="Play the film" aria-pressed="false"><i class="ic-play" aria-hidden="true"></i><i class="ic-pause" aria-hidden="true"></i><span class="t">Play</span></button>' +
        '<button type="button" class="a-clip-btn" data-clip-sound aria-label="Sound on" aria-pressed="false"><i class="ic-sound" aria-hidden="true"></i><span class="t">Sound on</span></button></div></div>';
    }).join('') + '</div></section>';
  }
  /* discovery entries: the hosts' own paragraphs where they wrote some */
  if (x.detail && x.detail.length) {
    h += '<section class="x-sec"><p class="a-eyebrow">About</p>' + x.detail.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</section>';
  }
  /* the full record: About, in the hosts' own sections, opened one at a time */
  if (x.sections && x.sections.length) {
    h += '<section class="x-sec"><p class="a-eyebrow">About ' + esc(x.name) + '</p><div class="x-acc">' +
      x.sections.map(function (s, i) {
        return '<div><button type="button" aria-expanded="' + (i === 0 ? 'true' : 'false') + '" aria-controls="xs' + i + '" data-acc="' + i + '">' +

          '<div class="in' + (i === 0 ? ' on' : '') + '" id="xs' + i + '">' + s.p.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
          (s.by ? '<p class="by">— ' + esc(s.by) + '</p>' : '') + '</div></div>';
      }).join('') + '</div></section>';
  }
  /* the Highlight's own clip (a same-origin, silent H.264 card clip — the photograph stays the poster) and its menu */
  if (hl && hl.clip) h += '<div class="x-clip"><div class="am" data-clip style="background-image:url(' + esc(x.img) + ')" role="img" aria-label="' + esc(x.name) + '"></div></div>';
  if (hl && hl.menu && hl.menu.length) {
    h += '<section class="x-sec" data-menu><p class="a-eyebrow">The menu</p><h2>' + esc(hl.menuTitle || 'The menu') + '</h2><ul class="x-menu">' + hl.menu.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ul>' +
      (hl.menuNote ? '<p class="x-menunote">' + esc(hl.menuNote) + '</p>' : '') + '</section>';
  }
  /* the Highlight's dress code (Owner, 20 Sep 2026): the dress-code page's own grammar — the label, the register, the words — only

  var pr = x.practical || {};

  /* practical information — only the fields the source actually carries */
  var ct = hl && hl.contact || null;
  if (pr.price || pr.hours || pr.when || pr.dress || pr.address || x.maps || x.link || ct) {
    h += '<section class="x-sec"><p class="a-eyebrow">Practical information</p><div class="x-kv">' +
      (pr.price ? '<div data-private><span class="k">Price</span><span class="v"><span class="price">' + esc(pr.price) + '</span>' + (pr.priceNote ? '<small>' + esc(pr.priceNote) + '</small>' : '') + '</span></div>' : '') +
      (pr.when ? '<div><span class="k">When</span><span class="v">' + esc(pr.when) + '</span></div>' : '') +
      (pr.hours ? '<div><span class="k">Opening hours</span><span class="v">' + pr.hours.map(esc).join('<br>') + '</span></div>' : '') +
      (pr.dress ? '<div><span class="k">Dress code</span><span class="v">' + esc(pr.dress) + '</span></div>' : '') +
      (pr.address ? '<div><span class="k">Address</span><span class="v">' + pr.address.map(esc).join('<br>') + '</span></div>' : '') +
      (ct ? '<div><span class="k">The house</span><span class="v x-contact">' + (ct.address ? ct.address.map(esc).join('<br>') + '<br>' : '') + (ct.where ? esc(ct.where) + '<br>' : '') + (ct.phone ? '<a href="tel:' + esc(ct.phone.replace(/[^+\d]/g, '')) + '">' + esc(ct.phone) + '</a><br>' : '') + (ct.email ? '<a href="mailto:' + esc(ct.email) + '">' + esc(ct.email) + '</a>' : '') + '</span></div>' : '') +
      ((x.maps || x.link) ? '<div><span class="k">Where</span><span class="v"><span class="x-links" style="margin-top:0">' +
        (x.maps ? '<a class="a-link" href="' + esc(x.maps) + '" target="_blank" rel="noopener">Map</a>' : '') +
        (x.link ? '<a class="a-link" href="' + esc(x.link) + '" target="_blank" rel="noopener">Website</a>' : '') + '</span></span></div>' : '') +
      '</div></section>';
  }
  /* the Journey action — one place carries it, by Owner decision: the Afternoon
   * Tea pattern, priced per participating guest by the one calculation source */
  if (x.select && hl && window.SIYL_HIGHLIGHT) {
    h += SIYL_HIGHLIGHT.html(x);
  } else if (x.select) {
    var meal = (x.roles || []).indexOf('dinner') >= 0 ? 'Dinner' : (x.roles || []).indexOf('breakfast') >= 0 ? 'Breakfast' : 'Lunch';
    h += '<section class="x-sel" id="sel"><p class="a-eyebrow">My Bag</p><h2>' + meal + ' at ' + esc(x.name) + (x.practical && x.practical.when ? ' <span class="a-eyebrow" style="display:block;margin-top:6px">' + esc(x.practical.when) + '</span>' : '') + '</h2>' +
      '<p class="price" data-private>USD ' + x.select.price + ' <span class="a-eyebrow" style="display:inline">' + esc(x.select.unit) + '</span></p>' +
      '<p>Optional. Adding ' + esc(x.name) + ' places a restaurant request in your bag for the guests who take part; Guest Relations arrange the table. It is a request, not a reservation — availability is not guaranteed by this page. No date or time to choose here.</p>' +
      '<div id="selbox" data-private></div>' +
      '<p class="x-way" data-private-cta><a class="a-link" data-private-cta href="invitation.html?open=1">Open your invitation</a></p></section>';
  }
  h += '<p class="x-back"><a class="a-link" href="experiences.html#' + esc(x.chapter) + '">All experiences</a></p>';
  root.innerHTML = h;
  /* the Highlight's clip: the same-origin card clip of the data record (assets/experiences.js), mounted by the shared card-video module */
  var clipFrame = root.querySelector('.x-clip [data-clip]'); if (clipFrame && hl && hl.clip) { clipFrame.setAttribute('data-video', hl.clip); if (window.SIYL_AMAN && SIYL_AMAN.video) SIYL_AMAN.video.wire(root); }
  if (window.SIYL_XGAL) document.querySelectorAll('[data-xgal]').forEach(SIYL_XGAL.wire);
  if (window.SIYL_CLIP) SIYL_CLIP.init();   /* the films with sound, once they are in the page */
  document.querySelectorAll('[data-acc]').forEach(function (b) {
    b.addEventListener('click', function () {
      var on = b.getAttribute('aria-expanded') === 'true', box = document.getElementById(b.getAttribute('aria-controls'));
      b.setAttribute('aria-expanded', on ? 'false' : 'true'); box.classList.toggle('on', !on);
    });
  });

  /* selection: the Journey Bag is the one truth — has() decides the state, the
   * invitation gate decides who may add. ONE GUEST = ONE PRICE (Owner, 14 Sep
   * 2026): the request is this guest's own, one price, never multiplied. */
  function money(n) { return 'USD ' + Number(n).toLocaleString('en-US'); }
  function paintSel() {
    if (x.select && hl && window.SIYL_HIGHLIGHT) { SIYL_HIGHLIGHT.paint(x); return; }
    var box = document.getElementById('selbox'); if (!box || !window.SIYL_BAG) return;
    /* the price and the add exist for a signed-in guest only (Owner, 16 Sep 2026): signed out nothing is rendered here */
    if (document.documentElement.getAttribute('data-session') !== 'in') { box.innerHTML = ''; return; }
    var s = x.select, line = SIYL_BAG.get().filter(function (l) { return l.id === s.id; })[0];
    box.innerHTML = '<p class="x-amt" id="selamt">' + money(s.price) + ' <span class="a-eyebrow">per person · your cost</span></p>' + (line
      ? '<div class="x-cur"><span class="on" data-sel-state="current" aria-current="true">Current selection · ' + money(s.price) + '</span>' +
        '<a class="a-link" href="cart.html">Open My Bag</a></div>' +
        '<p style="margin-top:14px"><button type="button" class="a-link" id="sel-rm" style="background:none;border:0;cursor:pointer">Remove from My Bag</button></p>'
      : '<button type="button" class="x-cta" id="sel-add" data-sel-state="open">Add to My Bag · ' + money(s.price) + '</button>');
    var add = document.getElementById('sel-add'), rm = document.getElementById('sel-rm');
    if (add) add.addEventListener('click', function () { gated(function () {
      if (SIYL_BAG.has(s.id)) { paintSel(); return; }
      var it = (window.SIYL_PRICE ? SIYL_PRICE.items(s.id)[0] : null) || { id: s.id, name: x.name, price: s.price, img: x.img };
      it.qty = 1; it.request = true; it.exp = x.id;
      SIYL_BAG.put(it);
      paintSel();
      var cur = document.querySelector('[data-sel-state="current"]'); if (cur) cur.focus();
    }); });
    if (rm) rm.addEventListener('click', function () { SIYL_BAG.remove(s.id); paintSel(); var a2 = document.getElementById('sel-add'); if (a2) a2.focus(); });
  }
  function gated(fn) {
    if (window.SIYL_INVITE) { SIYL_INVITE.require(fn); }
    else document.addEventListener('siyl:invite-ready', function () { SIYL_INVITE.require(fn); }, { once: true });
  }
  paintSel();
  document.addEventListener('siyl:bag', paintSel);
  document.addEventListener('siyl:auth', paintSel);
})();
</script>
