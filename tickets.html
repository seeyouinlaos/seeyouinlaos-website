  <h1 class="t-d1">Your tickets</h1>
  <p class="t-b1 measure" id="tk-lede">Your seat tickets for the wedding day and a travel pass for each journey you have chosen, as they stand today.</p>

<script>
/* ============================================================================
   YOUR TICKETS (Owner, 15 Sep 2026) — TICKET = TICKET. The one surface where
   every ticket of the guest stands together: the seat tickets for the wedding
   day (as the seating ledger holds them) and a travel pass for every transport
   leg in the journey (as the bag holds it, in the state Review & Send says).
   The code and the reference belong here, on the ticket — never in the bag,
   never on Review & Send. Nothing is charged; nothing is a carrier's ticket.
   ========================================================================== */
(function(){
var G=window.SIYL_GUEST,S=window.SIYL_SEATS,PASS=window.SIYL_SEATPASS,TP=window.SIYL_TRAVELPASS,B=window.SIYL_BAG,T=window.SIYL_TEMPLE,page=document.getElementById('page');
if(!G||!PASS||!TP||!B||!page)return;
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function gated(fn){if(window.SIYL_INVITE){SIYL_INVITE.require(fn)}
else document.addEventListener('siyl:invite-ready',function(){SIYL_INVITE.require(fn)},{once:true})}
/* ACCESS (Owner, Edit 3): the tickets are private — without a session the guest goes to the invitation page */
gated(function(){});
function render(){
  var p=G.party(),me=G.me();
  if(!p||!me){
    page.innerHTML='<div class="p-card">'+(G.stale()?'':'<p class="t-l1">Your invitation</p>')+'<h2 class="t-h1">'+(G.stale()?'Open your invitation once more':'Open your invitation')+'</h2>'+
      '<p class="t-b1 measure">'+(G.stale()?'Every guest now has their own invitation code. Please enter yours — everything you chose before is still here.':'Your tickets belong to your invitation, so we open your invitation first.')+'</p>'+
      '<p style="margin-top:16px"><button type="button" class="p-act" id="open">Open your invitation</button></p></div>';
    document.getElementById('open').addEventListener('click',function(){gated(render)});return}
  document.getElementById('tk-own').textContent='Your tickets · '+G.nameOf();
  var id=me.guestId,names={fullName:G.value(id,'fullName')||G.nameOf(id),preferredName:G.nameOf(id)},h='';
  /* WHERE WILL YOU JOIN US (Owner, 18 Sep 2026): tickets follow the answer — none for a trip or a destination the guest is not joining */
  var J=window.SIYL_JOURNEY,scoped=!!(G.scopeAnswered&&G.scopeAnswered()),vte=!scoped||G.joins('vientianeWedding');
  if(scoped&&G.notJoining()){
    page.innerHTML='<div class="p-card flat"><p class="t-l1">Not joining this trip</p><h2 class="t-h1">No tickets</h2><p class="t-b2 measure">You told us you cannot join us this time, so there are no tickets or passes. If your plans change, simply tick the parts you can join in My Trip and send us the update.</p><div class="p-actions"><a class="p-link" href="your-journey.html#scope">Change where you join us</a></div></div>';B.badge();return}
  /* the wedding day: one seat ticket per event the ledger holds for this guest — only while Vientiane is part of the trip */
  var seats='';
  if(S&&S.ready()&&vte){['ceremony','dinner'].forEach(function(ev){var doc=PASS.docFor(p,id,S.mine(),[ev],null,names);if(doc)seats+=PASS.card(doc,{actions:'<button type="button" class="p-link" data-seat-pass="'+ev+'" data-seat-pass-for="'+esc(id)+'">Download this ticket</button>'})})}
  /* THE SEAT CONTROLS FOLLOW THE SEATING STATE (PRQ-04-13): a link to choose or change only while seating is open; not open
     yet → no link; closed → the way to Guest Relations */
  var ready=!!(S&&S.ready()),closed=ready&&S.frozen(),open=ready&&S.open()&&!S.frozen();
  var grLink='<a class="p-link" href="mailto:guest.relation.seeyouinlaos@gmail.com?subject='+encodeURIComponent('My trip — '+G.nameOf())+'">write to Guest Relations</a>';
  var closedWords='To change a seat, please '+grLink+'.';
  h+='<section class="prep-sec"><p class="t-l1">The wedding · Sunday, 28 February 2027</p><h2 class="t-h2">Seat tickets</h2>';
  if(seats)h+='<div class="p-tickets">'+seats+'</div><div class="p-actions" style="margin-top:var(--s4)"><button type="button" class="p-act quiet" data-seat-pass="all" data-seat-pass-for="'+esc(id)+'">Download seat tickets</button>'+(open?'<a class="p-link mute" href="wedding-preparation.html#seats">Change a seat</a>':'')+'</div>'+(closed?'<p class="t-b2 measure-w" style="margin-top:var(--s3)">'+closedWords+'</p>':'');
  else if(!vte)h+='<div class="p-card flat"><p class="t-b1 measure">You are not joining us for the wedding in Vientiane, so there are no seat tickets.</p></div>';
  else if(!ready)h+='<div class="p-card flat"><p class="t-b1 measure">Loading your seats…</p></div>';
  else if(open)h+='<div class="p-card flat"><p class="t-b1 measure">No seat chosen yet. Your seat tickets appear here as soon as you choose your seats.</p><div class="p-actions"><a class="p-link" href="wedding-preparation.html#seats">Choose your seats</a></div></div>';
  else if(closed)h+='<div class="p-card flat"><p class="t-b1 measure">No seat chosen yet. '+closedWords+'</p></div>';
  else h+='<div class="p-card flat"><p class="t-b1 measure">Seating is not open yet. Your seat tickets appear here once you have chosen your seats.</p></div>';
  h+='</section>';
  /* the journey: a travel pass for every leg in the bag */
  var legs=TP.ORDER.filter(function(l){return B.get().some(function(x){return x.id===l&&(!J||!scoped||J.lineRelevant(x))})}),passes='';
  legs.forEach(function(l){var line=B.get().filter(function(x){return x.id===l})[0];passes+=TP.card(l,{selected:true,price:B.money(line.price)+' <span class="t-l1">per person</span>',actions:TP.button(l,true)+'<a class="p-link mute" href="your-journey.html#s-'+l+'">Change</a>'})});
  h+='<section class="prep-sec"><p class="t-l1">Your trip · 21 February – 8 March 2027</p><h2 class="t-h2">Travel passes</h2>';
  if(passes)h+='<div class="p-tickets">'+passes+'</div>';
  else h+='<div class="p-card flat"><p class="t-b1 measure">No travel is in your trip yet. A travel pass appears here for each journey you choose.</p><div class="p-actions"><a class="p-link" href="your-journey.html">Open My Trip</a></div></div>';
  h+='<p class="t-b2 measure-w" style="margin-top:var(--s4)">A seat ticket shows the seat held for you today. Nothing is paid on this website.</p></section>';
  page.innerHTML=h;
  TP.wire(page);
  page.querySelectorAll('[data-seat-pass]').forEach(function(b){b.addEventListener('click',function(){
    if(b.getAttribute('aria-disabled')==='true')return;var ev=b.getAttribute('data-seat-pass');b.setAttribute('aria-disabled','true');var was=b.textContent;b.textContent='Preparing…';
    PASS.deliver(ev==='all'?['ceremony','dinner']:[ev],b.getAttribute('data-seat-pass-for')).then(function(r){b.removeAttribute('aria-disabled');b.textContent=r&&r.ok?'Downloaded — download again':(r&&r.error==='no seat'?'No seat chosen yet':was)})})});
  B.badge();
}
document.addEventListener('siyl:bag',render);
document.addEventListener('siyl:guest',render);
document.addEventListener('siyl:seats',render);
document.addEventListener('siyl:auth',function(){render();if(S)S.load(true);if(window.SIYL_CONFIRM)SIYL_CONFIRM.load(true)});
document.addEventListener('siyl:invite-ready',render);
document.addEventListener('siyl:confirm',render);
render();
if(S&&G.party())S.load();
if(window.SIYL_CONFIRM&&G.party())SIYL_CONFIRM.load();
if(B.bar)B.bar();
})();
</script>
</body></html>
