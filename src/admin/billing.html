<!-- /admin/billing — the H&S admin console (Owner, 7 Oct 2026). The page itself carries no data: everything comes from
     /api/billing/… with the BILLING_ADMIN's own bearer; a guest gets 403 there and sees only that this page is not theirs. -->
<base href="/">
<style>
@font-face{font-family:'PP Editorial Old';src:url('assets/fonts/PPEditorialOld-Ultralight.otf') format('opentype');font-weight:200;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3EEE7;color:#313131;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;font-weight:300;font-size:14px;line-height:1.6}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid #DAD9D7;background:#F3EEE7}
.bd{font-family:'PP Editorial Old',serif;font-weight:200;font-size:19px;color:#313131;text-decoration:none}.bd .dot{color:#8A5A55}
.hd .ab-title{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:#6B6964}
.ab-main{max-width:1280px;margin:0 auto;padding:24px 20px 64px}
.ab-main>h1{font-family:'PP Editorial Old',serif;font-weight:200;font-size:32px;line-height:1.12;margin-bottom:4px}
.ab-main>.ab-sub{color:#6B6964;margin-bottom:20px}
/* the operating grammar: dense, legible, every state named in words */
.ab-tabs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;margin:0 0 20px;border-bottom:1px solid #DAD9D7}
.ab-tabs a{display:inline-block;padding:12px 0;min-height:44px;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:#6B6964;text-decoration:none;border-bottom:2px solid transparent}
.ab-tabs a.on{color:#313131;border-bottom-color:#313131}
.ab-gate,.ab-who{font-size:12px;color:#6B6964}.ab-gate{margin-left:auto}.ab-gate.on{color:#2F5D3A}.ab-gate.open{color:#74070E}
.ab-tools{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;margin-bottom:12px}
.ab-search{display:flex;flex-direction:column;gap:2px;min-width:220px;flex:0 1 280px}
.ab-search input{border:1px solid #DAD9D7;background:#fff;padding:10px 12px;min-height:44px;font:inherit;font-size:15px;color:#313131}
.ab-search input:focus{outline:0;border-color:#313131}
.ab-filters{display:flex;flex-wrap:wrap;gap:8px}
.ab-filter{border:1px solid #DAD9D7;background:#FCFAF6;color:#313131;font:inherit;font-size:12.5px;padding:8px 12px;min-height:40px;cursor:pointer}
.ab-filter.on{background:#313131;color:#F3EEE7;border-color:#313131}
.ab-filter .ab-n{opacity:.7;margin-left:4px}
.ab-progress{margin:8px 0 12px;color:#6B6964}
.ab-table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #DAD9D7;background:#FCFAF6}
.ab-table{width:100%;border-collapse:collapse;font-size:13px}
.ab-table th{position:sticky;top:0;background:#F7F3EC;text-align:left;font-weight:400;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#6B6964;padding:10px 12px;border-bottom:1px solid #DAD9D7;white-space:nowrap}
.ab-table td{padding:10px 12px;border-bottom:1px solid #EDEBE7;vertical-align:top}
.ab-table .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ab-table tbody tr[data-ab-open]{cursor:pointer}
.ab-table tbody tr[data-ab-open]:hover,.ab-table tbody tr[data-ab-open]:focus{background:#F3EEE7;outline:0}
.ab-name{display:block;color:#313131;font-weight:400}
.ab-table td[data-l="Guest"]{min-width:170px}.ab-table td[data-l="Issued"],.ab-table td[data-l="Due"],.ab-table td[data-l="Reported"]{white-space:nowrap}.ab-id{display:block;font-size:11.5px;color:#6B6964}
.ab-mute{color:#6B6964}
.ab-chip{display:inline-block;font-size:11px;line-height:1.4;padding:2px 8px;border:1px solid #DAD9D7;background:#fff;color:#313131;white-space:normal}
.ab-chip.on{border-color:#2F5D3A;color:#2F5D3A}.ab-chip.open{border-color:#74070E;color:#74070E}
.ab-empty,.ab-foot{margin-top:12px}.ab-foot{color:#6B6964;font-size:12.5px}
/* one guest */
.ab-guest .ab-h{margin:4px 0 12px}
.ab-back{color:#313131;text-decoration:none;display:inline-block;padding:10px 0;min-height:44px}
.ab-grid2{display:grid;grid-template-columns:1fr;gap:4px 24px;margin:8px 0 12px}
@media(min-width:760px){.ab-grid2{grid-template-columns:1fr 1fr}}
.ab-kv .t-l1{display:inline-block;min-width:12em}
.ab-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.ab-act{display:flex;flex-direction:column;gap:4px;flex:1 1 160px;max-width:240px}
/* the shared action button keeps a 280 px minimum from 600 px up — in a row of five it must fit its own slot */
.ab-act .p-act{width:100%;min-width:0}
.p-act.ab-ghost:hover:not([disabled]){background:#313131;color:#F3EEE7}
.p-act[disabled]:hover{background:inherit}.p-act.ab-ghost[disabled]:hover{background:#FCFAF6}
.p-act.ab-ghost{background:#FCFAF6;color:#313131;border:1px solid #313131}
.p-act[disabled]{opacity:.38;cursor:not-allowed}
.ab-why{font-size:12px;color:#6B6964;line-height:1.4}
.ab-msg{margin-top:14px;color:#313131}
.ab-err{color:#74070E;margin-top:10px}
.ab-ok{color:#2F5D3A;margin-top:12px}
.ab-panel{margin-top:16px}
.ab-panel>.t-h1{margin:4px 0 8px}
.ab-confirm{border-color:#313131}
.ab-reasons{margin:6px 0 0 18px}.ab-revs{margin:6px 0 0 18px}
.ab-lines{margin-top:12px}
.ab-confirm-inline{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.ab-table td[data-l="Action"] .p-link{margin-right:14px}
.ab-confirm-inline input{border:1px solid #DAD9D7;padding:6px 8px;font:inherit;min-width:180px}
.ab-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ab-kpi .t-h1{margin:4px 0}
/* the shared stacking margin between cards (.p-card + .p-card) is for a column; in the figures' grid every card starts level */
.ab-kpis>.p-card+.p-card{margin-top:0}
.ab-gatekeep{max-width:560px;margin:40px auto}
/* phones: every table row becomes a card, each cell named */
@media(max-width:759px){
  .ab-main{padding:16px 16px 56px}
  .ab-main>h1{font-size:26px}
  .ab-table-wrap{border:0;background:none;overflow:visible}
  .ab-table thead{display:none}
  .ab-table,.ab-table tbody,.ab-table tr,.ab-table td{display:block;width:100%}
  .ab-table tr{background:#FCFAF6;border:1px solid #DAD9D7;margin-bottom:10px;padding:6px 0}
  .ab-table td{border:0;padding:4px 14px;text-align:right;overflow:hidden;min-width:0;white-space:normal}
  .ab-table td::before{content:attr(data-l);float:left;margin-right:12px;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#6B6964;text-align:left;padding-top:3px}
  .ab-table td[data-l="Guest"]{text-align:left;padding-top:8px}.ab-table td[data-l="Guest"]::before{content:none}
  .ab-table .num{text-align:right}
  .ab-act{max-width:none;flex:1 1 100%}
  .ab-kv .t-l1{min-width:0;display:block}
  .ab-gate{margin-left:0}
}
</style>
