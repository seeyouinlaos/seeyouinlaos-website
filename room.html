<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Rooms · See You In Laos</title><style>
@font-face{font-family:'PP Editorial Old';src:url('assets/fonts/PPEditorialOld-Ultralight.otf') format('opentype');font-weight:200;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3EEE7;color:#313131;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;font-weight:300;font-size:14px;line-height:1.6}
.hd{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 20px 14px}
.hb{width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:5px;background:none;border:0;cursor:pointer}.hb i{display:block;width:20px;height:1.4px;background:#313131}
.bd{font-family:'PP Editorial Old',serif;font-weight:200;font-size:19px;text-align:center}.bd .dot{color:#8A5A55}
.bag{width:44px;height:44px;display:flex;align-items:center;justify-content:center;position:relative;color:#313131;text-decoration:none}.bag .bgi{display:block}
.bb{position:absolute;top:1px;right:0;min-width:14px;height:14px;padding:0 3px;background:#313131;color:#F3EEE7;font-size:8.5px;line-height:1;letter-spacing:0;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px #F3EEE7;border-radius:1px}
main{padding:0 0 70px;max-width:640px;margin:0 auto}
.wrap{padding:0 24px}
.ph{background:#E7E3DB center/cover no-repeat}
.gal{position:relative}
.trk{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.trk::-webkit-scrollbar{display:none}
.gal .ph{flex:0 0 100%;width:100%;aspect-ratio:4/3;scroll-snap-align:start;scroll-snap-stop:always}
.gc{position:absolute;right:12px;bottom:12px;background:rgba(49,49,49,.55);color:#F3EEE7;font-size:10px;letter-spacing:1.6px;padding:4px 9px;z-index:2}
.gl{position:absolute;left:12px;bottom:12px;right:110px;color:#F3EEE7;font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.5);z-index:2}
.gn{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;font-size:24px;color:#F3EEE7;text-shadow:0 1px 6px rgba(0,0,0,.5);width:44px;height:44px;cursor:pointer;z-index:2}
.gp{left:0}.gx{right:0}
.pend{width:100%;aspect-ratio:4/3;background:#E7E3DB;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#7C7A75}
.intro{text-align:center;padding:38px 24px 6px}
.eyebrow{font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:#7C7A75;margin-bottom:12px}
h1{font-family:'PP Editorial Old',serif;font-weight:200;font-size:29px;line-height:1.25;margin-bottom:14px}
.body{font-size:13.5px;line-height:1.8;color:#4A4A4A;max-width:30em;margin:0 auto 8px}
h2{font-family:'PP Editorial Old',serif;font-weight:200;font-size:22px;margin:44px 0 14px}
.facts{border-top:1px solid #DAD9D7}
.frow{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid #DAD9D7;padding:13px 2px}
.frow .fl{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#7C7A75;padding-top:2px;flex:0 0 auto}
.frow .fv{text-align:right;font-size:13px}
.plane{background:#FFFFFF;margin-top:48px;padding:44px 32px 40px}
.plane h2{margin:0 0 26px;text-align:center}
.amen{list-style:none;margin:0;padding:0 0 0 6px}
.amen li{position:relative;padding:0 0 0 30px;margin:0 0 20px;font-size:14px;line-height:1.7;color:#313131}
.amen li::before{content:'';position:absolute;left:6px;top:.62em;width:6px;height:6px;border-radius:50%;background:#313131}
.inc{border-top:1px solid #DAD9D7}
.inc p{border-bottom:1px solid #DAD9D7;padding:13px 2px;font-size:12.5px;color:#4A4A4A;line-height:1.7}
.ed{margin-top:46px}
.ed .ph{width:100%;aspect-ratio:4/3}
.ed .cap{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:#7C7A75;margin:10px 24px 0}
.ed .body{margin-top:16px}
.others{margin-top:56px;padding-bottom:8px}
.others h2{margin:0 24px 22px}
.oc{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:24px;padding:2px 24px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.oc::-webkit-scrollbar{display:none}
.occard{flex:0 0 80%;scroll-snap-align:start;text-decoration:none;color:#313131;background:#FAF7F2;display:block}
.occard .ph{width:100%;aspect-ratio:4/5}
.occard .ot{padding:22px 20px 26px;text-align:center}
.occard .oe{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#7C7A75}
.occard .on{font-family:'PP Editorial Old',serif;font-weight:200;font-size:21px;line-height:1.25;margin:6px 0 10px}
.occard .od{font-size:12.5px;line-height:1.7;color:#4A4A4A;margin:0 0 12px}
.occard .op{font-family:'PP Editorial Old',serif;font-size:14px}
.occard .rsv{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:#7C7A75;display:block;margin-top:4px}
.rnav{display:flex;align-items:center;gap:6px;padding:16px 24px 0}
.rail{position:relative;flex:1;height:1px;background:#DAD9D7;margin-right:14px}
.rail i{position:absolute;left:0;top:-1px;height:3px;background:#313131;width:40%;transition:transform .12s linear}
.rnav .rc{font-family:'PP Editorial Old',serif;font-size:13px;letter-spacing:1px;margin-right:2px}
.rnav button{background:none;border:0;width:36px;height:36px;font-size:20px;color:#313131;cursor:pointer;padding:0}
.buy{background:#FCFAF6;margin-top:52px;padding:34px 26px 38px}
.buy h2{margin:0 0 4px;font-size:24px}
.buy .win{border-top:1px solid #DAD9D7;padding:18px 0 22px;margin-top:16px}
.buy .win:first-of-type{margin-top:20px}
.buy .wl{font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:#7C7A75}
.buy .wd{font-family:'PP Editorial Old',serif;font-weight:200;font-size:17px;margin:5px 0 1px}
.buy .wn{font-size:11px;color:#7C7A75;margin-bottom:10px}
.buy .price{font-family:'PP Editorial Old',serif;font-size:16px}
.buy .per{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#7C7A75;margin:2px 0 16px}
.cta{display:block;width:100%;background:#313131;color:#F3EEE7;border:0;padding:19px;font-size:11px;letter-spacing:2.2px;text-transform:uppercase;cursor:pointer;min-height:52px;text-align:center;text-decoration:none;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif}
.ok{display:block;text-align:center;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#7C7A75;margin-top:12px}
.ok[hidden]{display:none !important}
.ok a{color:#313131}
.cta.sel{background:#FCFAF6;color:#313131;border:1px solid #313131}
.chg{display:block;width:100%;background:none;border:0;border-bottom:1px solid #313131;font:inherit;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#313131;padding:12px 0 4px;margin:14px auto 0;cursor:pointer;min-height:44px;width:auto}
.enq{font-size:11.5px;color:#7C7A75;line-height:1.7;border:1px solid #DAD9D7;padding:16px;text-align:center}
.swap{font-size:11px;color:#7C7A75;margin-top:10px;line-height:1.6}
.rsvline{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#7C7A75;border:1px solid #DAD9D7;padding:17px;text-align:center}
.note{font-size:11px;color:#7C7A75;margin-top:16px;line-height:1.7}
.backrow{text-align:center;margin-top:34px}
.backrow a{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:#313131;text-decoration:none;border-bottom:1px solid #313131;padding:8px 0 3px;display:inline-block;min-height:44px}
</style><link rel="stylesheet" href="assets/desktop.css"></head><body>
<header class="hd"><button class="hb" aria-label="Menu"><i></i><i></i><i></i></button><div class="bd">see you in laos<span class="dot">.</span></div><a class="bag" href="your-journey.html" aria-label="Your Journey"><svg class="bgi" viewBox="0 0 26 26" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5.1 10.1h15.8a.9.9 0 0 1 .9 1l-.95 10.6a1.6 1.6 0 0 1-1.6 1.45H6.75a1.6 1.6 0 0 1-1.6-1.45L4.2 11.1a.9.9 0 0 1 .9-1z"/><path d="M8 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M13.4 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M5.6 14.2h14.8"/><path d="M12.2 13.2h1.6a.5.5 0 0 1 .5.5v1.6a.5.5 0 0 1-.5.5h-1.6a.5.5 0 0 1-.5-.5v-1.6a.5.5 0 0 1 .5-.5z"/></svg><span class="bb" data-bag-badge></span></a></header>
<main id="m"></main>
<script src="assets/bag.js"></script>
<script src="assets/shop-menu.js"></script>
<script src="assets/rooms-data.js"></script>
<script src="assets/journey.js"></script>
<script type="module" src="assets/invite.mjs"></script>
<script>
(function () {
'use strict';
var q = new URLSearchParams(location.search);
var stayKey = q.get('stay'), roomSlug = q.get('room');
var stay = window.SIYL_ROOMS[stayKey];
if (!stay) { location.replace('journeys.html'); return; }
var room = null;
stay.rooms.forEach(function (r) { if (r.slug === roomSlug) room = r; });
if (!room) room = stay.rooms[0];
document.title = room.name + ' · ' + stay.name + ' · See You In Laos';

function esc(s) { return String(s).replace(/</g, '&lt;'); }
function priceLine(r) {
  if (r.price == null) return '<span class="rsv">' + esc(r.status || '') + '</span>';
  return '<span class="op">USD ' + r.price + '</span> <span class="oe">per person</span>';
}

var h = '';
/* ---- room hero + real gallery (same concrete room, counter 1/N) ---- */
if (room.gallery.length) {
  h += '<div class="gal" id="gal"><div class="trk" id="trk">';
  room.gallery.forEach(function (g, i) {
    h += '<div class="ph" style="background-image:url(' + g[0] + ')" role="img" aria-label="' + esc(room.name) + ' — ' + esc(g[1]) + '"></div>';
  });
  h += '</div>';
  if (room.gallery.length > 1) h += '<button class="gn gp" aria-label="Previous image">‹</button><button class="gn gx" aria-label="Next image">›</button>';
  h += '<span class="gl" id="gl">' + esc(room.gallery[0][1]) + '</span>';
  h += '<span class="gc" id="gc">1 / ' + room.gallery.length + '</span></div>';
} else {
  h += '<div class="pend">Photography to follow</div>';
}
h += '<section class="intro"><p class="eyebrow">' + esc(room.cat) + ' · ' + esc(stay.name) + '</p>';
h += '<h1>' + esc(room.name) + '</h1>';
h += '<p class="body">' + esc(room.desc) + '</p>';
if (room.galleryNote) h += '<p class="eyebrow" style="margin-top:10px">' + esc(room.galleryNote) + '</p>';
h += '</section>';

/* ---- amenities: only facts from register/data.mjs ---- */
h += '<div class="wrap">';
if (room.facts.length) {
  h += '<h2>The Room</h2><div class="facts">';
  room.facts.forEach(function (f) { h += '<div class="frow"><span class="fl">' + esc(f[0]) + '</span><span class="fv">' + esc(f[1]) + '</span></div>'; });
  h += '</div>';
}
if (room.roomPhotoPending) h += '<p class="note" style="margin-top:10px">Room photography to follow.</p>';
h += '</div>';
/* ---- amenities: Aman plane — single vertical bullet list on the light surface ---- */
if (room.amenities && room.amenities.length) {
  h += '<section class="plane"><h2>Amenities</h2><ul class="amen">';
  room.amenities.forEach(function (a) { h += '<li>' + esc(a) + '</li>'; });
  h += '</ul></section>';
}
/* ---- all stays include (separate from room amenities, proven only) ---- */
if (stay.includes && stay.includes.length) {
  h += '<div class="wrap"><h2>Your stay includes</h2><div class="inc">';
  stay.includes.forEach(function (t) { h += '<p>' + t + '</p>'; });
  h += '</div></div>';
}

/* ---- editorial detail (real copy from data.mjs only) ---- */
if (stayKey === 'souphattra') {
  h += '<section class="ed"><div class="ph" style="background-image:url(assets/images/souphattra/heritage-courtyard-pool.jpg)" role="img" aria-label="Souphattra Heritage Vientiane — the courtyard and pool"></div>';
  h += '<p class="cap">Souphattra Heritage Vientiane</p>';
  h += '<p class="body wrap" style="display:block;text-align:center">Souphattra Heritage Vientiane sits at the heart of our wedding stay: shared mornings, shared arrivals, and the rhythm of the weekend centred around one quiet place. Choose the stay that feels right for you.</p></section>';
} else if (room.gallery.length > 3) {
  var edImg = room.gallery[room.gallery.length - 1];
  h += '<section class="ed"><div class="ph" style="background-image:url(' + edImg[0] + ')" role="img" aria-label="' + esc(room.name) + ' — ' + esc(edImg[1]) + '"></div>';
  h += '<p class="cap">' + esc(edImg[1]) + '</p></section>';
}

/* ---- other rooms of the same stay: swipeable carousel with peek ---- */
var others = stay.rooms.filter(function (r) { return r.slug !== room.slug; });
if (others.length) {
  h += '<section class="others"><h2>Other rooms at ' + esc(stay.name) + '</h2><div class="oc" id="oc">';
  others.forEach(function (r) {
    var img = r.gallery.length ? '<div class="ph" style="background-image:url(' + r.gallery[0][0] + ')"></div>' : '<div class="ph" style="display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#7C7A75">Photography to follow</div>';
    h += '<a class="occard" href="room.html?stay=' + stayKey + '&room=' + r.slug + '">' + img +
      '<div class="ot"><p class="oe">' + esc(r.cat) + '</p><p class="on">' + esc(r.name) + '</p>' +
      '<p class="od">' + esc(r.desc) + '</p>' +
      '<p>' + (r.reserved ? '<span class="op">USD ' + r.price + '</span> <span class="rsv">' + esc(r.reserved) + '</span>' : priceLine(r)) + '</p></div></a>';
  });
  h += '</div>';
  if (others.length > 1) h += '<div class="rnav"><div class="rail" aria-hidden="true"><i id="rail"></i></div><span class="rc" id="rc">1 / ' + others.length + '</span><button type="button" id="op" aria-label="Previous room">‹</button><button type="button" id="ox" aria-label="Next room">›</button></div>';
  h += '</section>';
}

/* ---- commerce: fixed-window per-person amounts → Add to Your Journey ---- */
h += '<section class="buy"><p class="eyebrow" style="margin:0 0 8px">Accommodation</p><h2>' + esc(room.name) + '</h2><p class="eyebrow" style="margin:0">' + esc(stay.place) + '</p>';
stay.windows.forEach(function (w, wi) {
  h += '<div class="win"><p class="wl">' + esc(w.label) + '</p><p class="wd">' + esc(w.dates) + '</p><p class="wn">' + esc(w.nights) + '</p>';
  if (room.enquire) {
    /* real inventory without an Owner-approved guest amount — never an invented price */
    h += '<p class="price">' + esc(room.status) + '</p><p class="per">Guest Relations confirms the amount</p>';
    h += '<p class="enq">This room is part of the house but not yet released with an amount. Guest Relations will confirm it for you.</p>';
  } else if (room.reserved) {
    h += '<p class="price">' + (room.price == null ? esc(room.status || '') : 'USD ' + room.price) + '</p><p class="per">Per person · fixed window</p>';
    h += '<p class="rsvline">' + esc(room.reserved) + '</p>';
  } else if (room.interest) {
    h += '<p class="price">' + esc(room.status) + '</p><p class="per">Guest Relations arranges the rest</p>';
    h += '<button class="cta" data-win="' + wi + '">Add to Your Journey</button><span class="swap" data-swap="' + wi + '" hidden></span>';
  } else {
    h += '<p class="price">USD ' + room.price + '</p><p class="per">' + esc(basisFor(w)) + '</p>';
    h += '<button class="cta" data-win="' + wi + '">Add to Your Journey</button><span class="swap" data-swap="' + wi + '" hidden></span>';
    h += '<button type="button" class="chg" data-chg="' + wi + '" hidden>Change selection</button>';
  }
  h += '</div>';
});
h += '<p class="note">Per-person amount for the fixed window — never per night. Nothing is paid on this website.</p></section>';
h += '<p class="backrow"><a href="journeys.html#j-' + stay.windows[0].id + '">Back to Journeys</a></p>';

document.getElementById('m').innerHTML = h;
if (window.SIYL_BAG) SIYL_BAG.badge();

/* gallery: a native scroll-snap track — the image follows the finger; arrows,
 * keys, caption and 1/N all read the real scroll position */
var trk = document.getElementById('trk');
if (trk && room.gallery.length > 1) {
  var gc = document.getElementById('gc'), gl = document.getElementById('gl'), gi = 0, raf = 0;
  function idx() { return Math.max(0, Math.min(room.gallery.length - 1, Math.round(trk.scrollLeft / trk.clientWidth))); }
  function sync() { raf = 0; var i = idx(); if (i === gi) return; gi = i; gc.textContent = (gi + 1) + ' / ' + room.gallery.length; gl.textContent = room.gallery[gi][1]; }
  trk.addEventListener('scroll', function () { if (!raf) raf = requestAnimationFrame(sync); }, { passive: true });
  function go(d) { var i = (idx() + d + room.gallery.length) % room.gallery.length; trk.scrollTo({ left: i * trk.clientWidth, behavior: 'smooth' }); }
  document.querySelector('.gp').addEventListener('click', function () { go(-1); });
  document.querySelector('.gx').addEventListener('click', function () { go(1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight') go(1);
  });
}

/* other rooms: the whole card (image + title + description) is the slide; the
 * thin rail and the counter follow the real horizontal scroll position */
var oc = document.getElementById('oc'), rail = document.getElementById('rail');
if (oc && rail) {
  var rc = document.getElementById('rc'), cards = oc.querySelectorAll('.occard'), oraf = 0;
  function step() { var c = cards[0]; return c.offsetWidth + 14; }
  function railSync() {
    oraf = 0;
    var max = oc.scrollWidth - oc.clientWidth, p = max > 0 ? oc.scrollLeft / max : 0;
    var frac = Math.min(1, oc.clientWidth / oc.scrollWidth), track = rail.parentNode.clientWidth;
    rail.style.width = Math.round(frac * track) + 'px';
    rail.style.transform = 'translateX(' + Math.round(p * (track - frac * track)) + 'px)';
    rc.textContent = (Math.min(cards.length, Math.round(oc.scrollLeft / step()) + 1)) + ' / ' + cards.length;
  }
  oc.addEventListener('scroll', function () { if (!oraf) oraf = requestAnimationFrame(railSync); }, { passive: true });
  window.addEventListener('resize', railSync);
  document.getElementById('op').addEventListener('click', function () { oc.scrollBy({ left: -step(), behavior: 'smooth' }); });
  document.getElementById('ox').addEventListener('click', function () { oc.scrollBy({ left: step(), behavior: 'smooth' }); });
  railSync();
}

/* adds are invitation-gated — identical mechanism to journeys.html */
function gated(fn) {
  if (window.SIYL_INVITE) SIYL_INVITE.require(fn);
  else document.addEventListener('siyl:invite-ready', function () { SIYL_INVITE.require(fn); }, { once: true });
}
function basisFor(w) {
  var b = window.SIYL_JOURNEY && SIYL_JOURNEY.BASIS[w.id];
  return b ? b.basis : 'Per person · fixed window';
}
function itemFor(w) {
  var img = room.gallery.length ? room.gallery[0][0] : w.bagImg;
  if (room.interest) return { id: w.id, name: w.bagName, meta: w.dates + ' · ' + (room.status || ''), interest: true, img: img };
  return { id: w.id, name: w.bagName, meta: w.dates + ' · ' + room.name, price: room.price, img: img };
}
/* the product surface reads and writes the same bag state as Your Journey */
function mine(w) {
  var line = SIYL_BAG.get().filter(function (x) { return x.id === w.id; })[0];
  return line && line.meta && line.meta.indexOf(room.name) >= 0 ? line : null;
}
function held(w) {
  return SIYL_BAG.get().filter(function (x) { return x.id === w.id; })[0] || null;
}
function paint() {
  document.querySelectorAll('[data-win]').forEach(function (b) {
    var wi = parseInt(b.getAttribute('data-win'), 10), w = stay.windows[wi];
    var swap = document.querySelector('[data-swap="' + wi + '"]');
    var chg = document.querySelector('[data-chg="' + wi + '"]');
    var line = mine(w), other = held(w);
    if (line) {
      b.textContent = 'Remove from Your Journey';
      b.classList.add('sel');
      if (swap) { swap.hidden = true; }
      if (chg) chg.hidden = false;
    } else {
      b.textContent = 'Add to Your Journey';
      b.classList.remove('sel');
      if (chg) chg.hidden = true;
      if (swap) {
        if (other) { swap.hidden = false; swap.textContent = 'Your journey currently holds ' + String(other.meta).split(' · ').pop() + ' for this stay — adding this room replaces it.'; }
        else swap.hidden = true;
      }
    }
  });
}
document.querySelectorAll('[data-win]').forEach(function (b) {
  b.addEventListener('click', function () {
    var w = stay.windows[parseInt(b.getAttribute('data-win'), 10)];
    if (mine(w)) { SIYL_BAG.remove(w.id); paint(); return; }
    gated(function () { SIYL_BAG.put(itemFor(w)); paint(); });
  });
});
document.querySelectorAll('[data-chg]').forEach(function (b) {
  b.addEventListener('click', function () {
    /* the collection this room belongs to, with the current choice visible */
    var w = stay.windows[parseInt(b.getAttribute('data-chg'), 10)];
    location.href = 'journeys.html#j-' + w.id;
  });
});
document.addEventListener('siyl:bag', paint);
paint();
if (window.SIYL_BAG.bar) SIYL_BAG.bar();
})();
</script>

<script>
if (new URLSearchParams(location.search).get('debug')) {
  window.addEventListener('load', function () {
    setTimeout(function () {
      var out = ['innerW=' + innerWidth, 'docW=' + document.documentElement.scrollWidth, 'clientW=' + document.documentElement.clientWidth];
      document.querySelectorAll('body *').forEach(function (el) {
        var r = el.getBoundingClientRect();
        if (r.right > document.documentElement.clientWidth + 1 && !el.closest('.oc')) {
          out.push(el.tagName + '.' + String(el.className).slice(0, 30) + ' w=' + Math.round(r.width) + ' r=' + Math.round(r.right));
        }
      });
      var d = document.createElement('pre'); d.id = 'dbg'; d.textContent = out.slice(0, 30).join('\n');
      document.body.appendChild(d);
    }, 500);
  });
}
</script>
