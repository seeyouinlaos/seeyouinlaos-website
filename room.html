<script>
(function () {
'use strict';
var q = new URLSearchParams(location.search);
var stayKey = q.get('stay'), roomSlug = q.get('room');
var stay = window.SIYL_ROOMS[stayKey];
if (!stay) { location.replace('journeys.html'); return; }
var room = null;
stay.rooms.forEach(function (r) { if (r.slug === roomSlug) room = r; });
if (!room) room = stay.rooms[0];
/* THE TITLE AND THE EYEBROW (Window 007 · PRQ-03-11): built from the room and its hotel, never from the stage — the
 * Guest House, whose room and house share one name, is named once; a room with its own property (U Sathorn Bangkok)
 * names the property, not "Bangkok · Before the Wedding" */
var hotel = room.property || stay.name;
var isHouse = room.name === stay.name;
document.title = (isHouse ? room.name : room.name + ' · ' + hotel) + ' · See You In Laos';
var city = String(stay.place || '').split(',')[0];
var SP = window.SIYL_STAY_PLAN;
var eyebrowWords = isHouse ? ((room.complimentary && SP && SP.COMPLIMENTARY && SP.COMPLIMENTARY.eyebrow) || room.cat + ' · ' + city)
  : room.property ? room.property + ' · ' + room.cat + ' · ' + stay.windows[0].label
  : room.cat + ' · ' + stay.name;

function esc(s) { return String(s).replace(/</g, '&lt;'); }
/* every amount on this page comes from SIYL_PRICE — nothing is computed here */
var P = window.SIYL_PRICE;
var W0 = stay.windows[0];
function priceLine(r) {
  if (r.rate == null) return '<span class="rsv">' + esc(r.status || 'Amount on request') + '</span>';
  var qq = P.quote(W0.id, r.slug);
  if (qq && qq.total != null) return '<span class="op">' + qq.amount + '</span> <span class="oe">per person · ' + esc(qq.nightsLine) + '</span>';
  return '<span class="op">USD ' + r.rate + '</span> <span class="oe">per person per night</span>';
}

/* the amount, what it covers, and the nights it covers — one block, every
 * window, so "2 nights" can never be mistaken for one. The basis is said once: "USD 290 per person", then
 * "2 nights · 25 – 27 February 2027" (Window 007 · TO-01330) */
function amountBlock(q) {
  var b = '<p class="price">' + q.amount + ' <span class="pu">per person</span></p>';
  b += '<p class="per">' + esc(q.nightsLine) + ' · ' + esc(q.dates) + '</p>';
  if (q.nightsCovered) b += '<p class="nn">' + esc(q.nightsCovered) + '</p>';
  if (q.contribution) b += '<p class="nn">' + esc(q.contribution) + '</p>';
  return b;
}

var h = '';
/* ---- the name above the photograph (measured: the Aman room page reads title → photograph → caption → body) ---- */
h += '<section class="intro intro-head"><p class="eyebrow">' + esc(eyebrowWords) + '</p><h1>' + esc(room.name) + '</h1></section>';
/* ---- room hero + real gallery (same concrete room, counter 1/N) ---- */
if (room.gallery.length) {
  h += '<div class="gal" id="gal"><div class="trk" id="trk">';
  room.gallery.forEach(function (g, i) {
    h += '<div class="ph" style="background-image:url(' + g[0] + ')" role="img" aria-label="' + esc(room.name) + ' — ' + esc(g[1]) + '"></div>';
  });
  h += '</div>';
  if (room.gallery.length > 1) h += '<button class="gn gp" aria-label="Previous photograph">‹</button><button class="gn gx" aria-label="Next photograph">›</button>';
  h += '<span class="gl" id="gl">' + esc(room.gallery[0][1]) + '</span>';
  h += '<span class="gc" id="gc">1 / ' + room.gallery.length + '</span></div>';
} else {
  h += '<div class="pend">Photography to follow</div>';
}
/* ---- BOOKING FIRST, DETAILS SECOND (Owner, 24 Sep 2026): the room, its amount and its one action — with the rooms of the
 *      category and who already holds a place in them — stand directly under the photographs; the story, the facts, the
 *      amenities and the other rooms follow as optional detail. (Formerly the last block of the page.) ---- */
/* nothing is booked on this website — a room is chosen and held, the Guest House is a place taken (Window 007 · TO-01332) */
h += '<section class="buy" id="book"><p class="eyebrow" style="margin:0">' + (room.complimentary ? 'Take a place' : 'Choose your room') + ' · ' + esc(stay.place) + '</p>';
stay.windows.forEach(function (w, wi) {
  var q = P.quote(w.id, room.slug);
  h += '<div class="win"><p class="wl">' + esc(w.label) + '</p><p class="wd">' + esc(w.dates) + '</p><p class="wn">' + esc(w.nights) + '</p>';
  if (room.complimentary) {
    /* THE GUEST HOUSE (Owner, 19 Sep 2026): complimentary, four shared places (one bedroom · Edit 7) held through the room engine like any room —
       the guest sees who already shares the house and takes as many places as the party has members */
    h += '<p class="price">Complimentary</p><p class="per">One of four places in a shared house; Guest Relations looks after the keys, your arrival and everything around it.</p>';
    /* EDIT 8 (Aui, 25 Sep 2026): the Guest House says beside its place that breakfast is not included and is the guest's own cost */
    if ((room.breakfast || stay.breakfast)) h += '<p class="bf">' + esc((room.breakfast || stay.breakfast)) + '</p>';
    h += '<p class="av" data-av="' + w.id + '" hidden></p>';
    h += '<div class="rooms prep" data-rooms-box="' + w.id + '"></div>';
    h += '<button class="cta" data-win="' + wi + '" data-avwin="' + w.id + '">Add to My Bag</button><span class="swap" data-swap="' + wi + '" hidden></span>';
  } else if (room.rate == null) {
    /* real inventory without an approved guest amount — never an invented price (dormant: every room carries a rate) */
    h += '<p class="price">Amount on request</p><p class="per">Guest Relations will confirm the amount with you.</p>';
  } else {
    /* NO PRE-RESERVED ROOMS (Owner, 15 Sep 2026): every room is chosen like any other, available until booked.
     * ONE presentation for every window: the amount, exactly what it covers,
     * and the exact nights it covers. The nights are never left implicit. */
    h += amountBlock(q);
    /* the hosted night is said once, by the amount block's own line (Window 007 · TO-00820) — no second note here */
    if ((room.breakfast || stay.breakfast)) h += '<p class="bf">' + esc((room.breakfast || stay.breakfast)) + '</p>';
    h += '<p class="av" data-av="' + w.id + '" hidden></p>';
    /* the physical rooms of this category, each with its two places — the primary picture of availability */
    h += '<div class="rooms prep" data-rooms-box="' + w.id + '"></div>';
    h += '<button class="cta" data-win="' + wi + '" data-avwin="' + w.id + '">Add to My Bag</button><span class="swap" data-swap="' + wi + '" hidden></span>';
    if (P.hasVariants(w.id)) h += '<button type="button" class="chg" data-chg="' + wi + '" hidden>Choose another room</button>';
  }
  h += '</div>';
});
h += '<p class="note">Nothing is paid on this website — Guest Relations confirms every arrangement with you.</p></section>';
h += '<h2 class="detail-h" id="details">Details</h2>';
/* the room's own paragraph — what the guest is actually buying; the one-line desc is the Other rooms card's, never printed
 * above the story that says the same thing (Window 007 · PRQ-03-10) */
h += '<section class="intro"><p class="body">' + esc(room.story || room.desc) + '</p>';
if (room.galleryNote) h += '<p class="eyebrow" style="margin-top:10px">' + esc(room.galleryNote) + '</p>';
h += '</section>';

/* ---- amenities: only facts from register/data.mjs ---- */
h += '<div class="wrap">';
if (room.facts.length) {
  h += '<h2>' + (isHouse ? 'The house' : 'The room') + '</h2><div class="facts">';
  room.facts.forEach(function (f) { h += '<div class="frow"><span class="fl">' + esc(f[0]) + '</span><span class="fv">' + esc(f[1]) + '</span></div>'; });
  h += '</div>';
}
if (room.roomPhotoPending) h += '<p class="note" style="margin-top:10px">Room photography to follow.</p>';
h += '</div>';
/* ---- what the room gives you: named groups on the light surface, never a wall
 *      of text. `groups` is the source amenity list for THIS room, edited into
 *      a few short groups; a room without groups keeps the plain list. ---- */
if (room.groups && room.groups.length) {
  h += '<section class="plane"><h2>Comfort &amp; amenities</h2><div class="grp">';
  room.groups.forEach(function (g) {
    h += '<div class="gcol"><h3>' + esc(g[0]) + '</h3><ul class="amen">';
    g[1].forEach(function (a) { h += '<li>' + esc(a) + '</li>'; });
    h += '</ul></div>';
  });
  h += '</div></section>';
} else if (room.amenities && room.amenities.length) {
  h += '<section class="plane"><h2>Comfort &amp; amenities</h2><ul class="amen">';
  room.amenities.forEach(function (a) { h += '<li>' + esc(a) + '</li>'; });
  h += '</ul></section>';
}
/* ---- all stays include (separate from room amenities, proven only) ---- */
var inc = (room.includes && room.includes.length) ? room.includes : stay.includes;   /* a room speaks for itself first */
if (inc && inc.length) {
  h += '<div class="wrap"><h2>What is included</h2><div class="inc">';
  inc.forEach(function (t) { h += '<p>' + t + '</p>'; });
  h += '</div></div>';
}

/* ---- editorial detail (real copy from data.mjs only) ---- */
if (stayKey === 'souphattra') {
  h += '<section class="ed"><div class="ph" style="background-image:url(assets/images/souphattra/heritage-courtyard-pool.jpg)" role="img" aria-label="Souphattra Heritage Vientiane — the courtyard and pool"></div>';
  h += '<p class="cap">Souphattra Heritage Vientiane</p>';
  h += '<p class="body wrap" style="display:block;text-align:center">Souphattra Heritage Vientiane is at the heart of our wedding weekend: we have breakfast together here on the wedding morning, and the vows and the dinner take place around its courtyard.</p></section>';
} else if (room.gallery.length > 3) {
  var edImg = room.gallery[room.gallery.length - 1];
  h += '<section class="ed"><div class="ph" style="background-image:url(' + edImg[0] + ')" role="img" aria-label="' + esc(room.name) + ' — ' + esc(edImg[1]) + '"></div>';
  h += '<p class="cap">' + esc(edImg[1]) + '</p></section>';
}

/* ---- other rooms of the same stay: swipeable carousel with peek ---- */
var others = stay.rooms.filter(function (r) { return r.slug !== room.slug; });
if (others.length) {
  h += '<section class="others"><h2>Other rooms at ' + esc(stay.name) + '</h2><div class="oc" id="oc">';
  others.forEach(function (r) {
    var art = window.SIYL_STAY_ART ? SIYL_STAY_ART.card(stayKey, r.slug) : '';
    var img = art ? '<div class="ph" style="background-image:url(' + art + ')"></div>' : '<div class="ph" style="display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#6B6964">Photography to follow</div>';
    h += '<a class="occard" href="room.html?stay=' + stayKey + '&room=' + r.slug + '">' + img +
      '<div class="ot"><p class="oe">' + esc(r.cat) + '</p><p class="on">' + esc(r.name) + '</p>' +
      '<p class="od">' + esc(r.desc) + '</p>' +
      '<p>' + priceLine(r) + '</p>' +
      '<p class="oe" data-oav="' + r.slug + '"></p></div></a>';
  });
  h += '</div>';
  if (others.length > 1) h += '<div class="rnav"><div class="rail" aria-hidden="true"><i id="rail"></i></div><span class="rc" id="rc">1 / ' + others.length + '</span><button type="button" id="op" aria-label="Previous room">‹</button><button type="button" id="ox" aria-label="Next room">›</button></div>';
  h += '</section>';
}

h += '<p class="backrow"><a href="journeys.html#j-' + stay.windows[0].id + '">Back to The Journey</a></p>';

document.getElementById('m').innerHTML = h;
if (window.SIYL_BAG) SIYL_BAG.badge();

/* gallery: a native scroll-snap track — the image follows the finger; arrows,
 * keys, caption and 1/N all read the real scroll position */
var trk = document.getElementById('trk');
if (trk && room.gallery.length > 1) {
  var gc = document.getElementById('gc'), gl = document.getElementById('gl'), gi = 0, raf = 0;
  function idx() { return Math.max(0, Math.min(room.gallery.length - 1, Math.round(trk.scrollLeft / trk.clientWidth))); }
  function sync() { raf = 0; var i = idx(); if (i === gi) return; gi = i; gc.textContent = (gi + 1) + ' / ' + room.gallery.length; gl.textContent = room.gallery[gi][1]; }
  trk.addEventListener('scroll', function () { if (!raf) raf = requestAnimationFrame(sync); }, { passive: true });
  function go(d) { var i = (idx() + d + room.gallery.length) % room.gallery.length; trk.scrollTo({ left: i * trk.clientWidth, behavior: 'smooth' }); }
  document.querySelector('.gp').addEventListener('click', function () { go(-1); });
  document.querySelector('.gx').addEventListener('click', function () { go(1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight') go(1);
  });
}

/* other rooms: the whole card (image + title + description) is the slide; the
 * thin rail and the counter follow the real horizontal scroll position */
var oc = document.getElementById('oc'), rail = document.getElementById('rail');
if (oc && rail) {
  var rc = document.getElementById('rc'), cards = oc.querySelectorAll('.occard'), oraf = 0;
  function step() { var c = cards[0]; return c.offsetWidth + 14; }
  function railSync() {
    oraf = 0;
    var max = oc.scrollWidth - oc.clientWidth, p = max > 0 ? oc.scrollLeft / max : 0;
    var frac = Math.min(1, oc.clientWidth / oc.scrollWidth), track = rail.parentNode.clientWidth;
    rail.style.width = Math.round(frac * track) + 'px';
    rail.style.transform = 'translateX(' + Math.round(p * (track - frac * track)) + 'px)';
    rc.textContent = (Math.min(cards.length, Math.round(oc.scrollLeft / step()) + 1)) + ' / ' + cards.length;
  }
  oc.addEventListener('scroll', function () { if (!oraf) oraf = requestAnimationFrame(railSync); }, { passive: true });
  window.addEventListener('resize', railSync);
  document.getElementById('op').addEventListener('click', function () { oc.scrollBy({ left: -step(), behavior: 'smooth' }); });
  document.getElementById('ox').addEventListener('click', function () { oc.scrollBy({ left: step(), behavior: 'smooth' }); });
  railSync();
}

/* adds are invitation-gated — identical mechanism to journeys.html */
function gated(fn) {
  if (window.SIYL_INVITE) SIYL_INVITE.require(fn);
  else document.addEventListener('siyl:invite-ready', function () { SIYL_INVITE.require(fn); }, { once: true });
}
/* ACCESS (Owner, 16 Sep 2026 · final IA): a room page is private planning — rates, live places, the choice — so
   without a session it hands over to the invitation page and comes back here after the code */
gated(function () {});
/* the product surface reads and writes the same bag state as Your Journey */
function mine(w) {
  var ids = P.ids(w.id);
  var line = SIYL_BAG.get().filter(function (x) { return ids.indexOf(x.id) >= 0; })[0];
  /* the line is this room's by its slug (every line carries it); the words of the meta are the older reader's way */
  return line && ((line.room && line.room === room.slug) || (!line.room && line.meta && line.meta.indexOf(room.name) >= 0)) ? line : null;
}
/* what the trip holds for this STAGE — this window's line, or the other hotel's line of the same stage (one selection per stage) */
function held(w) {
  var ids = ST && ST.stageIds ? ST.stageIds(w.id) : P.ids(w.id);
  return SIYL_BAG.get().filter(function (x) { return ids.indexOf(x.id) >= 0; })[0] || null;
}
var U = window.SIYL_UNITS, ST = window.SIYL_STAY;
/* WHAT THE GUEST ALREADY HOLDS for these nights, named by its own room and house (Window 007 · PRQ-03-03 · TO-01351):
 * never the last " · " segment of the product meta ("Immersive View"), never "four shared places" for one place */
function whatYouHold(line) {
  if (!line) return '';
  if (line.stay === 'guesthouse' || line.complimentary) return 'a place at the Guest House complimentary';
  var R = window.SIYL_ROOMS || {}, st = R[line.stay] || null, rec = null;
  if (st) st.rooms.forEach(function (r) { if (r.slug === line.room) rec = r; });
  var house = (rec && rec.property) || (st ? String(st.name).split(' · ')[0] : '') || line.name || '';
  var unit = '';
  try { var x = ST && ST.unitOf ? ST.unitOf(line) : null; unit = x && U && U.unitName ? U.unitName(x) : ''; } catch (e) { unit = ''; }
  var name = rec ? rec.name : '';
  var what = unit && name ? unit + ' (' + name + ')' : (name || unit || 'a room');
  return what + (house ? ' at the ' + house : '');
}
/* A REFUSAL IS SEEN (Window 007 · PRQ-03-02): the words of a refused or failed action are kept per window and painted AFTER
 * the live label, so the re-render that follows every engine event can no longer wipe them; the next action clears them */
var refusals = {};
function refuse(w, r, action) {
  if (!r || r.ok) { delete refusals[w.id]; return; }
  var words = ST ? ST.refusal(r, action) : '';
  refusals[w.id] = words || '';
}
function paint() {
  /* the sibling cards carry the same live counts as the page they open */
  document.querySelectorAll('[data-oav]').forEach(function (el) {
    var slug = el.getAttribute('data-oav');
    el.textContent = (U && U.ready() && U.tracked(W0.id, slug)) ? U.label(W0.id, slug) : '';
  });
  document.querySelectorAll('[data-win]').forEach(function (b) {
    var wi = parseInt(b.getAttribute('data-win'), 10), w = stay.windows[wi];
    var swap = document.querySelector('[data-swap="' + wi + '"]');
    var chg = document.querySelector('[data-chg="' + wi + '"]');
    var line = mine(w), other = held(w);
    if (line) {
      b.textContent = 'Remove from My Bag';
      b.classList.add('sel');
      if (swap) { swap.hidden = true; swap.textContent = ''; }   /* TO-03350 REMOVE: the state line above already says “Held for you · {room}” */
      if (chg) chg.hidden = false;
    } else {
      b.textContent = 'Add to My Bag';
      b.classList.remove('sel');
      if (chg) chg.hidden = true;
      if (swap) {
        if (other) {
          /* the other hotel of the same stage is named with its house: one selection per stage, the new room replaces it */
          swap.hidden = false; swap.textContent = 'You already hold ' + whatYouHold(other) + ' for these nights. Choosing this room replaces it; you keep it until the new room is held.';
        }
        else swap.hidden = true;
      }
    }
    /* ---- what the room engine says about THIS room, right now: the category's exact numbers and every physical room ---- */
    var av = document.querySelector('[data-av="' + w.id + '"]'), box = document.querySelector('[data-rooms-box="' + w.id + '"]');
    if (av && U && U.ready() && U.tracked(w.id, room.slug)) {
      av.hidden = false;
      av.textContent = U.label(w.id, room.slug);
      av.classList.toggle('low', U.scarce(w.id, room.slug) || U.soldOut(w.id, room.slug));
      var need = ST ? ST.need(w.id) : 1;
      /* A PLACE KEPT FOR THE VIEWER IS THE VIEWER'S (Window 007 · PRQ-03-01): a party member kept it — the button joins that room,
         and nothing on the page says "Sold out" or "full" to the guest it was kept for */
      var kept = !line && U.keptForMe ? U.keptForMe(w.id, room.slug) : null;
      if (kept && kept.label) b.setAttribute('data-kept', kept.label); else b.removeAttribute('data-kept');
      var gone = !line && !kept && !(need > 1 && U.unitForParty ? U.unitForParty(w.id, room.slug, need) : U.fits(w.id, room.slug));
      b.disabled = gone;
      if (kept) b.textContent = 'Join this room';
      /* the whole party must fit together — the refusal names that reason, never "your party" as the thing refused (TO-01352 · TO-01353) */
      if (gone) b.textContent = U.soldOut(w.id, room.slug) ? (U.ctaWords(w.id, room.slug) || 'Sold out') : (room.complimentary ? 'The Guest House cannot take the ' + need + ' of you together' : 'No room of this kind for the ' + need + ' of you together');
      if (box && ST) { box.innerHTML = ST.unitsHtml(w.id, room.slug); ST.wire(box, function (r) { refuse(w, r, 'hold'); paint(); if (r.ok) wizardDone(w); }); }
    } else if (av) { av.hidden = true; b.disabled = false; b.removeAttribute('data-kept'); if (box) box.innerHTML = ''; }
    /* the refusal, painted last so the re-render cannot wipe it */
    if (av && refusals[w.id]) { av.hidden = false; av.textContent = refusals[w.id]; av.classList.add('low'); }
  });
}
function need(w) { return ST && ST.need ? ST.need(w && w.id) : 1; }
/* THE BOOKING CONTEXT (Owner, 20 Sep 2026): opened from 02 / 06, a room chosen here returns the guest to My Trip by itself */
function wizardDone(w) { var Wz = window.SIYL_WIZARD; if (Wz && Wz.active) Wz.done(Wz.stageOfWindow(w.id)); }
document.querySelectorAll('[data-win]').forEach(function (b) {
  b.addEventListener('click', function () {
    var w = stay.windows[parseInt(b.getAttribute('data-win'), 10)];
    delete refusals[w.id];
    /* a network failure is a refusal like any other: nothing changed, and the guest is told (PRQ-03-02) */
    var failed = function () { return { ok: false, error: 'unreachable' }; };
    if (mine(w)) { ST.remove(w.id).then(function (r) { refuse(w, r, 'give back'); paint(); }, function () { refuse(w, failed(), 'give back'); paint(); }); return; }
    /* the place is held in the guest's own name first; only then the line */
    b.disabled = true; b.textContent = need(w) > 1 ? 'Holding your places…' : 'Holding your place…';
    ST.select(w.id, room.slug, b.getAttribute('data-kept') || null, need(w)).then(null, failed).then(function (r) {
      refuse(w, r, 'hold');
      paint();
      if (r.ok) wizardDone(w);
    });
  });
});
document.querySelectorAll('[data-chg]').forEach(function (b) {
  b.addEventListener('click', function () {
    /* the collection this room belongs to, with the current choice visible */
    var w = stay.windows[parseInt(b.getAttribute('data-chg'), 10)];
    var to = 'journeys.html?change=' + w.id + '#j-' + w.id; location.href = window.SIYL_WIZARD ? SIYL_WIZARD.href(to) : to;
  });
});
document.addEventListener('siyl:bag', paint);
document.addEventListener('siyl:units', paint);
paint();
if (window.SIYL_BAG.bar) SIYL_BAG.bar();
})();
</script>

<script>
if (new URLSearchParams(location.search).get('debug')) {

    setTimeout(function () {
      var out = ['innerW=' + innerWidth, 'docW=' + document.documentElement.scrollWidth, 'clientW=' + document.documentElement.clientWidth];
      document.querySelectorAll('body *').forEach(function (el) {
        var r = el.getBoundingClientRect();
        if (r.right > document.documentElement.clientWidth + 1 && !el.closest('.oc')) {
          out.push(el.tagName + '.' + String(el.className).slice(0, 30) + ' w=' + Math.round(r.width) + ' r=' + Math.round(r.right));
        }
      });
      var d = document.createElement('pre'); d.id = 'dbg'; d.textContent = out.slice(0, 30).join('\n');
