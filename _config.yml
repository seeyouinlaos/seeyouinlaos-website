# GitHub Pages (mirror) build config.
# The mirror must serve ONLY the public guest surfaces. Internal docs, worker
# source, tooling, tests and the legacy /journey/ site are excluded here
# (Cloudflare handles the same via .assetsignore).
exclude:
  - docs
  - src
  - test
  # trailing slash is required: Jekyll 3 excludes by start_with?, so a bare
  # "journey" entry also swallowed journeys.html (the shop page) on the mirror.
  - journey/
  - node_modules
  - README.md
  - SITE-REPORT.md
  - dist/
  # the superseded registration engine — never served; its entry is regenerated
  # from register-landing.html as a redirect into invitation.html
  - register/index.html
  - register/app.mjs
  - register/data.mjs
  - register/logic.mjs
  - package.json
  - package-lock.json
  - wrangler.jsonc
include: []
