@font-face{font-family:'PP Editorial Old';src:url('assets/fonts/PPEditorialOld-Ultralight.otf') format('opentype');font-weight:200;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}body{background:#F3EEE7;color:#313131;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;font-weight:300;font-size:14px;line-height:1.6}
.hd{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:14px 20px}
.hb{width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:5px;background:none;border:0;cursor:pointer}.hb i{display:block;width:20px;height:1.4px;background:#313131}
.bd{font-family:'PP Editorial Old',serif;font-weight:200;font-size:19px;text-align:center}.bd .dot{color:#8A5A55}
.bag{width:44px;height:44px;display:flex;align-items:center;justify-content:center;position:relative;color:#313131;text-decoration:none}.bag .bgi{display:block}
.bb{position:absolute;top:1px;right:0;min-width:14px;height:14px;padding:0 3px;background:#313131;color:#F3EEE7;font-size:8.5px;line-height:1;letter-spacing:0;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px #F3EEE7;border-radius:1px}
main{padding:30px 24px 80px;max-width:640px;margin:0 auto}
h1{font-family:'PP Editorial Old',serif;font-weight:200;font-size:29px;margin-bottom:6px}
.sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#7C7A75;margin-bottom:26px}
h2{font-family:'PP Editorial Old',serif;font-weight:200;font-size:20px;margin:34px 0 10px}
.note{font-size:11.5px;color:#7C7A75;margin-top:14px;max-width:36em;line-height:1.8}
.tlink{display:inline-block;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:#313131;text-decoration:none;border-bottom:1px solid #313131;padding:8px 0 3px;min-height:44px}
.lede{font-size:15px;line-height:1.8;color:#313131;max-width:32em;margin-bottom:2px}
.body{font-size:13px;line-height:1.85;color:#4A4A4A;max-width:34em}
.reassure{border-left:1px solid #DAD9D7;padding-left:16px;margin:20px 0 4px;font-size:12.5px;line-height:1.85;color:#4A4A4A;max-width:34em}

.drow:first-of-type{border-top:0}
.dl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#7C7A75}
.dv{font-family:'PP Editorial Old',serif;font-weight:200;font-size:19px;line-height:1.3;margin:4px 0 2px}
.dh{font-size:12px;color:#7C7A75;line-height:1.7;margin-bottom:10px}
.dstate{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#313131;margin:8px 0 0}
.dstate.none{color:#7C7A75}
.dmeta{font-size:11.5px;color:#7C7A75;line-height:1.7;margin-top:4px;word-break:break-word}
.dbtns{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.dbtn{background:#FCFAF6;border:1px solid #313131;color:#313131;cursor:pointer;font:inherit;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:15px 20px;min-height:48px}
.dbtn:hover{background:#313131;color:#F3EEE7}
.dbtn.quiet{background:none;border:0;color:#7C7A75;padding:13px 0;min-height:44px;text-decoration:underline;text-underline-offset:5px}
.dbtn[disabled]{opacity:.5;cursor:default}
.derr{font-size:12px;color:#8A5A44;line-height:1.7;margin-top:10px;max-width:34em}
.consent{border:1px solid #DAD9D7;background:#FCFAF6;padding:22px 20px;margin-top:16px}
.consent h3{font-family:'PP Editorial Old',serif;font-weight:200;font-size:19px;margin-bottom:8px}
.ackrow{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:8px 0;min-height:44px}
.ackrow input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:#313131}
.ackrow span{font-size:13px;line-height:1.7;color:#313131}
.cstate{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:#7C7A75;margin-top:8px}
.nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:34px;border-top:1px solid #DAD9D7;padding-top:22px}
.nav .back{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#7C7A75;text-decoration:none;border-bottom:1px solid #C9C4BA;padding:11px 0 3px;min-height:44px;display:inline-block;line-height:20px}
.nav .skip{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#7C7A75;text-decoration:none;border-bottom:1px solid #C9C4BA;padding:11px 0 3px;min-height:44px;display:inline-block;line-height:20px}
.nav .go{margin-left:auto;background:#313131;color:#F3EEE7;text-decoration:none;padding:17px 24px;font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;min-height:50px;display:inline-flex;align-items:center}
.gate{border:1px solid #DAD9D7;background:#FCFAF6;padding:24px 20px;margin-top:26px}
.gate h3{font-family:'PP Editorial Old',serif;font-weight:200;font-size:19px;margin-bottom:8px}
.gbtn{background:#313131;color:#F3EEE7;border:0;padding:17px 22px;font:inherit;font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;cursor:pointer;min-height:50px;margin-top:8px}
@media (min-width:768px){.nav .go{margin-left:auto}}
</style><link rel="stylesheet" href="assets/desktop.css"><link rel="stylesheet" href="assets/aman.css"></head><body>
<header class="hd"><button class="hb" aria-label="Menu"><i></i><i></i><i></i></button><div class="bd">see you in laos<span class="dot">.</span></div><a class="bag" href="your-journey.html" aria-label="Your Journey"><svg class="bgi" viewBox="0 0 26 26" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5.1 10.1h15.8a.9.9 0 0 1 .9 1l-.95 10.6a1.6 1.6 0 0 1-1.6 1.45H6.75a1.6 1.6 0 0 1-1.6-1.45L4.2 11.1a.9.9 0 0 1 .9-1z"/><path d="M8 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M13.4 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M5.6 14.2h14.8"/><path d="M12.2 13.2h1.6a.5.5 0 0 1 .5.5v1.6a.5.5 0 0 1-.5.5h-1.6a.5.5 0 0 1-.5-.5v-1.6a.5.5 0 0 1 .5-.5z"/></svg><span class="bb" data-bag-badge></span></a></header>
<main id="documents">
<h1>Documents &amp; privacy</h1>
<p class="sub">Step 4 of 6 · optional · can be added later</p>
<p class="lede">Two documents help us coordinate your journey.</p>
<p class="reassure">Your documents are used only to help us coordinate your journey. Access is limited to the team members who need them for your travel arrangements.</p>
<div id="page"></div>
</main>
<script src="assets/bag.js"></script>
<script src="assets/shop-menu.js"></script>
<script src="assets/aman.js"></script>
<script src="assets/guest.js"></script>
<script src="assets/docs.js"></script>
<script type="module" src="assets/invite.mjs"></script>
<script>
/* ============================================================================
   DOCUMENTS & PRIVACY — real controls, honest states.

   Per named guest: a passport and a flight document, both optional for
   submission. The control opens the camera or the file picker; the bytes go
   straight to the Worker and into a private store; this browser keeps only the
   receipt. RECEIVED means received — never reviewed, verified or approved.

   Then, kept deliberately apart: a NOTICE that the day is photographed, and a
   separate, optional, unticked publication CONSENT that can be withdrawn.
   ========================================================================== */
(function(){
var G=window.SIYL_GUEST,D=window.SIYL_DOCS,page=document.getElementById('page');
if(!G||!D||!page)return;
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function gated(fn){if(window.SIYL_INVITE){SIYL_INVITE.require(fn)}
else document.addEventListener('siyl:invite-ready',function(){SIYL_INVITE.require(fn)},{once:true})}
function when(iso){try{return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}catch(e){return ''}}
function size(n){return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}

function docRow(g,k){
var id=g.guestId,r=D.get(id,k.key),state=D.state(id,k.key);
var h='<div class="drow" data-g="'+esc(id)+'" data-k="'+k.key+'">';
h+='<p class="dl">'+k.label+'</p>';
h+='<p class="dh">'+k.hint+'</p>';
if(r){
  h+='<p class="dstate">'+state+'</p>';
  h+='<p class="dmeta">'+esc(r.filename)+' · '+size(r.bytes)+' · received '+when(r.receivedAt)+'</p>';
  h+='<p class="dmeta">Received means it reached us. It has not been reviewed or verified yet.</p>';
  h+='<div class="dbtns"><button type="button" class="dbtn" data-add="1">Replace</button></div>';
}else{
  h+='<p class="dstate none">Not provided</p>';
  h+='<div class="dbtns"><button type="button" class="dbtn" data-add="1">'+k.add+'</button>'+
     '<button type="button" class="dbtn quiet" data-later="1">Add later</button></div>';
}
h+='<input type="file" accept="'+D.ACCEPT+'" hidden>';
h+='<p class="derr" hidden></p>';
return h+'</div>'}

function consentBlock(g){
var id=g.guestId,c=(D.consentDecided(id)?(D.consent(id)?'Given':'Declined'):'Not answered');
var given=!!D.consent(id);
return '<div class="consent" data-c="'+esc(id)+'">'+
  '<h3>Photographs and film</h3>'+
  '<p class="body">A photographer and a videographer are with us on the wedding day. This is how the day is remembered, and it happens whether or not you answer the question below.</p>'+
  '<p class="body" style="margin-top:12px"><b style="font-weight:400;color:#313131">Publication is a separate choice.</b> Saying no changes nothing about your place at the wedding.</p>'+
  '<label class="ackrow"><input type="checkbox" data-consent="'+esc(id)+'"'+(given?' checked':'')+'>'+
  '<span>'+D.CONSENT_TEXT+'</span></label>'+
  '<p class="cstate">'+c+(D.consentDecided(id)?' · '+when((D.consent(id)||{}).at||new Date().toISOString()):'')+'</p>'+
  '<p class="body" style="margin-top:12px;font-size:12px">You can withdraw this at any time by writing to <a href="mailto:guest.relation.seeyouinlaos@gmail.com?subject=Publication%20consent" style="color:#313131">Guest Relations</a>. We keep the date and the wording of every answer, we stop using your images for anything new, and we remove what we still control. Anything already published elsewhere we ask to have taken down — we cannot promise a platform will comply.</p>'+
  '<p class="body" style="margin-top:10px;font-size:11.5px;color:#7C7A75">This wording is provisional and will be finalised with legal review before the wedding. Your answer, its date and its version are kept, so you will never be held to wording you did not see.</p>'+
  '</div>'}

function render(){
var p=G.party();
if(!p||!p.guests.length){
  page.innerHTML='<div class="gate"><h3>'+(G.stale()?'Open your invitation once more':'Open your invitation')+'</h3>'+
    '<p class="body">'+(G.stale()
      ? 'We&rsquo;ve updated your private journey so every choice can now be shown by name. Enter your invitation code once more. Your existing journey choices will remain.'
      : 'Documents belong to the people named on your invitation, so we open it first.')+'</p>'+
    '<button type="button" class="gbtn" id="open">Open my invitation</button></div>';
  document.getElementById('open').addEventListener('click',function(){gated(render)});
  return}
var h='';
p.guests.forEach(function(g){
  h+='<section class="gcard"><p class="gname">'+esc(G.value(g.guestId,'preferredName')||g.fullName)+'</p>'+
     '<p class="body">Both are optional now and can be added at any time before you travel.</p>';
  D.KINDS.forEach(function(k){h+=docRow(g,k)});
  h+=consentBlock(g);
  h+='</section>'});
h+='<div class="nav"><a class="back" href="voyage.html">Back</a>'+
   '<a class="skip" href="about-you.html">Skip for now</a>'+
   '<a class="go" href="about-you.html">Save &amp; continue</a></div>';
page.innerHTML=h;

page.querySelectorAll('.drow').forEach(function(row){
  var gid=row.getAttribute('data-g'),kind=row.getAttribute('data-k');
  var input=row.querySelector('input[type=file]'),err=row.querySelector('.derr');
  var add=row.querySelector('[data-add]'),later=row.querySelector('[data-later]');
  if(add)add.addEventListener('click',function(){err.hidden=true;input.click()});
  if(later)later.addEventListener('click',function(){
    err.hidden=false;err.style.color='#7C7A75';
    err.textContent='Nothing to do — this stays as Not provided, and your journey can still be sent. Guest Relations will ask you nearer the time.'});
  input.addEventListener('change',function(){
    var f=input.files&&input.files[0];
    if(!f)return;
    err.hidden=false;err.style.color='#7C7A75';err.textContent='Sending '+f.name+'…';
    if(add)add.disabled=true;
    D.send(gid,kind,f).then(function(res){
      if(add)add.disabled=false;
      input.value='';
      if(res.ok){render();return}
      err.style.color='#8A5A44';
      err.textContent=res.reason==='too large'
        ? 'That file is larger than 12 MB. A photograph of the page is usually enough.'
        : res.reason==='unsupported file type'
        ? 'We can take a JPEG, PNG, HEIC, WebP or PDF.'
        : res.reason==='document storage is not yet enabled'||res.enabled===false
        ? 'We cannot accept documents on the website yet. Nothing was sent and nothing was stored. Your journey can still be sent — Guest Relations will ask you for this directly.'
        : 'That did not reach us, so nothing was stored. Please try again, or send it to Guest Relations by email.';
    })});
});
page.querySelectorAll('[data-consent]').forEach(function(c){
  c.addEventListener('change',function(){D.setConsent(c.getAttribute('data-consent'),c.checked);render()})});
}
document.addEventListener('siyl:guest',function(){});
render();
if(window.SIYL_BAG&&SIYL_BAG.bar)SIYL_BAG.bar();
})();
</script>
</body></html>
