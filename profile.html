<script>
/* ============================================================================
   MY PROFILE (Owner, 18 Sep 2026) — the guest's account dashboard.
   NOT a step of the gated flow: this page never mounts the step shell, never
   redirects to a missing item and never counts towards readiness. It reads
   what the other surfaces hold — identity, contact, the arrangements in the
   guest's name (held rooms, the waiting list, travel, experiences, the
   wedding and the seats), the tickets, the trip status, About You (step 05)
   and the travel documents — and links to the surface where each is changed.
   My Bag stays the one cart: nothing here adds, removes or re-totals a line.
   ========================================================================== */
(function(){
var G=window.SIYL_GUEST,B=window.SIYL_BAG,J=window.SIYL_JOURNEY,P=window.SIYL_PRICE,ST=window.SIYL_STAY,U=window.SIYL_UNITS,S=window.SIYL_SEATS,C=window.SIYL_CONFIRM,D=window.SIYL_DOCS,DR=window.SIYL_DRAFT,T=window.SIYL_TEMPLE,AV=window.SIYL_AVATAR,page=document.getElementById('page');
if(!G||!page)return;
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function gated(fn){if(window.SIYL_INVITE){SIYL_INVITE.require(fn)}
else document.addEventListener('siyl:invite-ready',function(){SIYL_INVITE.require(fn)},{once:true})}
function money(n){return 'USD '+Number(n).toLocaleString('en-US')}
/* a date in words — never an ISO stamp, never a clock time */
function day(iso){try{var d=new Date(iso);if(isNaN(d))return '';return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){return ''}}
/* ACCESS: the account is private — without a session the guest goes to the invitation page */
gated(function(){});

/* ---- imagery: the one source map of every property, the transport photography, the wedding venue ---- */
function roomImg(stayKey,slug){return window.SIYL_STAY_ART?SIYL_STAY_ART.card(stayKey,slug):''}
function hrefImg(href){var m=/stay=([^&#]+)&room=([^&#]+)/.exec(href||'');return m?roomImg(decodeURIComponent(m[1]),decodeURIComponent(m[2])):''}
function lineImg(x){var t=B.thumb(x);if(t)return t;if(x.stay&&x.room)return roomImg(x.stay,x.room);var at=P&&P.locate?P.locate(x.id):null;if(at&&x.room)return roomImg(at.key,x.room);return ''}
var IMG={ceremony:'assets/images/souphattra/heritage-courtyard-front.jpg',dinner:(window.SIYL_WEDDING_DINNER?SIYL_WEDDING_DINNER.lead:'assets/images/event/056-wedding-dinner-01-poolside-from-above.jpg'),temple:'assets/images/alms/ritual-dawn-01.jpg',coffee:'assets/images/event/051-coffee-and-cake-patisserie.jpg'};

/* ---- the links every card offers: the surface where the item is changed, never a control of its own ---- */
function segOf(x){return J.SEGMENTS.filter(function(s){return s.ids.indexOf(x.id)>=0})[0]||null}
function detailHref(x){
  if(x.stay&&x.room)return 'room.html?stay='+x.stay+'&room='+x.room;
  if(x.id==='1872'||x.id==='tea1872')return '1872.html';
  if(x.exp)return 'experience.html?id='+encodeURIComponent(x.exp);
  if(x.interest&&x.id!=='guesthouse')return 'marsilea.html';
  if(x.id==='sangkhathan')return 'wedding.html#sangkhathan';
  if(window.SIYL_TRANSPORT&&window.SIYL_TRANSPORT[x.id])return 'transport.html?id='+x.id;
  var at=P.locate(x.id);
  if(at&&x.room)return 'room.html?stay='+at.key+'&room='+x.room;
  return 'journeys.html#j-'+P.windowOf(x.id)}
function group(x){var m=J.meta(x);if(x.id==='sangkhathan'||m.cat==='Wedding programme')return 'wedding';if(m.cat==='Accommodation')return 'stay';if(m.cat==='Transportation')return 'travel';return 'experience'}
/* THE STATE OF A LINE (OQ-40 · PRQ-01-07 / PRQ-04-05): read per line from the last SENT version — a line in the latest sent trip
   reads “Sent to us”, one added or changed since “Selected · not sent yet”, and “Confirmed by Guest Relations” only while the
   confirmation stands (OQ-27). A send and a confirmation come only from Guest Relations. */
function lineKey(x){
  if(DR&&DR.lineState)return DR.lineState(x).key;
  var s=DR&&DR.submission?DR.submission():null;if(C&&C.state()==='confirmed')return 'confirmed';if(s&&s.submissionStatus!=='draft'&&!s.hasUnsentChanges)return 'sent';return 'selected'}
var LINE_WORDS={selected:'Selected',unsent:'Selected · not sent yet',sent:'Sent to us',confirmed:'Confirmed by Guest Relations'};
function stateWords(x){
  var k=lineKey(x);
  /* the spa: an interest, its time confirmed by Guest Relations, paid at the spa — said once, on the state (OQ-21 · PRQ-01-14) */
  if(x.interest&&x.id!=='guesthouse')return {t:'Interest · Guest Relations confirms your time · paid at the spa',on:true};
  /* a request is never a booking (L-09) */
  if(x.request)return {t:k==='confirmed'?'Confirmed by Guest Relations':k==='sent'?'Request sent · Guest Relations will confirm it':'Request · not sent yet',on:k==='sent'||k==='confirmed'};
  if(group(x)==='stay'){
    if(!ST.held(x))return {t:'No room chosen yet',open:true};
    var w=ST.unitWords(x);
    if(k==='confirmed')return {t:'Confirmed by Guest Relations'+(w?' · '+w:''),on:true};
    if(k==='sent')return {t:'Sent to us'+(w?' · '+w:''),on:true};
    return {t:w?w+' · held for you':'Held for you',on:true}}
  return {t:LINE_WORDS[k]||'Selected',on:true}}
/* the amount with its basis (TO-01830): “USD 100 per person” · “USD 180 for the table”; the Guest House is “Complimentary” (Owner, 24 Sep 2026: no zero price)
   (OQ-44); the spa has no cost line of its own (its state says “paid at the spa”, PRQ-01-14) */
function cost(x){
  if(x.interest&&x.id!=='guesthouse')return '';
  if(x.complimentary||x.id==='guesthouse')return 'Complimentary';
  if(x.price==null)return 'Amount on request';
  var q=x.qty||1,b=P&&P.lineBasis?String(P.lineBasis(x)||'').split(' · ')[0]:'';
  if(q<=1&&/^USD [\d,]+ /.test(b))return b;
  return money((x.price||0)*q)+(q>1?' · your total':' per person')}
function card(o){
  return '<article class="pf-card'+(o.on?' on':'')+'"'+(o.data?' data-profile-item="'+esc(o.data)+'"':'')+'>'+
    '<span class="pf-img"'+(o.img?' style="background-image:url('+esc(o.img)+')"':'')+' role="img" aria-label="'+esc(o.name)+'"></span>'+
    '<div class="pf-body">'+
      '<p class="t-l1">'+esc(o.when)+'</p>'+
      '<h3 class="t-h1">'+esc(o.name)+'</h3>'+
      (o.meta?'<p class="t-b2">'+esc(o.meta)+'</p>':'')+

    '<div class="p-actions"><a class="p-link" href="about-you.html">Open About You</a></div></div></section>'}
/* the document state as a key, its words once (PRQ-06-11): “Not added yet” · “Received” (a replaced file is “Received”) */
function docKey(id,kind){if(D.stateKey)return D.stateKey(id,kind);return D.get(id,kind)?'received':'none'}
function docWords(k){if(D.stateWords)return D.stateWords(k);return k==='received'?'Received':'Not added yet'}
function documents(me){
  var id=me.guestId,rows='';
  if(D)D.KINDS.forEach(function(k){var d=D.get(id,k.key),key=docKey(id,k.key);rows+='<p class="t-b2"><span class="t-l1'+(d?' on':'')+'">'+esc(k.label)+'</span> '+(d?esc(docWords(key))+(d.filename?' · '+esc(d.filename):'')+(d.receivedAt?' · '+day(d.receivedAt):''):esc(docWords('none'))+' — you can add it later')+'</p>'});
  /* PUBLICATION OF PHOTOGRAPHS (PRQ-06-17): “Yes” when given, “No” otherwise — no status word beside it */
  var c=D?D.consent(id):null;
  rows+='<p class="t-b2"><span class="t-l1'+(c?' on':'')+'">Publication of photographs</span> '+(c?'Yes':'No')+'</p>';
  return '<section class="prep-sec" id="documents"><p class="t-l1">Documents</p><div class="p-card" data-profile-documents><p class="t-l1">Travel documents</p><div class="pf-rows">'+rows+'</div>'+
    '<div class="p-actions"><a class="p-link" href="about-you.html#documents">Add or change documents</a></div></div></section>'}

/* ---- the photo: shown from memory, changed through the guest's own session ---- */
function paintAvatar(){
  var el=page.querySelector('[data-avatar]'),acts=page.querySelector('[data-photo-actions]');if(!el||!AV)return;
  AV.load().then(function(url){
    if(url){el.style.backgroundImage='url('+url+')';el.classList.add('has');el.setAttribute('aria-label','Change your profile photo');if(acts)acts.innerHTML='<button type="button" class="p-link" data-photo-add>Change photo</button><button type="button" class="p-link mute" data-photo-remove>Remove photo</button>'}
    else{el.style.backgroundImage='';el.classList.remove('has');el.setAttribute('aria-label','Add your profile photo');if(acts)acts.innerHTML='<button type="button" class="pf-photo-cta" data-photo-add>Add a photo</button>'}
    wirePhoto()})}
function wirePhoto(){
  var input=page.querySelector('[data-photo-input]'),note=page.querySelector('[data-photo-note]');if(!input)return;
  page.querySelectorAll('[data-photo-add]').forEach(function(b){b.onclick=function(){input.value='';input.click()}});
  page.querySelectorAll('[data-photo-remove]').forEach(function(b){b.onclick=function(){b.disabled=true;note.textContent='Removing…';AV.remove().then(function(r){note.textContent=r.ok?'Photo removed.':'We could not remove your photo just now. It is still in place — please try again.';paintAvatar()})}});
  input.onchange=function(){var f=input.files&&input.files[0];if(!f)return;note.textContent='Saving your photo…';AV.upload(f).then(function(r){note.textContent=r.ok?'Photo saved.':AV.refusal(r);paintAvatar()})}}

function render(){
  var p=G.party(),me=G.me();
  if(!p||!me){
    page.innerHTML='<div class="p-card">'+(G.stale()?'':'<p class="t-l1">Your invitation</p>')+'<h2 class="t-h1">'+(G.stale()?'Open your invitation once more':'Open your invitation')+'</h2>'+
      '<p class="t-b1 measure">Please open your invitation to see your profile.</p>'+
      '<p style="margin-top:16px"><button type="button" class="p-act" id="open">Open your invitation</button></p></div>';
    document.getElementById('open').addEventListener('click',function(){gated(render)});return}
  /* THE RETURN PAGE (Owner, 21 Sep 2026): the countdown, the community and the journey in numbers stand between the account and the arrangements */
  var CM=window.SIYL_COMMUNITY;
  /* A DECLINE (PRQ-01-04): a guest not joining this trip reads the identity, the contact and the reply — nothing of a trip they are not taking */
  var out=G.notJoining&&G.notJoining();
  page.innerHTML=out?identity(me,p)+contact()+status(p):identity(me,p)+contact()+(CM?CM.countdownHtml()+CM.communityHtml(CM.data(),me)+CM.numbersHtml():'')+status(p)+yourStay(me)+arrangements(me)+wedding(me,p)+tickets(me,p)+about(me)+documents(me);
  if(S&&S.wireRail)S.wireRail(page);
  if(CM&&!out){CM.wire(page);CM.paintPortraits(page);if(!CM.data())CM.load()}
  page.querySelectorAll('input[data-c]').forEach(function(i){var save=function(){G.setContact(i.getAttribute('data-c'),i.value.trim())};i.addEventListener('change',function(){var f=i.id;save();render();var n=document.getElementById(f);if(n)try{n.focus({preventScroll:true})}catch(e){}});i.addEventListener('blur',save)});
  /* SIGN OUT SAVES FIRST (PRQ-01-03): only when the latest change is kept does the device forget the guest; otherwise the guest
     stays signed in and reads why */
  var so=page.querySelector('[data-signout]');if(so)so.addEventListener('click',function(){var I=window.SIYL_INVITE,note=page.querySelector('[data-signout-note]');if(note)note.textContent='';
    if(!I||!I.leave){location.replace('invitation.html');return}
    so.disabled=true;Promise.resolve(I.leave()).then(function(r){so.disabled=false;if(r&&r.ok===false){if(note)note.textContent=r.words||'';return}location.replace('invitation.html')},function(){so.disabled=false})});
  paintAvatar();
  B.badge();
}
['siyl:bag','siyl:guest','siyl:seats','siyl:units','siyl:confirm','siyl:draft','siyl:docs','siyl:temple','siyl:invite-ready'].forEach(function(ev){document.addEventListener(ev,render)});
/* the community arrives or changes: only its own section is redrawn — a "Photo saved" note or a field being typed elsewhere on the page is never wiped */
document.addEventListener('siyl:community',function(){var CM=window.SIYL_COMMUNITY,old=document.getElementById('community'),me=G.me();if(!CM||!old||!me)return;var t=document.createElement('div');t.innerHTML=CM.communityHtml(CM.data(),me);var fresh=t.firstElementChild;if(!fresh)return;old.replaceWith(fresh);CM.wire(fresh);CM.paintPortraits(fresh)});
document.addEventListener('siyl:auth',function(){render();if(S)S.load(true);if(U)U.load(true);if(C)C.load(true);if(AV)AV.load(true).then(paintAvatar);if(window.SIYL_COMMUNITY)SIYL_COMMUNITY.load(true)});
/* a portrait changed on this device: the community's own tile follows (the read is the same authenticated one) */
document.addEventListener('siyl:avatar',function(){if(window.SIYL_COMMUNITY)SIYL_COMMUNITY.load(true)});
render();
if(G.party()){if(S)S.load();if(U)U.load();if(C)C.load()}
if(B.bar)B.bar();
})();
</script>
</body></html>
