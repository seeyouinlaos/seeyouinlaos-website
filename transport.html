<script>
/* ============================================================================
   TRANSPORT DETAIL — the same shell, the same frame and the same editorial
   grammar as a room page. Every fact comes from assets/transport-data.js and
   every amount from assets/pricing.js. Nothing is computed or invented here.
   ========================================================================== */
(function () {
  var id = new URLSearchParams(location.search).get('id') || 'train';
  var T = window.SIYL_TRANSPORT[id];
  /* AN UNKNOWN LEG (PRQ-07B-04 · RW-07-077): the page says it is not found — the same words as 404.html (PRQ-07B-03) —
     instead of silently showing The Journey as if it were the page that was asked for */
  if (!T) {
    document.title = 'Page not found · See You In Laos';
    document.getElementById('m').innerHTML = '<section class="intro" style="padding-top:64px"><p class="eyebrow">See You In Laos</p>' +
      '<h1>This page is not part of the journey.</h1>' +
      '<p class="body">The link may be old or mistyped — everything else is where you left it.</p></section>' +
      '<p class="backrow"><a href="journeys.html">Back to The Journey</a></p>' +
      '<p class="backrow" style="margin-top:10px"><a href="index.html">Home</a></p>';
    if (window.SIYL_BAG) SIYL_BAG.badge();
    return;
  }
  var P = window.SIYL_PRICE, F = P.FLAT[id];
  document.title = T.name + ' · See You In Laos';
  function esc(s) { return String(s).replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  var h = '';

  /* ---- the photographs, one scroll-snap track with a live counter ---- */
  h += '<div class="gal" id="gal"><div class="trk" id="trk">';
  T.gallery.forEach(function (g) {
    h += '<div class="ph" style="background-image:url(' + g[0] + ')" role="img" aria-label="' +
         esc(T.name) + ' — ' + esc(g[1]) + '"></div>';
  });
  h += '</div>';
  if (T.gallery.length > 1) h += '<button class="gn gp" aria-label="Previous photograph">&lsaquo;</button><button class="gn gx" aria-label="Next photograph">&rsaquo;</button>';
  h += '<span class="gl" id="gl">' + esc(T.gallery[0][1]) + '</span>';
  h += '<span class="gc" id="gc">1 / ' + T.gallery.length + '</span></div>';

  /* ---- THE JOURNEY ---- */
  h += '<section class="intro"><p class="eyebrow">' + esc(T.cat) + ' · ' + esc(T.operator) + '</p>';
  h += '<h1>' + esc(T.name) + '</h1>';
  h += '<p class="body">' + esc(T.dates) + ' · ' + esc(T.place) + '</p>';
  h += '<p class="body story">' + esc(T.story) + '</p></section>';

  h += '<div class="wrap tsec"><h2>The journey</h2><div class="facts">';
  T.facts.forEach(function (f) {
    h += '<div class="frow"><span class="fl">' + esc(f[0]) + '</span><span class="fv">' + esc(f[1]) + '</span></div>';
  });
  h += '</div></div>';

  /* ---- YOUR CABIN / SEAT · COMFORT · DINING · BAGGAGE · SERVICE ---- */
  h += '<section class="plane"><h2>What to expect</h2><div class="grp">';
  T.groups.forEach(function (g) {
    h += '<div class="gcol"><h3>' + esc(g[0]) + '</h3><ul class="amen">';
    g[1].forEach(function (a) { h += '<li>' + esc(a) + '</li>'; });
    h += '</ul></div>';
  });
  h += '</div></section>';

  /* ---- WHAT'S INCLUDED / WHAT IS NOT ---- */
  h += '<div class="wrap tsec"><h2>What is included</h2><div class="inc">';
  T.included.forEach(function (t) { h += '<p>' + esc(t) + '</p>'; });
  h += '</div>';
  if (T.excluded && T.excluded.length) {
    h += '<h2>What you arrange yourself</h2><div class="inc">';
    T.excluded.forEach(function (t) { h += '<p>' + esc(t) + '</p>'; });
    h += '</div>';
  }
  h += '</div>';

  /* ---- ARRIVAL & TRANSFER ---- */
  if (T.transfer && T.transfer.length) {
    h += '<div class="wrap tsec"><h2>Arrival &amp; transfer</h2><div class="inc">';
    T.transfer.forEach(function (t) { h += '<p>' + esc(t) + '</p>'; });
    h += '</div></div>';
  }

  /* ---- GOOD TO KNOW ---- */
  if (T.good && T.good.length) {
    h += '<div class="wrap tsec"><h2>Good to know</h2><div class="inc">';
    T.good.forEach(function (t) { h += '<p>' + esc(t) + '</p>'; });
    h += '</div></div>';
  }

  /* ---- the other three legs ---- */
  var others = window.SIYL_TRANSPORT_ORDER.filter(function (k) { return k !== id; });
  h += '<section class="others"><h2>The other legs of the journey</h2><div class="oc" id="oc">';
  /* THE FARE A GUEST CHOSE (PRQ-07B-01): a leg with two fares shows the chosen fare, or "From" the lower one before a choice */
  function lineOf(k) { return window.SIYL_BAG ? (SIYL_BAG.get().filter(function (x) { return x.id === k; })[0] || null) : null; }
  function fared(k) { return P.classesOf(k).length > 0; }
  function priceWords(k) {
    var l = lineOf(k);
    if (fared(k) && !l) return 'From ' + P.money(P.fromPrice(k));
    return P.money(l && l.price != null ? l.price : P.FLAT[k].price);
  }
  others.forEach(function (k) {
    var o = window.SIYL_TRANSPORT[k];
    h += '<a class="occard" href="transport.html?id=' + k + '">' +
      '<div class="ph" style="background-image:url(' + o.gallery[0][0] + ')"></div>' +
      '<div class="ot"><p class="oe">' + esc(o.dates) + '</p><p class="on">' + esc(o.name) + '</p>' +
      '<p class="od">' + esc(o.place) + '</p>' +
      '<p><span class="op" data-leg-price="' + k + '">' + priceWords(k) + '</span> <span class="oe">per person</span></p></div></a>';
  });
  h += '</div>';
  h += '<div class="rnav"><div class="rail" aria-hidden="true"><i id="rail"></i></div><span class="rc" id="rc">1 / ' + others.length + '</span><button type="button" id="op" aria-label="Previous leg">&lsaquo;</button><button type="button" id="ox" aria-label="Next leg">&rsaquo;</button></div>';
  h += '</section>';

  /* ---- the one decision, priced by assets/pricing.js and nothing else ---- */
  h += '<section class="buy"><p class="eyebrow" style="margin:0 0 8px">' + esc(T.cat) + '</p>';
  h += '<h2>' + esc(T.name) + '</h2><p class="eyebrow" style="margin:0">' + esc(T.place) + '</p>';
  h += '<div class="win"><p class="wl">' + esc(T.cat) + '</p><p class="wd">' + esc(T.dates) + '</p>';
  h += '<p class="price"><span id="price">' + priceWords(id) + '</span> <span class="pu">per person</span></p>';
  h += '<p class="per" id="per">' + esc(F.basis) + '</p>';
  /* the travel pass (Owner, 15 Sep 2026): the leg as a ticket, live with the guest's selection */
  h += '<div class="ticket" id="ticket"></div>';
  h += '<button class="cta" id="add">Add to My Bag</button>';
  /* a leg with two fares is chosen on its fare cards (The Journey), never added here in a fare the guest did not pick */
  if (fared(id)) h += '<a class="cta" id="choose" href="journeys.html#' + T.anchor + '" hidden>Choose your fare</a>';
  h += '<p class="ok" id="ok" hidden><a href="your-journey.html">Open My Trip</a> · <a href="cart.html">Open My Bag</a></p></div>';
  h += '<p class="note">Nothing is paid on this website. Guest Relations confirms every arrangement with you.</p></section>';
  h += '<p class="backrow"><a href="journeys.html#' + T.anchor + '">Back to The Journey</a></p>';

  document.getElementById('m').innerHTML = h;
  if (window.SIYL_BAG) SIYL_BAG.badge();

  /* gallery: the caption and the counter follow the real scroll position */
  var trk = document.getElementById('trk');
  if (trk && T.gallery.length > 1) {
    var gc = document.getElementById('gc'), gl = document.getElementById('gl'), gi = 0, raf = 0;
    function idx() { return Math.max(0, Math.min(T.gallery.length - 1, Math.round(trk.scrollLeft / trk.clientWidth))); }
    function sync() { raf = 0; var k = idx(); if (k === gi) return; gi = k; gl.textContent = T.gallery[k][1]; gc.textContent = (k + 1) + ' / ' + T.gallery.length; }
    trk.addEventListener('scroll', function () { if (!raf) raf = requestAnimationFrame(sync); }, { passive: true });
    function go(d) { var k = (idx() + d + T.gallery.length) % T.gallery.length; trk.scrollTo({ left: k * trk.clientWidth, behavior: 'smooth' }); }
    document.querySelector('.gp').addEventListener('click', function () { go(-1); });
    document.querySelector('.gx').addEventListener('click', function () { go(1); });
  }

  /* the other-legs rail: same behaviour as the room page */
  var oc = document.getElementById('oc'), rail = document.getElementById('rail'), rc = document.getElementById('rc');
  if (oc && rail) {
    var card = oc.querySelector('.occard');
    function paint() {
      var step = card.offsetWidth + 14;
      var k = Math.max(0, Math.min(others.length - 1, Math.round(oc.scrollLeft / step)));
      rail.style.width = (100 / others.length) + '%';
      rail.style.transform = 'translateX(' + (k * 100) + '%)';
      rc.textContent = (k + 1) + ' / ' + others.length;
    }
    oc.addEventListener('scroll', paint, { passive: true });
    document.getElementById('op').addEventListener('click', function () { oc.scrollBy({ left: -(card.offsetWidth + 14), behavior: 'smooth' }); });
    document.getElementById('ox').addEventListener('click', function () { oc.scrollBy({ left: card.offsetWidth + 14, behavior: 'smooth' }); });
    paint();
  }

  /* ADD / REMOVE — the same gate and the same bag as every other surface */
  function gated(fn) {
    if (window.SIYL_INVITE) { SIYL_INVITE.require(fn); }
    else document.addEventListener('siyl:invite-ready', function () { SIYL_INVITE.require(fn); }, { once: true });
  }
  /* ACCESS (Owner, 16 Sep 2026 · final IA): a transport page is private planning — fares, the class, the add — so
     without a session it hands over to the invitation page and comes back here after the code */
  gated(function () {});
  var btn = document.getElementById('add'), ok = document.getElementById('ok'), tk = document.getElementById('ticket'), choose = document.getElementById('choose');
  function paintTicket() {
    var TP = window.SIYL_TRAVELPASS; if (!TP || !TP.isLeg(id)) { tk.hidden = true; return; }
    var line = SIYL_BAG.get().filter(function (x) { return x.id === id; })[0] || null;
    /* before a fare is chosen the pass names no class (PRQ-07B-01) */
    if (fared(id) && !line) { tk.innerHTML = ''; tk.hidden = true; return; }
    tk.hidden = false;
    var cls = line ? line.cls : (P.classesOf(id).length ? P.classOf(id).slug : '');
    var price = line ? line.price : (P.classesOf(id).length ? P.classOf(id, cls).price : F.price);
    tk.innerHTML = TP.card(id, { selected: !!line, cls: cls, price: P.money(price) + ' <span class="t-l1">per person</span>', actions: line ? TP.button(id, true) : '' });
    TP.wire(tk);
  }
  function paintFare() {
    document.getElementById('price').textContent = priceWords(id);
    var per = document.getElementById('per'), l = lineOf(id);
    if (fared(id)) {
      per.textContent = l ? P.terms(P.classOf(id, l.cls).basis)
        : P.classesOf(id).slice().sort(function (a, b) { return a.price - b.price; }).map(function (c) { return c.short + ' ' + P.money(c.price); }).join(' · ');
    }
    document.querySelectorAll('[data-leg-price]').forEach(function (el) { el.textContent = priceWords(el.getAttribute('data-leg-price')); });
  }
  function paintAdd() {
    var has = SIYL_BAG.has(id);
    btn.textContent = has ? 'Remove from My Bag' : 'Add to My Bag';
    btn.classList.toggle('sel', has);
    if (choose) { choose.hidden = has; btn.hidden = !has; }
    ok.hidden = !has;
    paintFare();
    paintTicket();
  }
  btn.addEventListener('click', function () {
    if (SIYL_BAG.has(id)) { SIYL_BAG.remove(id); paintAdd(); return; }
    gated(function () { P.items(id).forEach(function (it) { SIYL_BAG.put(it); }); paintAdd(); var Wz = window.SIYL_WIZARD; if (Wz && Wz.active) Wz.done(Wz.stageOfWindow(id)); });
  });
  document.addEventListener('siyl:bag', paintAdd);
  /* THE PASS FOLLOWS THE TRIP (PRQ-07B-02 · PRQ-02-09): the send / confirm state is read here too, like tickets.html */
  document.addEventListener('siyl:confirm', paintTicket);
  document.addEventListener('siyl:draft', paintTicket);
  function loadState() { if (window.SIYL_CONFIRM && window.SIYL_GUEST && SIYL_GUEST.party && SIYL_GUEST.party()) SIYL_CONFIRM.load(); }
  document.addEventListener('siyl:auth', function () { paintAdd(); if (window.SIYL_CONFIRM) SIYL_CONFIRM.load(true); });
  loadState();
  paintAdd();
  if (SIYL_BAG.bar) SIYL_BAG.bar();
})();
</script>
</body></html>
