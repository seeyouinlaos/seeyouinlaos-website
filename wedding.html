<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Wedding · See You In Laos</title>
<style>
@font-face{font-family:'PP Editorial Old';src:url('assets/fonts/PPEditorialOld-Ultralight.otf') format('opentype');font-weight:200;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3EEE7;color:#313131;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;font-weight:300;font-size:14px;line-height:1.6}
.hd{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:14px 20px}
.hb{width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:5px;background:none;border:0;cursor:pointer}.hb i{display:block;width:20px;height:1.4px;background:#313131}
.bd{font-family:'PP Editorial Old',serif;font-weight:200;font-size:19px;text-align:center}.bd .dot{color:#8A5A55}
.bag{width:44px;height:44px;display:flex;align-items:center;justify-content:center;position:relative;color:#313131;text-decoration:none}.bag .bgi{display:block}
.bb{position:absolute;top:1px;right:0;min-width:14px;height:14px;padding:0 3px;background:#313131;color:#F3EEE7;font-size:8.5px;line-height:1;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px #F3EEE7;border-radius:1px}
</style>
<link rel="stylesheet" href="assets/aman.css"><link rel="stylesheet" href="assets/prep.css"></head><body>
<header class="hd"><button class="hb" aria-label="Menu"><i></i><i></i><i></i></button><div class="bd">see you in laos<span class="dot">.</span></div><a class="bag" href="your-journey.html" aria-label="Your Journey"><svg class="bgi" viewBox="0 0 26 26" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5.1 10.1h15.8a.9.9 0 0 1 .9 1l-.95 10.6a1.6 1.6 0 0 1-1.6 1.45H6.75a1.6 1.6 0 0 1-1.6-1.45L4.2 11.1a.9.9 0 0 1 .9-1z"/><path d="M8 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M13.4 10.1V8.3a2.5 2.5 0 0 1 5 0v1.8"/><path d="M5.6 14.2h14.8"/><path d="M12.2 13.2h1.6a.5.5 0 0 1 .5.5v1.6a.5.5 0 0 1-.5.5h-1.6a.5.5 0 0 1-.5-.5v-1.6a.5.5 0 0 1 .5-.5z"/></svg><span class="bb" data-bag-badge></span></a></header>
<main class="prep-page" id="wedding">
<div class="prep-head">
  <p class="t-l1">Sunday, 28 February 2027 · Vientiane</p>
  <h1 class="t-d1">The Wedding</h1>
  <p class="t-b1 measure">One day, four parts, all hosted by <span class="nb">Haruthai &amp; Suthep</span>. Each named guest answers each part for themselves, so every table, every car and every morning is prepared for the people who are actually there.</p>
</div>
<div id="page"></div>
<div id="foot"></div>
</main>
<script src="assets/bag.js"></script>
<script src="assets/shop-menu.js"></script>
<script src="assets/aman.js"></script>
<script src="assets/rooms-data.js"></script>
<script src="assets/pricing.js"></script>
<script src="assets/guest.js"></script>
<script src="assets/temple.js"></script>
<script src="assets/journey.js"></script>
<script src="assets/prep-shell.js"></script>
<script type="module" src="assets/invite.mjs"></script>
<script>
/* ============================================================================
   03 · THE WEDDING — a private decision module, not the public editorial page.
   The day in its order; under each part, one answer per named guest. The
   cultural background lives one tap away in the shell's own detail layer, and
   closing it returns the guest to the exact decision they were making.
   ========================================================================== */
(function(){
var P=window.SIYL_PREP,T=window.SIYL_TEMPLE,PR=window.SIYL_PRICE,G=window.SIYL_GUEST;
var page=document.getElementById('page');
if(!P||!T||!page)return;
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function gated(fn){if(window.SIYL_INVITE){SIYL_INVITE.require(fn)}
else document.addEventListener('siyl:invite-ready',function(){SIYL_INVITE.require(fn)},{once:true})}
var DRESS={temple:'Blue Lao Traditional Dress',coffee:'Black Tie',vows:'Black Tie',dinner:'Black Tie'};

var TAKBAT='<p class="t-l1">Part of the Temple Ceremony</p>'+
 '<h2 class="t-h1" style="margin-top:8px">Morning Alms-Giving · Tak Bat</h2>'+
 '<p class="t-b1 measure" style="margin-top:12px">Guests attending the Temple Ceremony are invited to take part in the traditional morning alms-giving, Tak Bat. This is the moment in which food is respectfully offered to Buddhist monks — one of the oldest ways a day begins in Laos.</p>'+
 '<p class="t-b1 measure" style="margin-top:12px">It is part of the Temple Ceremony, and there is <b>no separate charge for Tak Bat</b>. Nothing is arranged and nothing is paid: you simply take part.</p>';
var SANG='<p class="t-l1">Optional · within the Temple Ceremony</p>'+
 '<h2 class="t-h1" style="margin-top:8px">Sangkhathan · a personal offering</h2>'+
 '<p class="t-b1 measure" style="margin-top:12px">A Sangkhathan is a personal offering of useful everyday items for the monastic community, prepared in your name and presented by you.</p>'+
 '<p class="t-b1 measure" style="margin-top:12px">It is <b>not</b> the alms-giving. Tak Bat is the food offered during the ceremony and carries no charge; the Sangkhathan is separate, optional, and nobody needs one in order to attend. It is prepared for couples, as one decision for both: the USD 15 per person prepares your own offering — it is not an entrance, not a temple fee and not a wedding extra.</p>';

/* one answer row per named guest, under each part of the day */
function personRow(g,e,me){
  var id=g.guestId,mine=me.guestId===id,name=esc(G.nameOf(id)),v=T.eventOf(id,e.key);
  return '<div class="p-card flat" data-g="'+esc(id)+'" data-e="'+e.key+'">'+
    '<p class="t-l1'+(mine?' on':'')+'">'+esc(G.labelFor(id))+(mine?' · you':' · answering for '+name)+'</p>'+
    '<div class="p-selrow">'+
      '<button type="button" class="p-sel" aria-pressed="'+(v==='yes')+'" data-ev="yes">Attending</button>'+
      '<button type="button" class="p-sel" aria-pressed="'+(v==='no')+'" data-ev="no">Not attending</button>'+
    '</div>'+
    (v===null?'<p class="t-l1 open">Not decided</p>':'')+
    '</div>'}
/* E · SANGKHATHAN — one couple decision, explicit eligibility, no guessing.
 * PAIR: both named guests take part, or neither; available only while every
 * named guest is attending the Temple Ceremony. NONE: nothing to arrange.
 * Unresolved: a restrained line, no price, no action, no technical wording. */
function sangSection(p,me){
  var elig=T.eligibility(),names=p.guests.map(function(g){return esc(G.nameOf(g.guestId))});
  var h='<div class="p-card" id="sangkhathan" style="margin-top:var(--s5)"><p class="t-l1">Sangkhathan · personal giving</p>'+
    '<h3 class="t-h1">This part of the Temple Ceremony is prepared for couples.</h3>';
  if(elig==='NONE'){
    return h+'<p class="t-b1 measure">There is nothing you need to arrange for your invitation.</p>'+
      '<p class="p-more"><button type="button" class="p-link mute" data-more="sang">More about Sangkhathan</button></p></div>'}
  if(elig!=='PAIR'){
    return h+'<p class="t-b1 measure">Guest Relations will let you know if there is anything to arrange for your invitation.</p>'+
      '<p class="p-more"><button type="button" class="p-link mute" data-more="sang">More about Sangkhathan</button></p></div>'}
  var can=T.pairCan(),off=T.pairDecision(),missing=p.guests.filter(function(g){return !T.attendingOf(g.guestId)});
  h+='<p class="t-b1 measure">If you choose to take part, a personal Sangkhathan offering will be prepared for each of you to present yourselves.</p>';
  h+='<div class="p-group">'+p.guests.map(function(g){return '<div class="p-kv"><div><p class="t-b1"><b>'+esc(G.nameOf(g.guestId))+'</b></p></div><p class="t-l1 on">'+PR.money(15)+'</p></div>'}).join('')+
     '<div class="p-kv"><div><p class="t-l1">Total for your party</p></div><p class="t-l1 on">'+PR.money(15*p.guests.length)+'</p></div></div>';
  h+='<p class="p-more"><button type="button" class="p-link" data-more="sang">More about Sangkhathan</button></p>';
  if(can){
    h+='<div class="p-selrow" style="margin-top:16px">'+
      '<button type="button" class="p-sel" aria-pressed="'+(off==='yes')+'" data-off="yes">We would like to take part</button>'+
      '<button type="button" class="p-sel" aria-pressed="'+(off==='no')+'" data-off="no">Continue without Sangkhathan</button>'+
      '</div>'+
      (off===null?'<p class="t-l1 open">Not decided · one decision for <span class="nb">'+names.join(' &amp; ')+'</span></p>'
        :off==='yes'?'<p class="t-l1 on">Selected · '+PR.money(15*p.guests.length)+' for your party · <span class="nb">'+names.join(' &amp; ')+'</span></p>'
        :'<p class="t-l1 on">Continuing without Sangkhathan</p>')}
  else{
    h+='<p class="t-b2 measure" style="margin-top:12px">The offering is prepared for '+names.join(' and ')+' together. It becomes available once '+(missing.length===1?esc(G.nameOf(missing[0].guestId))+' has':'both of you have')+' chosen to attend the Temple Ceremony.</p>'}
  return h+'</div>'}

function render(){
  if(!P.ready()){
    page.innerHTML='<div class="p-card"><p class="t-l1">Your invitation</p>'+
      '<h2 class="t-h1">Open your invitation to answer</h2>'+
      '<p class="t-b1 measure">Each guest on your invitation answers the wedding day for themselves, by name — so we open your invitation first.</p>'+
      '<p style="margin-top:16px"><button type="button" class="p-act" id="open">Open my invitation</button></p></div>';
    var b=document.getElementById('open'); if(b)b.addEventListener('click',function(){gated(render)});
    return;
  }
  var p=P.party(),me=P.active(),others=p.guests.filter(function(g){return g.guestId!==me.guestId});
  var h='';
  /* the interaction boundary: whose answers these are */
  if(others.length){
    h+='<div class="p-for"><span class="t-l1">Answering for</span><b>'+esc(others.map(function(g){return G.nameOf(g.guestId)}).join(' & '))+'</b>'+
       '<span class="t-b2">You are continuing as '+esc(G.nameOf(me.guestId))+'. Answers you give for '+esc(others.map(function(g){return G.nameOf(g.guestId)}).join(' and '))+' are kept in '+(others.length===1?esc(G.nameOf(others[0].guestId))+'&rsquo;s name':'their own names')+' and say that you gave them.</span>'+
       others.map(function(g){return '<button type="button" class="p-link mute" data-switch="'+esc(g.guestId)+'">Switch to '+esc(G.nameOf(g.guestId))+'</button>'}).join('')+'</div>'}
  /* the day, in its order */
  T.EVENTS.forEach(function(e,i){
    h+='<section class="prep-sec" id="ev-'+e.key+'">'+
       '<p class="t-l1">0'+(i+1)+' · '+e.when+' · '+esc(e.place)+'</p>'+
       '<h2 class="t-h2">'+e.label+'</h2>'+
       '<p class="t-b2">'+(e.key==='temple'?'Optional participation · ':'Hosted · ')+'Dress · '+DRESS[e.key]+'</p>'+
       (e.key==='temple'
         ?'<p class="t-b1 measure">The Buddhist morning at Wat Ong Teu. Guests attending are invited to take part in the traditional morning alms-giving, Tak Bat — food respectfully offered to the monks, with no separate charge.</p>'+
          '<p class="p-more"><button type="button" class="p-link" data-more="takbat">More about Tak Bat</button></p>'
         :'')+
       p.guests.map(function(g){return personRow(g,e,me)}).join('')+
       (e.key==='temple'?sangSection(p,me):'')+
       '</section>'});
  page.innerHTML=h;

  page.querySelectorAll('[data-switch]').forEach(function(b){
    b.addEventListener('click',function(){P.setActive(b.getAttribute('data-switch'))})});
  page.querySelectorAll('[data-g]').forEach(function(card){
    var id=card.getAttribute('data-g'),key=card.getAttribute('data-e');
    card.querySelectorAll('[data-ev]').forEach(function(b){
      b.addEventListener('click',function(){T.setEvent(id,key,b.getAttribute('data-ev'));render()})});
  });
  /* the couple decision is asked once, by the person continuing */
  page.querySelectorAll('#sangkhathan [data-off]').forEach(function(b){
    b.addEventListener('click',function(){var id=me.guestId;T.setOffering(id,b.getAttribute('data-off'));render()})});
  page.querySelectorAll('[data-more]').forEach(function(b){
    b.addEventListener('click',function(){P.drawer(b.getAttribute('data-more')==='takbat'?TAKBAT:SANG)})});
  P.foot(document.getElementById('foot'));
}
document.addEventListener('siyl:who',render);
document.addEventListener('siyl:guest',render);
document.addEventListener('siyl:auth',render);
render();
if(window.SIYL_BAG&&SIYL_BAG.bar)SIYL_BAG.bar();
})();
</script>
</body></html>
